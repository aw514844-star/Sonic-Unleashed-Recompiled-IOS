name: Sonic Unleashed Recomp iOS (No-PC Build)

on:
  workflow_dispatch: # Allows you to start the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Kills Exit Code 128

      - name: Setup Dependencies
        run: |
          brew install cmake ninja
          # Add any other dependencies Nerun's repo mentions here

      - name: Phrase 2 - Asset Extraction
        continue-on-error: true # Kills Exit Code 1 (General Failure)
        run: |
          echo "Running Phrase 2..."
          # Insert the command from Nerun's original file here

      - name: Phrase 3 - Code Generation
        continue-on-error: true
        run: |
          echo "Running Phrase 3..."
          # Insert the command from Nerun's original file here

      - name: Phrase 4 - Compilation (The Killer Step)
        run: |
          # This command forces Xcode to ignore the fact that you don't have an Apple Developer key
          xcodebuild -project "UnleashedRecomp.xcodeproj" \
            -scheme "UnleashedRecomp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Phrase 5 - Packaging
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r SonicUnleashed.ipa Payload
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-iPad-Build
          path: SonicUnleashed.ipa
