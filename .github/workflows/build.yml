name: Build IPA

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-13
steps:
- uses: actions/checkout@v4

```
  - run: sudo xcode-select -s /Applications/Xcode_15.4.app

  - run: rm -rf ~/Library/Developer/Xcode/DerivedData

  - name: Find project
    id: proj
    run: echo "proj=$(find . -name '*.xcodeproj' | head -n 1)" >> $GITHUB_OUTPUT

  - name: Find scheme
    id: scheme
    run: echo "scheme=$(xcodebuild -list -project ${{ steps.proj.outputs.proj }} | awk '/Schemes:/ {getline; print}' | xargs)" >> $GITHUB_OUTPUT

  - run: xcodebuild -project "${{ steps.proj.outputs.proj }}" -scheme "${{ steps.scheme.outputs.scheme }}" -sdk iphoneos CODE_SIGNING_ALLOWED=NO build

  - run: |
      mkdir Payload
      APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
      cp -r "$APP" Payload
      cd Payload
      zip -r ../app.ipa .

  - uses: actions/upload-artifact@v4
    with:
      name: ipa
      path: app.ipa
```
