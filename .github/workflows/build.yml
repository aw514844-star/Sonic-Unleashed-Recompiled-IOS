name: Build IPA

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-13

```
steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Set Xcode
    run: sudo xcode-select -s /Applications/Xcode_15.4.app

  - name: Clean
    run: rm -rf ~/Library/Developer/Xcode/DerivedData

  - name: Build
    run: xcodebuild -scheme "$(xcodebuild -list | awk '/Schemes:/ {getline; print}' | xargs)" -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  - name: Create IPA
    run: |
      mkdir Payload
      APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
      cp -r "$APP" Payload
      cd Payload
      zip -r ../app.ipa .

  - name: Upload
    uses: actions/upload-artifact@v4
    with:
      name: ipa
      path: app.ipa
```
