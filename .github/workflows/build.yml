name: Flawless Sonic Unleashed iOS Build
on: 
  workflow_dispatch: # Allows you to start the build manually with a button

jobs:
  build-port:
    runs-on: macos-14 # This uses the M1/M2 Cloud Mac for fastest speeds
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Essential for pulling in engine dependencies

      - name: Setup Build Environment
        run: |
          brew install cmake ninja sdl2
          sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Configure for iOS (No Signing)
        # We set CODE_SIGNING_ALLOWED to NO so the build doesn't crash 
        # looking for certificates.
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_ENTITLEMENTS="" \
            -DCMAKE_XCODE_ATTRIBUTE_BITCODE_ENABLED=NO

      - name: Compile Game Engine
        run: |
          cd build
          ninja

      - name: Prepare Unsigned IPA
        run: |
          mkdir -p build/Payload
          # This moves the compiled app into the standard iOS structure
          cp -r build/*.app build/Payload/
          cd build
          zip -r SonicUnleashed_Unsigned.ipa Payload/

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-iOS-Package
          path: build/SonicUnleashed_Unsigned.ipa
