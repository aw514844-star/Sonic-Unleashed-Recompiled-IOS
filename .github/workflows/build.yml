name: Build IPA

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-13
steps:
- uses: actions/checkout@v4

```
  - run: sudo xcode-select -s /Applications/Xcode_15.4.app

  - run: rm -rf ~/Library/Developer/Xcode/DerivedData

  - name: Build directly
    run: xcodebuild -scheme "$(xcodebuild -list | awk '/Schemes:/ {getline; print}' | xargs)" -sdk iphoneos CODE_SIGNING_ALLOWED=NO build

  - name: Make IPA
    run: |
      mkdir Payload
      APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
      cp -r "$APP" Payload
      cd Payload
      zip -r ../app.ipa .

  - uses: actions/upload-artifact@v4
    with:
      name: ipa
      path: app.ipa
```
