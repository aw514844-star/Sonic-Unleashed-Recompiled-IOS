name: Nuclear Force Patch (Exit Code 1 Fix)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create Force-Pass Toolchain
        # This creates a file that overrides CMake's internal logic
        run: |
          cat <<EOF > force_ios.cmake
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_SYSTEM_PROCESSOR arm64)
          set(CMAKE_OSX_ARCHITECTURES arm64)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_C_COMPILER_WORKS 1)
          set(CMAKE_CXX_COMPILER_WORKS 1)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED NO)
          EOF

      - name: Force Configure
        run: |
          mkdir -p build && cd build
          # We point CMake to our 'Nuclear' toolchain file
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=../force_ios.cmake \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DENABLE_SIGNING=OFF \
            -DENABLE_TESTING=OFF

      - name: Execute Build
        run: |
          cd build
          ninja -j $(sysctl -n hw.ncpu)

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          find build -name "*.app" -type d -exec cp -r {} build/Payload/ \;
          cd build
          zip -r SonicUnleashed_Port.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fixed-Sonic-Build
          path: build/SonicUnleashed_Port.ipa
