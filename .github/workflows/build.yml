name: Build Unsigned IPA (No PC)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Build the Project
        run: |
          # Create build directory
          mkdir -p build
          cd build
          
          # Run CMake with No-Signing flags for iOS
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGN_IDENTITY="" \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_BUILD_TYPE=Release

          # Start compilation
          ninja

      - name: Package IPA
        run: |
          # 1. Create the Payload folder (required for IPA structure)
          mkdir -p Payload
          
          # 2. Find the .app folder automatically, wherever it is
          APP_FOLDER=$(find . -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_FOLDER" ]; then
            echo "Error: The compiler didn't create a .app file. Check the build logs above."
            exit 1
          fi
          
          echo "Found App at: $APP_FOLDER"
          
          # 3. Copy the app into the Payload folder
          cp -r "$APP_FOLDER" Payload/
          
          # 4. Zip it into an IPA
          zip -r Neuron-Unleashed.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Unsigned-IPA
          path: Neuron-Unleashed.ipa
