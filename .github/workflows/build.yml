name: Unsigned Unleashed Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build_unsigned:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          brew install cmake ninja
          # Ensure we are using a modern Xcode version
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Fix for Phase 4: Pre-creating directories sometimes prevents Error 1
      - name: Pre-Build Setup
        run: |
          mkdir -p build
          mkdir -p output

      - name: Archive Unsigned
        run: |
          xcodebuild archive \
            -project "UnleashedRecompiOS.xcodeproj" \
            -scheme "UnleashedRecompiOS" \
            -archivePath ./build/Unleashed.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ENTITLEMENTS_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      # This converts the .xcarchive into a folder you can actually use
      - name: Prepare Output
        run: |
          mv ./build/Unleashed.xcarchive/Products/Applications/*.app ./output/ 2>/dev/null || cp -R ./build/Unleashed.xcarchive ./output/
          
      - name: Upload Unsigned App
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Unsigned
          path: ./output/
