name: Nuclear Bypass Exit Code 1
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject Bypass Toolchain
        run: |
          cat <<EOF > bypass.cmake
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_SYSTEM_PROCESSOR arm64)
          # These lines stop CMake from trying to run test programs
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_C_COMPILER_WORKS 1)
          set(CMAKE_CXX_COMPILER_WORKS 1)
          set(CMAKE_C_ABI_COMPILED 1)
          set(CMAKE_CXX_ABI_COMPILED 1)
          
          # Force skip common error-prone checks
          set(HAVE_FLAG_SEARCH_PATH_W_HIDDEN 1)
          set(HAVE_FLAG_W_HIDDEN 1)
          
          # Disable Apple signing checks
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY "")
          EOF

      - name: Force Configure
        run: |
          mkdir -p build && cd build
          # We use -C to load our bypass file as a 'cache' to overwrite project defaults
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=../bypass.cmake \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_TESTING=OFF \
            -DENABLE_SIGNING=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build and Package
        run: |
          cd build
          ninja -j 10
          mkdir -p Payload
          find . -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r SonicUnleashed_iOS.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Unsigned
          path: build/SonicUnleashed_iOS.ipa
