name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          set +e
          # 1. Build to a specific folder we can reach
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Inject and Package
        run: |
          # 2. START FRESH: Prevent any folder-in-folder loops
          rm -rf StagingArea
          mkdir -p StagingArea/Payload/Unleashed.app
          
          # 3. DIRECT BINARY CAPTURE: Find the engine itself, not the folder
          # This finds the big 11MB file and moves it exactly to where iLoader looks
          RAW_BINARY=$(find ./BuildDir -type f -size +1M | head -n 1)
          cp "$RAW_BINARY" StagingArea/Payload/Unleashed.app/UnleashedRecomp
          chmod +x StagingArea/Payload/Unleashed.app/UnleashedRecomp

          # 4. IDENTITY INJECTION: CFBundleExecutable MUST match the binary name above
          cat <<EOF > StagingArea/Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 5. ASSET INJECTION: Shove your .xex and shader.ar into the heart of the app
          cp UnleashedRecompLib/Private/* StagingArea/Payload/Unleashed.app/ || true
          
          # 6. FINAL ZIP: Only zip the Payload folder
          cd StagingArea
          zip -r ../Unleashed_Standard.ipa Payload
          cd ..
          
          echo "FINAL IPA SIZE: $(stat -f%z Unleashed_Standard.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
