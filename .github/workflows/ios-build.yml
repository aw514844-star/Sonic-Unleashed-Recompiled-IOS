name: SURGICAL_STRIKE_BUILD
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout & Force Engine Download
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Fixing Missing Engine Files
        # This fixes the '5 folders 1 file' issue by pulling the real code
        run: |
          git submodule update --init --recursive --force || true
          # Verify if code actually exists now
          ls -R UnleashedRecompLib | grep "CMakeLists.txt" || echo "ENGINE STILL MISSING"

      - name: 3. Asset Injection (720p/Smooth Mode)
        run: |
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "default.xexp" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          # Performance tweaks for iPad 9 (A13/3GB RAM)
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true

      - name: 4. The Build
        run: |
          brew install glslang molten-vk vulkan-headers || true
          # Simplified build command to prevent path errors
          xcodebuild build -project "UnleashedRecomp.xcodeproj" -scheme "UnleashedRecomp" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: 5. Final Hunt
        run: |
          mkdir -p Payload
          # Hunt for the .app in the DerivedData folder (the hidden build spot)
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          
          if [ -n "$(ls -A Payload 2>/dev/null)" ]; then
            zip -r9 Sonic_Unleashed_iPad.ipa Payload
          else
            echo "STILL EMPTY: The build failed to create the app. Check logs for Step 4."
            exit 1
          fi

      - name: 6. Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Final
          path: Sonic_Unleashed_iPad.ipa
