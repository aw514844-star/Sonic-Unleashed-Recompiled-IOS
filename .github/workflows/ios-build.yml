name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build_job:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          set +e
          # Force build into a dedicated 'BuildProduct' folder
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildProduct \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Permanent Inject and Package
        run: |
          # 1. Create a clean Payload folder in a SEPARATE directory
          mkdir -p PackageDir/Payload/Unleashed.app
          
          # 2. Hunt ONLY in the BuildProduct folder to avoid identical loops
          APP_PATH=$(find ./BuildProduct -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" PackageDir/Payload/Unleashed.app/
          fi

          # 3. Identity Injection (Info.plist) - Fixes Sideload Errors
          cat <<EOF > PackageDir/Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 4. Binary Renaming (Fixes Black Icon / Crash)
          cd PackageDir/Payload/Unleashed.app/
          BINARY=$(find . -maxdepth 1 -type f -size +1M | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
          fi
          chmod +x UnleashedRecomp
          cd ../../../

          # 5. Manual Asset Injection (Forces your .xex and .ar in)
          cp UnleashedRecompLib/Private/* PackageDir/Payload/Unleashed.app/ || true
          
          # 6. Pack Standard IPA
          cd PackageDir
          zip -r ../Unleashed_Final.ipa Payload
          cd ..
          
          echo "IPA READY: $(stat -f%z Unleashed_Final.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Final.ipa
