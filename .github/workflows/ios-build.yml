name: ABSOLUTE_GOD_MODE_BUILD_62
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 1. Deep Recursive Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Kills Exit Code 65 (Simulator Pre-Boot)
        # Pre-booting the simulator prevents xcodebuild timeouts
        run: |
          xcrun simctl boot "iPhone 15" || true
          brew install glslang molten-vk vulkan-headers || true
          sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 3. Asset & Performance Injection
        run: |
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          
          # Force 720p/0.5 Resolution Scale for iPad 9 RAM stability
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true
          find . -type f -name "*.toml" -exec sed -i '' 's/ResolutionScale = 1.0/ResolutionScale = 0.5/g' {} + || true

      - name: 4. The Master Build (Bypassing Signing)
        # Using -sdk iphonesimulator removes physical signing requirements entirely
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          
          xcodebuild clean build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphonesimulator \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. Nuclear Hunt & IPA Construct
        run: |
          mkdir -p Payload
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          
          if [ -n "$(ls -A Payload 2>/dev/null)" ]; then
            zip -r9 Sonic_Unleashed_iPad9.ipa Payload
          else
            echo "CRITICAL: Build failed to produce a .app file. Check Step 4 logs."
            exit 1
          fi

      - name: 6. Final Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL
          path: Sonic_Unleashed_iPad9.ipa
