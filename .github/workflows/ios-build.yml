name: Fixed Sonic Build
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: 1. Pull Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Force Assets to Private Folder
        run: |
          mkdir -p ./UnleashedRecompLib/private/
          # Copy your files from ANY folder they might be in
          cp -v default.xex ./UnleashedRecompLib/private/ || cp -v game_files/default.xex ./UnleashedRecompLib/private/ || true
          cp -v default.xexp ./UnleashedRecompLib/private/ || cp -v game_files/default.xexp ./UnleashedRecompLib/private/ || true
          cp -v shader.ar ./UnleashedRecompLib/private/ || cp -v game_files/shader.ar ./UnleashedRecompLib/private/ || true
          cp -v shader.arl ./UnleashedRecompLib/private/ || cp -v game_files/shader.arl ./UnleashedRecompLib/private/ || true

      - name: 3. Set Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 4. Master Build
        run: |
          xcodebuild archive \
          -scheme "UnleashedRecomp" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          -archivePath build/Unleashed.xcarchive || true

      - name: 5. Hunt and Package IPA
        run: |
          mkdir -p Payload
          # Search everywhere for the .app folder so we don't get a 1KB file
          find build/Unleashed.xcarchive -name "*.app" -type d -exec cp -r {} Payload/ \;
          
          # Check if Payload is empty and show error if so
          if [ -z "$(ls -A Payload)" ]; then
            echo "BUILD FAILED: No app found. IPA will be empty!"
            exit 1
          fi
          
          zip -r Unleashed_HD.ipa Payload

      - name: 6. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-HD-iPad
          path: Unleashed_HD.ipa
