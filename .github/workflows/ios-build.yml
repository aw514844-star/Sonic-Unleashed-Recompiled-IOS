name: Sonic Unleashed Final - BUILD 202
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config

      - name: Generate Xcode Project & Build
        run: |
          # 1. Create a build directory for CMake
          mkdir -p build_xcode
          
          # 2. Generate the .xcodeproj file specifically for iOS
          # This creates the project file that was missing
          cmake -S . -B build_xcode \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

          # 3. Build using the newly generated project
          cmake --build build_xcode --config Release --target UnleashedRecompiOSD -- -sdk iphoneos

      - name: Ultimate Final Inject
        run: |
          # 1. SETUP STRUCTURE
          mkdir -p Payload/Unleashed.app/private
          
          # 2. FIND AND MOVE THE COMPILED APP
          # CMake usually puts the .app in build_xcode/Release-iphoneos/
          BUILT_APP=$(find build_xcode -name "UnleashedRecompiOSD.app" -type d | head -n 1)
          if [ -d "$BUILT_APP" ]; then
            cp -r "$BUILT_APP/" Payload/Unleashed.app/
          else
            echo "ERROR: Compiled .app not found!"
            exit 1
          fi
          
          # 3. INJECT GAME ASSETS
          # Moves your .xex and .ar files from UnleashedRecompLib/private
          if [ -d "UnleashedRecompLib/private" ]; then
            cp -v UnleashedRecompLib/private/* Payload/Unleashed.app/private/
          elif [ -d "UnleashedRecompLib/Private" ]; then
            cp -v UnleashedRecompLib/Private/* Payload/Unleashed.app/private/
          fi

          # 4. CONFIG & METAL SETTINGS
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          FullScreen = true
          EOF

          # 5. INFO.PLIST (iPad 9 / File Sharing / Full Screen)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key
