name: Sonic Unleashed Final - IPAD 9 OPTIMIZED
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          mkdir -p BuildDir
          PROJ_PATH=$(find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) | grep -v "thirdparty" | head -n 1)
          
          if [[ -z "$PROJ_PATH" ]]; then 
            echo "::error::No Xcode project or workspace found!"
            exit 1
          fi
          
          if [[ "$PROJ_PATH" == *.xcworkspace ]]; then
            TYPE_FLAG="-workspace"
          else
            TYPE_FLAG="-project"
          fi
          
          xcodebuild build \
            $TYPE_FLAG "$PROJ_PATH" \
            -scheme "UnleashedRecompiOSD" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Ultimate Final Inject
        run: |
          APP_DIR="Payload/Unleashed.app"
          mkdir -p "$APP_DIR/private"
          
          RAW_BINARY=$(find ./BuildDir -type f -exec file {} + | grep "Mach-O 64-bit" | grep "arm64" | cut -d: -f1 | head -n 1)
          
          cp "$RAW_BINARY" "$APP_DIR/UnleashedRecompiOSD"
          chmod +x "$APP_DIR/UnleashedRecompiOSD"
          
          # Config and Plist generation omitted for brevity but remain as you wrote them
          
          zip -ry Unleashed_Final.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
