name: Nerun Metal - Freetype Fix
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Missing Libraries
        run: |
          # Fixing the 'Could NOT find Freetype' error
          brew install cmake ninja freetype zlib libpng

      - name: Build Metal Binary (With Library Paths)
        shell: bash
        run: |
          mkdir -p build_ios
          
          # Pointing CMake directly to the Homebrew Freetype location
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_METAL=ON \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib

          # The build step
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -scheme UnleashedRecomp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: Verify and Package
        run: |
          mkdir -p package/Payload
          APP_PATH=$(find ./final_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL: Build failed to create .app."
            exit 1
          fi
          
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Unleashed_Metal.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-iPad-Metal
          path: Unleashed_Metal.ipa
