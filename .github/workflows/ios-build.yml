name: Build Sonic Unleashed iOS (Permanent Ironclad Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: brew install cmake ninja pkg-config

      - name: Setup vcpkg (Full Permanent URL)
        run: |
          rm -rf vcpkg
          # The full URL is mandatory to prevent Error 128
          git clone --depth 1 https://github.com vcpkg
          ./vcpkg/bootstrap-vcpkg.sh
          # Build core libraries specifically for physical iOS devices (arm64)
          ./vcpkg/vcpkg install sdl2 freetype fmt curl --triplet arm64-ios

      - name: Configure and Build (Metal + iPad 9)
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$(pwd)/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_METAL=ON \
            -DGRAPHICS_API=Metal \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_CXX_FLAGS="-O3 -flto -miphoneos-version-min=15.0"
          
          cmake --build build --target UnleashedRecomp

      - name: Validate and Package IPA (No-Empty-IPA Guard)
        run: |
          mkdir -p Payload/Unleashed.app/private

          # Binary Discovery: Ensures the engine actually compiled
          BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f -perm +111 | head -n 1)
          if [ -z "$BINARY_PATH" ]; then
            echo "::error::BUILD FAILURE: The engine binary was not found!"
            exit 1
          fi

          # Asset Sync: default.xex, default.xexp, shader.ar
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          if [ -d "UnleashedRecompLib/private" ] && [ "$(ls -A UnleashedRecompLib/private)" ]; then
            cp -R UnleashedRecompLib/private/. Payload/Unleashed.app/private/
            echo "Core assets successfully bundled into IPA."
          fi

          # Info.plist: iPad 9 File Sharing & Memory Optimizations
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>com.apple.developer.kernel.increased-memory-limit</key><true/>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string><string>metal</string></array>
              <key>CFBundleIconFiles</key><array><string>icon.png</string></array>
          </dict>
          </plist>
          EOF

          # Final verification and zero-compression packaging
          zip -0ry Sonic_Unleashed_iPad9_Final.ipa Payload
          
          IPA_SIZE=$(stat -f%z "Sonic_Unleashed_iPad9_Final.ipa")
          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "::error::CRITICAL: IPA is too small. Build is likely empty!"
            exit 1
          fi

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad9-Final
          path: Sonic_Unleashed_iPad9_Final.ipa
