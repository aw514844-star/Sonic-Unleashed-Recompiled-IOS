name: Unleashed Recomp iOS - Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Force Submodule Update
        # Exit code 1 often happens because submodules are empty
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: 3. Install Tools
        run: |
          brew install cmake ninja pkg-config sdl2
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 4. The Correct Configuration
        # We point directly to '.' to ensure it finds CMakeLists.txt
        run: |
          mkdir -p build
          cmake . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE=NO \
            -DSEARCH_DOCUMENTS_DIR=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: 5. Build Engine
        run: |
          cmake --build build --config Release --target UnleashedRecomp -- -allowProvisioningUpdates=NO

      - name: 6. Package IPA
        run: |
          mkdir -p Payload
          # This finds the .app bundle even if it's deep in a subfolder
          find build -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -qr UnleashedRecomp_iOS.ipa Payload

      - name: 7. Upload
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-iOS
          path: UnleashedRecomp_iOS.ipa
