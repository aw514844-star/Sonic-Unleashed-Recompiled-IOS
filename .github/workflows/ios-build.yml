name: Unleashed Recomp - TITAN v3 (FINAL)
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Build Environment
        run: brew install ninja cmake shaderc glslang

      - name: Build Engine (TITAN v4 Zero-Error)
        run: |
          rm -rf build_ios
          
          # LAYER 1: THE CACHE LOCKDOWN
          cat <<EOF > titan.cmake
          set(fmt_FOUND TRUE CACHE BOOL "" FORCE)
          set(Freetype_FOUND TRUE CACHE BOOL "" FORCE)
          set(FREETYPE_FOUND TRUE CACHE BOOL "" FORCE)
          set(CURL_FOUND TRUE CACHE BOOL "" FORCE)
          set(SDL2_FOUND TRUE CACHE BOOL "" FORCE)
          
          set(FREETYPE_INCLUDE_DIRS "${GITHUB_WORKSPACE}/thirdparty/freetype/include" CACHE PATH "" FORCE)
          set(FREETYPE_INCLUDE_DIR_ft2build "${GITHUB_WORKSPACE}/thirdparty/freetype/include" CACHE PATH "" FORCE)
          set(FREETYPE_LIBRARY "${GITHUB_WORKSPACE}/thirdparty/freetype/libfreetype.a" CACHE FILEPATH "" FORCE)
          set(FREETYPE_LIBRARIES "${GITHUB_WORKSPACE}/thirdparty/freetype/libfreetype.a" CACHE FILEPATH "" FORCE)
          
          set(CURL_INCLUDE_DIR "${GITHUB_WORKSPACE}/thirdparty/curl/include" CACHE PATH "" FORCE)
          set(CURL_INCLUDE_DIRS "${GITHUB_WORKSPACE}/thirdparty/curl/include" CACHE PATH "" FORCE)
          set(CURL_LIBRARY "${GITHUB_WORKSPACE}/thirdparty/curl/libcurl.a" CACHE FILEPATH "" FORCE)
          set(CURL_LIBRARIES "${GITHUB_WORKSPACE}/thirdparty/curl/libcurl.a" CACHE FILEPATH "" FORCE)
          
          set(SDL2_INCLUDE_DIR "${GITHUB_WORKSPACE}/thirdparty/SDL/include" CACHE PATH "" FORCE)
          set(SDL2_INCLUDE_DIRS "${GITHUB_WORKSPACE}/thirdparty/SDL/include" CACHE PATH "" FORCE)
          set(SDL2_LIBRARY "${GITHUB_WORKSPACE}/thirdparty/SDL/libSDL2.a" CACHE FILEPATH "" FORCE)
          set(SDL2_LIBRARIES "${GITHUB_WORKSPACE}/thirdparty/SDL/libSDL2.a" CACHE FILEPATH "" FORCE)
          EOF
          
          # LAYER 2: SHELL ENVIRONMENT OVERRIDE
          export C_INCLUDE_PATH="${GITHUB_WORKSPACE}/thirdparty/fmt/include:${GITHUB_WORKSPACE}/thirdparty/freetype/include:${GITHUB_WORKSPACE}/thirdparty/curl/include:${GITHUB_WORKSPACE}/thirdparty/SDL/include"
          export CPLUS_INCLUDE_PATH="$C_INCLUDE_PATH"
          export LIBRARY_PATH="${GITHUB_WORKSPACE}/thirdparty/freetype:${GITHUB_WORKSPACE}/thirdparty/curl:${GITHUB_WORKSPACE}/thirdparty/SDL"

          # LAYER 3: THE COMPILER TRIGGER
          cmake -S . -B build_ios -G Ninja \
            -C titan.cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_JIT=ON \
            -DFALLBACK_INTERPRETER=ON \
            -DOPTIMIZE_FOR_A13=ON \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DUSE_INTERNAL_FMT=ON \
            -DGENERATE_SPIRV=ON \
            -DMSDFGEN_USE_FREETYPE=ON \
            -DMSDFGEN_BUILD_STANDALONE=OFF \
            -DENABLE_NETWORKING=OFF

          # EXECUTION: Build with full CPU power
          cmake --build build_ios --config Release --parallel $(sysctl -n hw.ncpu)

      - name: The Verification (Red or Green)
        run: |
          # We search for the actual executable. No fake successes allowed.
          EXE_PATH=$(find build_ios -type f -perm +111 ! -name "*.a" ! -name "*.dylib" ! -path "*/.*" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            echo "❌ BUILD FAILED: No executable was produced. Check compiler logs above."
            exit 1
          fi
          
          echo "✅ BUILD SUCCESS: Binary found at $EXE_PATH"
          mkdir -p Payload/Unleashed.app
          cp "$EXE_PATH" Payload/Unleashed.app/UnleashedRecompiOSD
          
          # Info.plist Injection
          printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string><key>CFBundleIdentifier</key><string>com.unleashed.recomp</string><key>CFBundleName</key><string>Unleashed</string><key>CFBundlePackageType</key><string>APPL</string><key>LSRequiresIPhoneOS</key><true/><key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array><key>UIFileSharingEnabled</key><true/></dict></plist>' > Payload/Unleashed.app/Info.plist
          
          zip -ry Unleashed_Final.ipa Payload

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-Build
          path: Unleashed_Final.ipa
