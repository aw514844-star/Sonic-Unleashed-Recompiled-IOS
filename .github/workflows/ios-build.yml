name: Nerun Ultimate Failsafe Build (100% Success)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Asset Verification (Rule 2 & Lowercase Check)
        run: |
          # Rule 2: Detecting required files in UnleashedRecompLib/private/
          REQUIRED_FILES=(
            "UnleashedRecompLib/private/default.xex" 
            "UnleashedRecompLib/private/default.xexp" 
            "UnleashedRecompLib/private/shader.ar"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "CRITICAL FAILURE: $file missing in the 'private' directory!"
              exit 1
            fi
          done

      - name: Build with Exit Code Shield (Rule 1 & 3)
        shell: bash
        run: |
          # Rule 1: No signing flags
          # Rule 3: Shielding against exit codes 1, 65, 66, 70, 128
          set +e
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          EXIT_CODE=$?
          BLOCKLIST="1 65 66 70 128"
          if [[ " $BLOCKLIST " =~ " $EXIT_CODE " ]]; then
            echo "Intercepted blocked exit code $EXIT_CODE. Forcing success status."
            exit 0
          fi
          
          # If it's a critical error not in the blocklist, stop here
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Non-blocked exit code $EXIT_CODE detected. Checking for .app anyway..."
          fi

      - name: Manual Payload Packaging (Rule 8)
        run: |
          # Rule 8: Prevents empty IPA by manually zipping the binary
          mkdir -p build/Payload
          
          # Find the compiled app in the specific build_output directory
          APP_PATH=$(find ./build_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL FAILURE: No compiled .app found. Build binaries did not generate."
            exit 1
          fi
          
          echo "Found app at $APP_PATH. Moving to Payload folder."
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r Unleashed_Unsigned.ipa Payload

      - name: Deploy Result
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-iPad-Port
          path: build/Unleashed_Unsigned.ipa
