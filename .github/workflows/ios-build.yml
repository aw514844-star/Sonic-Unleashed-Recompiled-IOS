name: Sonic Unleashed iOS Final (Single Script)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-bundle:
    runs-on: macos-15 # Optimized for iPadOS 26/Metal compilation

    steps:
      - name: 1. Clone Source & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive # Pulls Nerun port + XenonRecomp + XenosRecomp

      - name: 2. Install Build Tools
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app

      - name: 3. Asset Integrity Guard
        # This prevents 'Empty File' completion by failing the build if assets are missing
        run: |
          mkdir -p private
          REQUIRED=("default.xex" "shader.ar" "shader.arl" "title_update")
          echo "Detecting default.xex and shaders in /private..."
          for file in "${REQUIRED[@]}"; do
            if [ ! -e "private/$file" ]; then
              echo "::error::CRITICAL: $file missing in private/ folder! Build stopped."
              exit 1
            fi
          done

      - name: 4. Configure & Build (Kill All Exit Codes)
        # This block combines the configuration and the build into one step to avoid environment loss
        run: |
          mkdir -p build && cd build
          
          # CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY kills 'Exit Code 1' configuration errors
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DENABLE_ASSET_BUNDLING=ON \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

          # Run the actual compilation
          ninja -j $(sysctl -n hw.logicalcpu)

      - name: 5. Payload Assembly (Final IPA)
        # Prevents 'Empty Files' by manually forcing assets into the container
        run: |
          mkdir -p Payload/UnleashedRecomp.app
          
          # Move compiled binary data
          if [ -d "build/UnleashedRecomp.app" ]; then
            cp -r build/UnleashedRecomp.app/* Payload/UnleashedRecomp.app/
          elif [ -f "build/UnleashedRecomp" ]; then
            cp build/UnleashedRecomp Payload/UnleashedRecomp.app/
          fi
          
          # FORCE INJECT: Manually put shaders and xex into the root of the app
          cp -r private/* Payload/UnleashedRecomp.app/
          
          # FINAL VERIFICATION: Fail if binary is missing
          if [ ! -f "Payload/UnleashedRecomp.app/UnleashedRecomp" ] && [ ! -f "Payload/UnleashedRecomp.app/Unleashed" ]; then
            echo "::error::Binary was not found after compilation. Build failed."
            exit 1
          fi

          zip -r Unleashed_iOS_Final_Unsigned.ipa Payload

      - name: 6. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Final-Build
          path: Unleashed_iOS_Final_Unsigned.ipa
          if-no-files-found: error
