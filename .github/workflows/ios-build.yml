name: Sonic Unleashed iOS Ultimate Success

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15 # Matches iPadOS 26.x requirements

    steps:
      - name: 1. Fetch Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Setup Environment
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app

      - name: 3. Verify Private Assets (Stop Empty Files)
        run: |
          mkdir -p private
          # The script looks specifically for these in your 'private' folder
          REQUIRED=("default.xex" "shader.ar" "shader.arl" "title_update")
          for f in "${REQUIRED[@]}"; do
            if [ ! -e "private/$f" ]; then
              echo "::error::MISSING $f in /private folder. Build KILLED to save time."
              exit 1
            fi
          done

      - name: 4. Configure & Build (KILL EXIT CODE 1)
        run: |
          mkdir -p build && cd build
          
          # The KEY: -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          # This forces CMake to skip the signing-check that causes Exit Code 1.
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

          # Immediate Build Execution
          ninja -j $(sysctl -n hw.logicalcpu)

      - name: 5. Manual Assembly (Fix Everything)
        run: |
          mkdir -p Payload/UnleashedRecomp.app
          
          # Copy Binary (Checking both potential names)
          if [ -d "build/UnleashedRecomp.app" ]; then
            cp -r build/UnleashedRecomp.app/* Payload/UnleashedRecomp.app/
          fi
          
          # FORCE INJECT: Manually move your shaders and xex into the IPA
          cp -r private/* Payload/UnleashedRecomp.app/
          
          # Integrity Check: Fail if the binary is missing
          if [ ! -f "Payload/UnleashedRecomp.app/UnleashedRecomp" ] && [ ! -f "Payload/UnleashedRecomp.app/Unleashed" ]; then
            echo "::error::BUILD FAILED: Binary was not produced. Check Ninja logs above."
            exit 1
          fi

          zip -r Sonic_Unleashed_iPadOS_Success.ipa Payload

      - name: 6. Deliver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-IPA-Final
          path: Sonic_Unleashed_iPadOS_Success.ipa
