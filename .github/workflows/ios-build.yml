name: Sonic Unleashed Final - IPAD 9 OPTIMIZED
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine (iPad 9 Target)
        run: |
          mkdir -p BuildDir
          # Finds your actual project, skipping thirdparty/concurrentqueue
          XCODE_PROJ=$(find . -not -path "*/thirdparty/*" -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          xcodebuild build \
            -project "$XCODE_PROJ" \
            -scheme "UnleashedRecompiOSD" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Ultimate Final Inject (JIT & KSign Ready)
        run: |
          mkdir -p Payload/Unleashed.app/private
          
          # Find and copy binary (Mach-O arm64)
          RAW_BINARY=$(find ./BuildDir -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | grep "arm64" | cut -d: -f1 | head -n 1)
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecompiOSD
          chmod +x Payload/Unleashed.app/UnleashedRecompiOSD
          
          # 1. IPAD 9 OPTIMIZED CONFIG
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          [Core]
          UseJIT = true
          FallbackToInterpreter = true
          [Display]
          AspectRatio = "4:3"
          FitScreen = true
          EOF

          # 2. INJECT ASSETS (.xex, .xexp, shader.ar)
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/private/
          fi
          
          # 3. KSIGN JIT ENTITLEMENTS
          cat <<EOF > Payload/Unleashed.app/entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 4. iPad 9 NATIVE INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundleDisplayName</key><string>Sonic Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>200</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF
          
          zip -ry Unleashed_Final.ipa Payload

      - name: Upload Verified Release
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad9-Release
          path: Unleashed_Final.ipa
