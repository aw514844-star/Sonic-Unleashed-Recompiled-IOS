name: Sonic Unleashed Final Success

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 1. Clone Everything
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Toolchain Prep
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app

      - name: 3. Asset Integrity Guard
        run: |
          mkdir -p private
          # We check for these specifically. If missing, the build stops so you know.
          REQUIRED=("default.xex" "shader.ar" "shader.arl")
          for f in "${REQUIRED[@]}"; do
            if [ ! -e "private/$f" ]; then
              echo "::error::CRITICAL: private/$f is missing! Upload it to your repo to avoid an empty game."
              exit 1
            fi
          done

      - name: 4. Build Engine (Kills Exit Code 1)
        run: |
          mkdir -p build && cd build
          
          # This flag tells the runner to skip the signing 'test' that crashes with Exit Code 1
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

          ninja -v -j $(sysctl -n hw.logicalcpu)

      - name: 5. Manual Bundle (No Empty IPA)
        run: |
          mkdir -p Payload/Unleashed.app
          
          # Force search for the compiled binary
          BINARY=$(find build -type f -maxdepth 3 -perm +111 ! -name "*.plist" ! -name "*.d" | head -n 1)
          
          if [ -z "$BINARY" ]; then
            echo "::error::FAILURE: Binary not produced. Check Ninja logs above for C++ errors."
            exit 1
          fi

          cp "$BINARY" Payload/Unleashed.app/UnleashedRecomp
          cp -r private/* Payload/Unleashed.app/
          
          # Write a clean Info.plist so the iPad can launch the game
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.recomp.unleashed</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>MinimumOSVersion</key><string>15.0</string>
          </dict>
          </plist>
          EOF

          zip -r Sonic_Unleashed_Success.ipa Payload

      - name: 6. Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad-Build
          path: Sonic_Unleashed_Success.ipa
