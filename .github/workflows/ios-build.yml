name: Sonic Unleashed Final - ULTIMATE
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        run: |
          # 1. ENSURE CODE IS HERE
          git submodule update --init --recursive

          # 2. FIND PROJECT (Ignoring thirdparty strictly)
          # We look for the xcodeproj that is closest to the root and NOT in thirdparty
          PROJECT_FILE=$(find . -name "*.xcodeproj" -not -path "*/thirdparty/*" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "STILL NOT FOUND. Listing every single xcodeproj in the repo:"
            find . -name "*.xcodeproj"
            echo "Searching for workspaces instead..."
            PROJECT_FILE=$(find . -name "*.xcworkspace" -not -path "*/thirdparty/*" | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "CRITICAL: The main game project is MISSING from the repo."
            echo "Current Directory Content:"
            ls -F
            exit 1
          fi

          echo "TARGET PROJECT FOUND: $PROJECT_FILE"

          # 3. BUILD
          xcodebuild build -project "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Emergency Inject & Fix
        run: |
          mkdir -p Payload/Unleashed.app
          
          # MAGIC NUMBER FIX
          RAW_BINARY=$(find ./DerivedData -name "UnleashedRecomp" -type f | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi

          if [ -z "$RAW_BINARY" ]; then exit 1; fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # SIZE FIX (50MB Goal)
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          [ -d "UnleashedRecompLib/Private" ] && cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/
          
          # Grab all assets
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" \) -not -path "./DerivedData/*" -not -path "*/thirdparty/*" -exec cp -r {} Payload/Unleashed.app/ \; || true

          # INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
          </dict></plist>
          EOF

          zip -r Unleashed_Final.ipa Payload
          echo "FINAL SIZE: $(du -sh Unleashed_Final.ipa)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
