name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build_job:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          set +e
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Permanent Inject and Package
        run: |
          mkdir -p FinalOut/Payload/Unleashed.app
          
          # 1. THE QUIET HUNT: 2>/dev/null stops the "No such file" crash
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" FinalOut/Payload/Unleashed.app/
          fi

          # 2. Identity Injection
          cat <<EOF > FinalOut/Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 3. Binary Renaming (Matches Info.plist)
          cd FinalOut/Payload/Unleashed.app/
          BINARY=$(find . -maxdepth 1 -type f -size +1M 2>/dev/null | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
            chmod +x UnleashedRecomp
          fi
          cd ../../../

          # 4. Final Data Injection
          cp UnleashedRecompLib/Private/* FinalOut/Payload/Unleashed.app/ || true
          
          # 5. Pack Standard IPA
          cd FinalOut
          zip -r ../Unleashed_Standard.ipa Payload
          cd ..
          
          echo "IPA READY: $(stat -f%z Unleashed_Standard.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
