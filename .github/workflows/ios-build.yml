name: Sonic Unleashed Final
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          set +e
          # Added -derivedDataPath so we know exactly where the 'magic' files are
          xcodebuild build -scheme "UnleashedRecomp" -sdk iphoneos -configuration Release -derivedDataPath ./BuildDir CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Emergency Inject
        run: |
          mkdir -p Payload/Unleashed.app
          
          # 1. Improved Search: Look for Mach-O executables specifically to avoid 'Magic Number' errors
          # This looks for files in the build folder that are over 1MB and are actual binaries
          RAW_BINARY=$(find ./BuildDir -type f -size +1M -perm +111 2>/dev/null | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then 
            RAW_BINARY=$(find . -type f -size +1M -perm +111 | head -n 1); 
          fi
          
          # 2. Force rename and permissions
          if [ -n "$RAW_BINARY" ]; then
            echo "Found binary at: $RAW_BINARY"
            cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
            chmod +x Payload/Unleashed.app/UnleashedRecomp
          else
            echo "ERROR: No valid executable binary found!"
            exit 1
          fi

          # 3. Standard Identity Card (Your original Plist)
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>UnleashedRecomp</string><key>CFBundleIdentifier</key><string>com.unleashed.recomp</string><key>CFBundleName</key><string>Unleashed</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string><key>LSRequiresIPhoneOS</key><true/><key>MinimumOSVersion</key><string>15.0</string></dict></plist>' > Payload/Unleashed.app/Info.plist
          
          # 4. Move private files (shv, xex, etc)
          cp UnleashedRecompLib/Private/* Payload/Unleashed.app/ || true
          
          # 5. Zip
          zip -r Unleashed_Standard.ipa Payload
          echo "IPA SIZE: $(stat -f%z Unleashed_Standard.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
