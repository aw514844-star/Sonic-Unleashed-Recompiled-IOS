name: Unleashed Recomp - Titan v17.0
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 1.0 - Initializing Environment
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2.0 - Installing Host Toolchain
        run: |
          brew install ninja cmake shaderc glslang
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: 3.0 - Sovereign Surgery (Dependency Lockdown)
        run: |
          # Structure Cleanup
          mkdir -p UnleashedRecompLib/ppc UnleashedRecompLib/private build_host build_ios

          # Fix Deprecation & Library Search Failures (adds cmake_minimum_required if missing)
          find . -name "CMakeLists.txt" -print0 | xargs -0 perl -pi -e 's/cmake_minimum_required\(VERSION [23]\.[0-9]\)/cmake_minimum_required(VERSION 3.10)/g'
          
          # Force submodules
          find . -name "CMakeLists.txt" -print0 | xargs -0 perl -pi -e 's/find_package\((fmt.*)\)/add_subdirectory(thirdparty\/fmt EXCLUDE_FROM_ALL)/gI'

      - name: 4.0 - Build Setup (No Code Signing)
        run: |
          # Setup toolchain for iOS without Xcode project
          export IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -Bbuild_ios \
            -G "Ninja" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK \
            -DCMAKE_C_FLAGS="-fembed-bitcode" \
            -DCMAKE_CXX_FLAGS="-fembed-bitcode" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: 5.0 - Compiling
        run: |
          cmake --build build_ios --target install

      - name: 6.0 - Package Artifacts
        run: |
          mkdir -p Payload
          # Assuming target produces a binary, move it to Payload
          cp -r install/* Payload/
          zip -r "UnleashedRecomp_Titan_v17.0.ipa" Payload
          
      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-iOS
          path: "*.ipa"
