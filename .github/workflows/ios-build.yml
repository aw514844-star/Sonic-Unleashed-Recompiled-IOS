name: Nerun Metal - PRE-SOLVED 97
on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Deps
        run: brew install cmake ninja freetype sdl2 libpng zlib || true

      - name: 3. Pre-Solved Project Generation
        shell: bash
        run: |
          mkdir -p build_ios
          # We manually set EVERY result that causes the scan to crash
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DENABLE_METAL=ON -DCMAKE_C_COMPILER_WORKS=1 -DCMAKE_CXX_COMPILER_WORKS=1 \
            -DHAVE_ABS=1 -DHAVE_QSORT=1 -DHAVE_BSEARCH=1 \
            -DHAVE_SETENV=1 -DHAVE_UNSETENV=1 -DHAVE_PUTENV=1 \
            -DHAVE_MALLOC=1 -DHAVE_FREE=1 -DHAVE_CALLOC=1 -DHAVE_REALLOC=1 \
            -DHAVE_STRTOD=1 -DHAVE_MPROTECT=1 -DHAVE_SIGNAL=1 -DHAVE_GETENV=1 \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib

      - name: 4. The Real Build
        shell: bash
        run: |
          xcodebuild build \
            -project build_ios/*.xcodeproj -alltargets -configuration Release -sdk iphoneos \
            -derivedDataPath ./final_output CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES -quiet
          
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: 5. Binary Rescue
        run: |
          mkdir -p package/Payload
          APP_PATH=$(find . -name "*.app" -type d | grep -v "Payload" | head -n 1)
          if [ -z "$APP_PATH" ]; then exit 1; fi
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Unleashed_Metal_97.ipa Payload

      - name: 6. Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-Metal-iPad-97
          path: Unleashed_Metal_97.ipa
