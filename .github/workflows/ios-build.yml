name: Unleashed Recomp - Titan v19.0 (Ultimate)
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 1.0 - Initializing Environment
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2.0 - Installing Toolchain
        run: |
          brew install ninja cmake shaderc glslang
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: 3.0 - The Ultimate Surgery
        run: |
          mkdir -p UnleashedRecompLib/ppc UnleashedRecompLib/private build_host build_ios
          
          # 1. FORCE DELETE ALL "FIND_PACKAGE" CALLS
          # This stops the 'Could not find fmt' and 'Could not find CURL' errors instantly.
          find . -name "CMakeLists.txt" -exec sed -i '' '/find_package(fmt/d' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' '/find_package(CURL/d' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' '/find_package(SDL2/d' {} +
          
          # 2. MANUALLY CREATE VERSION FILES
          # This prevents the permission error at the end of configuration.
          echo '#define RECOMP_VERSION "1.0.0"' > UnleashedRecomp/version.h
          echo 'const char* recomp_version = "1.0.0";' > UnleashedRecomp/version.cpp
          find . -name "CMakeLists.txt" -exec sed -i '' 's/generate_version_info.*//g' {} +

          # 3. DIRECT LINKING
          # Tells the game exactly where its parts are located.
          find . -name "CMakeLists.txt" -exec sed -i '' 's/fmt::fmt/fmt/g' {} +
          sed -i '' '1i\
          add_subdirectory(thirdparty/fmt EXCLUDE_FROM_ALL)\
          add_subdirectory(thirdparty/curl EXCLUDE_FROM_ALL)\
          ' CMakeLists.txt

          # 4. SHADER PLACEHOLDERS
          # Prevents the "spirv.h not found" error during the engine build.
          find . -name "*.hlsl" -exec touch {}.spirv.h \; 2>/dev/null || true

      - name: 4.0 - Building Host Tools
        run: |
          cmake -S . -B build_host -G Ninja -DPLATFORM_X64=ON -DGENERATE_SPIRV=OFF -DMSDF_ATLAS_USE_SKIA=OFF
          cmake --build build_host --target file_to_c

      - name: 5.0 - Building Engine (A13 Optimized)
        run: |
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -fPIC -Wno-everything" \
            -DUSE_METAL=ON \
            -DPLATFORM_IOS=ON \
            -DGENERATE_SPIRV=OFF \
            -Dfile_to_c_EXECUTABLE=$(pwd)/build_host/file_to_c \
            -DPRIVATE_FILES_DIR="$(pwd)/UnleashedRecompLib/private" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

          cmake --build build_ios --parallel $(sysctl -n hw.ncpu)

      - name: 6.0 - Packaging (Ultimate)
        run: |
          # The Smart-Search looks for the finished executable in any subfolder
          BIN_PATH=$(find build_ios -maxdepth 5 -type f -perm +111 ! -name "*.a" ! -name "*.dylib" ! -name "file_to_c" | head -n 1)
          if [ -z "$BIN_PATH" ]; then echo "Binary not found!" && exit 1; fi
          
          mkdir -p Payload/Unleashed.app
          cp "$BIN_PATH" Payload/Unleashed.app/UnleashedRecomp
          
          # Custom Info.plist for iPad 9 support
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
            <key>CFBundleIdentifier</key><string>com.nerun.unleashed</string>
            <key>CFBundleName</key><string>Unleashed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeRight</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          </dict></plist>
          EOF
          
          zip -ry Unleashed_Ultimate.ipa Payload

      - name: 7.0 - Final Delivery
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Ultimate
          path: Unleashed_Ultimate.ipa
