name: TRY_62_ARCHIVE_FORCE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Clone & Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Setup Assets
        run: |
          git submodule update --init --recursive --force || true
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true

      - name: 3. The "Unsigned Archive" (The Final Stand)
        run: |
          brew install glslang molten-vk vulkan-headers || true
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          
          # ARCHIVE instead of BUILD. This is the last way to kill Code 65.
          xcodebuild archive \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $PWD/build/Unleashed.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 4. The Hunt & IPA Package
        run: |
          mkdir -p Payload
          # Archive puts the app in a very specific folder:
          cp -rv build/Unleashed.xcarchive/Products/Applications/*.app Payload/ || true
          
          if [ -z "$(ls -A Payload 2>/dev/null)" ]; then
            echo "STILL EMPTY: Trying emergency hunt..."
            find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          fi
          
          if [ -z "$(ls -A Payload 2>/dev/null)" ]; then exit 1; fi
          zip -r9 Sonic_Unleashed_iPad9.ipa Payload

      - name: 5. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Final-62
          path: Sonic_Unleashed_iPad9.ipa
