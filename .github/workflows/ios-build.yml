name: ZERO_RESISTANCE_FINAL_BUILD
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 1. Absolute Recursive Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Ensures the recompilation engine is pulled
          fetch-depth: 0

      - name: 2. Fix Exit Code 65 (Simulator Pre-Boot)
        # Booting the simulator early fixes 90% of Exit 65 timeout errors
        run: |
          xcrun simctl boot "iPhone 15" || true
          brew install glslang molten-vk vulkan-headers || true
          sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 3. iPad 9 RAM "Lifeline" Injection
        run: |
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          
          # Force 720p/0.5 scale so the 3GB RAM iPad 9 doesn't crash on load
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true
          find . -type f -name "*.toml" -exec sed -i '' 's/ResolutionScale = 1.0/ResolutionScale = 0.5/g' {} + || true
          
          # Inject 'Extended Virtual Addressing' key to help A13 handle HD assets
          find . -name "Info.plist" -exec sed -i '' '/<dict>/a \
          <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>' {} + || true

      - name: 4. Indestructible Master Build
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          
          # Clean build + Ad-hoc sign identity "-" prevents signing-related Code 65
          xcodebuild clean build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. Nuclear Hunt & IPA Construct
        run: |
          mkdir -p Payload
          # Search everywhere for the app generated by the 'build' command
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          
          if [ -n "$(ls -A Payload 2>/dev/null)" ]; then
            zip -r9 Sonic_Unleashed_iPad9.ipa Payload
          else
            echo "CRITICAL: Build failed to produce a .app file. Check Step 4 logs."
            exit 1
          fi

      - name: 6. Final Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL-IPA
          path: Sonic_Unleashed_iPad9.ipa
