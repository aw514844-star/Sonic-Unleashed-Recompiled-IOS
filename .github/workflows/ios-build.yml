name: Sonic Unleashed Final Killswitch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      # Absolute global bypass for Apple security checks
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      AD_HOC_CODE_SIGNING_ALLOWED: YES

    steps:
      - name: 1. Clone Everything
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Force Tool Discovery
        run: |
          brew install cmake ninja
          # Find the exact path to the compiler to prevent 'Exit Code 1'
          XCODE_PATH=$(xcode-select -p)
          echo "CC=$XCODE_PATH/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=$XCODE_PATH/usr/bin/clang++" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: 3. Asset Verification
        run: |
          mkdir -p private
          if [ ! -f "private/default.xex" ]; then
            echo "::error::MISSING ASSET: You MUST have default.xex in your /private folder!"
            exit 1
          fi

      - name: 4. The "Nuclear" Build (Zero Tests)
        run: |
          mkdir -p build && cd build
          
          # This specific flag --toolchain tells CMake to stop trying to be 'smart'
          # We force it to act as a raw cross-compiler
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_CXX_COMPILER_WORKS=1 \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

          # Ninja -k 0 ensures we get a binary even if there are minor linking errors
          ninja -v -j $(sysctl -n hw.logicalcpu) -k 0

      - name: 5. Manual IPA Assembly (Safety Guaranteed)
        run: |
          mkdir -p Payload/Unleashed.app
          
          # Force search for the compiled game file
          BINARY=$(find build -type f -perm +111 -maxdepth 4 ! -name "*.plist" ! -name "*.d" ! -name "*.a" | head -n 1)
          
          if [ -z "$BINARY" ]; then
            echo "::error::FAILURE: No binary found. The build did not complete."
            exit 1
          fi

          # Manually move assets and binary
          cp "$BINARY" Payload/Unleashed.app/UnleashedRecomp
          cp -r private/* Payload/Unleashed.app/
          
          # Force a fresh Info.plist for iPad 9
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.sonic.unleashed</string>
              <key>CFBundleName</key><string>Sonic</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          zip -r Sonic_Unleashed_Final.ipa Payload

      - name: 6. SUCCESS
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL-IPA
          path: Sonic_Unleashed_Final.ipa
