name: Sonic Unleashed - OMEGA v8
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Total Dependency Nuclear Strike
        run: |
          # Installing everything the engine could possibly dream of needing
          brew install cmake ninja pkg-config freetype libpng zlib curl openssl@3 fmt sdl2 glm glslang shaderc libogg libvorbis opus
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Generate & Build (Metal/iOS/Total-Fix)
        run: |
          mkdir -p build_ios
          # Path Mapping for every possible library
          export FT_PATH=$(brew --prefix freetype)
          export PNG_PATH=$(brew --prefix libpng)
          export CURL_PATH=$(brew --prefix curl)
          export SSL_PATH=$(brew --prefix openssl@3)
          export FMT_PATH=$(brew --prefix fmt)
          export SDL2_PATH=$(brew --prefix sdl2)
          export GLSL_PATH=$(brew --prefix glslang)
          
          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE=NO \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DUNLEASHED_RECOMP_GENERATE_SHADERS=ON \
            -DSHADERC_LIB_DIR="$(brew --prefix shaderc)/lib" \
            -DFREETYPE_INCLUDE_DIRS="$FT_PATH/include/freetype2" \
            -DFREETYPE_LIBRARY="$FT_PATH/lib/libfreetype.a" \
            -DPNG_INCLUDE_DIRS="$PNG_PATH/include" \
            -DPNG_LIBRARY="$PNG_PATH/lib/libpng.a" \
            -DCURL_INCLUDE_DIR="$CURL_PATH/include" \
            -DCURL_LIBRARY="$CURL_PATH/lib/libcurl.a" \
            -Dfmt_DIR="$FMT_PATH/lib/cmake/fmt" \
            -DSDL2_DIR="$SDL2_PATH/lib/cmake/SDL2" \
            -DOPENSSL_ROOT_DIR="$SSL_PATH" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DSDL_STATIC=ON \
            -DSDL_METAL=ON \
            -DMSDFGEN_BUILD_STANDALONE=OFF

          # Execute the massive build
          cmake --build build_ios --config Release --target UnleashedRecompiOSD -- -sdk iphoneos

      - name: Construct Verified IPA (Rare Error Protection)
        run: |
          rm -rf Payload Unleashed_Final.ipa
          mkdir -p Payload/Unleashed.app/private
          
          BUILT_APP=$(find build_ios -name "UnleashedRecompiOSD.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$BUILT_APP" ]; then BUILT_APP=$(find build_ios -name "*.app" -type d | head -n 1); fi
          
          cp -a "$BUILT_APP/" Payload/Unleashed.app/
          
          # Force Metal and Disable Analytics (Prevents rare startup crashes)
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          FullScreen = true
          [Core]
          EnableAnalytics = false
          EOF

          # Hardened Info.plist
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIFileSharingEnabled</key><true/>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          chmod -R 755 Payload/Unleashed.app/
          zip -ry Unleashed_Final.ipa Payload

      - name: Final Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad-TOTAL-FIX-v8
          path: Unleashed_Final.ipa
