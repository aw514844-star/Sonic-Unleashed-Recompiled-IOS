name: ABSOLUTE_ZERO_SONIC_BUILD
on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 1. Deep Clone Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Install Graphics Dependencies
        run: |
          brew install glslang molten-vk vulkan-headers || true
          sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 3. Asset Injection & Smooth 720p Tweaks
        run: |
          mkdir -p UnleashedRecompLib/private/
          # Specifically hunting for shader.arl and game assets
          find . -name "default.xex" -exec cp {} UnleashedRecompLib/private/ \; || true
          find . -name "default.xexp" -exec cp {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar" -exec cp {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.arl" -exec cp {} UnleashedRecompLib/private/ \; || true
          
          # FORCING 720p & 0.5 SCALE (The "Smoothness" Fix for iPad 9)
          # This replaces 1080p with 720p and cuts render load in half to prevent RAM crashes
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.json" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.json" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true
          find . -type f -name "*.toml" -exec sed -i '' 's/ResolutionScale = 1.0/ResolutionScale = 0.5/g' {} + || true
          find . -type f -name "*.toml" -exec sed -i '' 's/TargetFPS = 60/TargetFPS = 30/g' {} + || true

      - name: 4. The Master Build
        run: |
          xcodebuild archive \
          -project "UnleashedRecomp.xcodeproj" \
          -scheme "UnleashedRecomp" \
          -sdk iphoneos \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          -archivePath build/Unleashed.xcarchive || echo "Build log check..."

      - name: 5. The Ultimate Hunt
        run: |
          mkdir -p Payload
          # Grabbing the app and ensuring assets are inside
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -r {} Payload/ \; || true
          
          if [ -n "$(ls -A Payload 2>/dev/null)" ]; then
            zip -r9 Sonic_Unleashed_Smooth_720p.ipa Payload
          else
            echo "IPA EMPTY: Check if UnleashedRecompLib folder has files!"
            exit 1
          fi

      - name: 6. Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-iPad9-720p
          path: Sonic_Unleashed_Smooth_720p.ipa
