name: Sonic Unleashed iOS Final (No Errors)

on:
  workflow_dispatch: # Manual start
  push:
    branches: [ main, master ]

jobs:
  build-and-bundle:
    runs-on: macos-15 # Matches iPadOS 26.x SDK requirements

    steps:
      - name: 1. Pull Sources (Inclusive)
        uses: actions/checkout@v4
        with:
          submodules: recursive # Pulls all Xenon/Xenos/Nerun source code automatically

      - name: 2. Force Environment Ready
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app
          # Set architecture specifically for iPad 9 (A13)
          echo "ARCHS=arm64" >> $GITHUB_ENV

      - name: 3. Strict Asset Verification
        # This prevents the "empty file" issue by failing early if your files are missing
        run: |
          ASSET_DIR="private"
          declare -a FILES=("default.xex" "shader.ar" "shader.arl" "title_update")
          
          echo "Checking private folder for Xbox 360 assets..."
          for f in "${FILES[@]}"; do
            if [ ! -e "$ASSET_DIR/$f" ]; then
              echo "::error::MISSING FILE: $ASSET_DIR/$f. YOU MUST UPLOAD THIS TO YOUR REPO."
              exit 1
            fi
          done
          echo "All assets verified."

      - name: 4. Configure CMake (Kill Signing & Errors)
        # These specific XCODE_ATTRIBUTE flags solve "Exit Code 1"
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

      - name: 5. Compile Project
        run: |
          cd build
          ninja -j $(sysctl -n hw.logicalcpu)

      - name: 6. Build IPA & Prevent Empty Files
        run: |
          mkdir -p Payload/UnleashedRecomp.app
          
          # Move compiled app data
          cp -r build/*.app/* Payload/UnleashedRecomp.app/ || true
          
          # Force injection of your private assets directly into the IPA
          cp -r private/* Payload/UnleashedRecomp.app/
          
          # CRITICAL CHECK: Ensure the binary actually exists
          if [ ! -f "Payload/UnleashedRecomp.app/UnleashedRecomp" ]; then
            echo "::error::BUILD FAILED: Binary not created. Check ninja logs above."
            exit 1
          fi
          
          # Final check: Ensure shaders are in the bundle
          if [ ! -f "Payload/UnleashedRecomp.app/shader.ar" ]; then
            echo "::error::ASSET ERROR: Shaders were not copied. Check 'private' folder path."
            exit 1
          fi

          zip -r Unleashed_iPadOS_Final.ipa Payload

      - name: 7. Deliver IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-iPad9-Unsigned
          path: Unleashed_iPadOS_Final.ipa
          retention-days: 7
