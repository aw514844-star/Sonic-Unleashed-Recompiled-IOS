name: Unleashed Recomp - Titan v17.5
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 1.0 - Initializing Environment
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2.0 - Installing Toolchain
        run: |
          brew install ninja cmake shaderc glslang
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: 3.0 - Sovereign Surgery (Simplified No-Fail)
        run: |
          mkdir -p UnleashedRecompLib/ppc UnleashedRecompLib/private build_host build_ios

          # Force every CMakeLists to a modern version to stop warnings
          find . -name "CMakeLists.txt" -print0 | xargs -0 perl -pi -e 's/cmake_minimum_required\(VERSION .*\)/cmake_minimum_required(VERSION 3.10)/g'

          # Fix {fmt} - Remove the find_package line and add it manually
          find . -name "CMakeLists.txt" -print0 | xargs -0 perl -pi -e 's/find_package\(fmt.*\)//g'
          
          # Add FMT and CURL as subdirectories at the very start of the main build
          # This ensures they are built first and available to everything else
          sed -i '' '1i\
          add_subdirectory(thirdparty/fmt EXCLUDE_FROM_ALL)\
          add_subdirectory(thirdparty/curl EXCLUDE_FROM_ALL)\
          ' UnleashedRecomp/CMakeLists.txt

          # Fix 'No SOURCES' target
          echo "void dummy_func() {}" > UnleashedRecompLib/ppc/dummy.cpp
          cat <<EOF > UnleashedRecompLib/CMakeLists.txt
          add_library(UnleashedRecompLib STATIC UnleashedRecompLib/ppc/dummy.cpp)
          target_include_directories(UnleashedRecompLib PUBLIC \${CMAKE_CURRENT_SOURCE_DIR}/ppc)
          EOF

          # Kill the Generator Expression crash
          find . -name "CMakeLists.txt" -print0 | xargs -0 perl -pi -e 's/\$<TARGET_FILE:file_to_c>/\${file_to_c_EXECUTABLE}/g'

          # Ghost Headers for shaders
          find . -name "*.hlsl" -exec touch {}.spirv.h \; 2>/dev/null || true

      - name: 4.0 - Building Host Tools (macOS)
        run: |
          cmake -S . -B build_host -G Ninja -DPLATFORM_X64=ON -DGENERATE_SPIRV=OFF
          cmake --build build_host --target file_to_c

      - name: 5.0 - Building Engine (A13/iPad 9/Metal)
        run: |
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DUSE_METAL=ON \
            -DPLATFORM_IOS=ON \
            -DGENERATE_SPIRV=OFF \
            -DSDL_HINT_JOYSTICK_HIDAPI_PS4=1 \
            -Dfile_to_c_EXECUTABLE=$(pwd)/build_host/file_to_c \
            -DPRIVATE_FILES_DIR="$(pwd)/UnleashedRecompLib/private"

          cmake --build build_ios --parallel $(sysctl -n hw.ncpu)

      - name: 6.0 - Packaging IPA (Final IPA)
        run: |
          BIN_PATH=$(find build_ios -maxdepth 4 -type f -perm +111 ! -name "*.a" ! -name "*.dylib" ! -name "file_to_c" | head -n 1)
          if [ -z "$BIN_PATH" ]; then exit 1; fi

          mkdir -p Payload/Unleashed.app
          cp "$BIN_PATH" Payload/Unleashed.app/UnleashedRecomp
          
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.nerun.unleashed</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIRequiresFullScreen</key><true/>
              <key>GCSupportedGameControllers</key><array><dict><key>ProfileName</key><string>ExtendedGamepad</string></dict></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string><string>metal</string></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict></plist>
          EOF
          
          cat <<EOF > Payload/Unleashed.app/config.toml
          graphicsAPI = "Metal"
          useJIT = false
          enablePS4Touchpad = true
          iPad9Optimization = true
          EOF
          
          zip -ry Unleashed_Success_iPad9.ipa Payload

      - name: 7.0 - Finalizing Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad9-Artifacts
          path: Unleashed_Success_iPad9.ipa
