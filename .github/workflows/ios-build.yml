name: Sonic Unleashed Final - ULTIMATE
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          # 1. SMART PROJECT DISCOVERY
          # We look for an xcodeproj that actually has "Unleashed" in the filename
          # and explicitly ignore 'thirdparty', 'examples', and 'build' folders.
          PROJECT_FILE=$(find . -name "*Unleashed*.xcodeproj" -not -path "*/thirdparty/*" -not -path "*/examples/*" -not -path "*/build/*" | head -n 1)
          
          # FALLBACK: If no "Unleashed" named project, find the biggest one that isn't thirdparty
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -name "*.xcodeproj" -not -path "*/thirdparty/*" -not -path "*/examples/*" | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "CRITICAL: Main project not found. Listing all xcodeproj files for debug:"
            find . -name "*.xcodeproj"
            exit 1
          fi

          echo "TARGET PROJECT: $PROJECT_FILE"

          # 2. XCODEBUILD
          xcodebuild build -project "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Emergency Inject & Fix
        run: |
          mkdir -p Payload/Unleashed.app
          
          # 3. MAGIC NUMBER FIX (Stops 0x69636e73 error)
          RAW_BINARY=$(find ./DerivedData -name "UnleashedRecomp" -type f | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi

          if [ -z "$RAW_BINARY" ]; then 
             echo "Binary not found in DerivedData, searching workspace..."
             RAW_BINARY=$(find . -type f -perm +111 -name "UnleashedRecomp" -not -path "*/thirdparty/*" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi
          
          if [ -z "$RAW_BINARY" ]; then exit 1; fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # 4. 50MB SIZE FIX (Asset Vacuum)
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/
          fi
          
          # Force inclusion of all data folders to ensure the 50MB size
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" -o -name "res" \) \
            -not -path "./DerivedData/*" \
            -not -path "*/thirdparty/*" \
            -exec cp -r {} Payload/Unleashed.app/ \; || true

          # 5. INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          zip -r Unleashed_Final.ipa Payload
          echo "FINAL SIZE: $(du -sh Unleashed_Final.ipa)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
