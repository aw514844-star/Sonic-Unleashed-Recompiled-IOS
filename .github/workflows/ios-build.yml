name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          set +e
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Inject and Package
        run: |
          # 1. Create a clean Payload area
          mkdir -p StagingArea/Payload/Unleashed.app
          
          # 2. THE FIX: Search ONLY BuildDir to avoid "identical" loop
          APP_DIR=$(find ./BuildDir -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR/" StagingArea/Payload/Unleashed.app/
          else
            # Emergency fallback: search everywhere EXCEPT StagingArea
            APP_DIR=$(find . -name "StagingArea" -prune -o -name "*.app" -type d -print | head -n 1)
            [ -n "$APP_DIR" ] && cp -R "$APP_DIR/" StagingArea/Payload/Unleashed.app/
          fi

          # 3. Identity Injection
          cat <<EOF > StagingArea/Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 4. Binary Fix
          cd StagingArea/Payload/Unleashed.app/
          BINARY=$(find . -maxdepth 1 -type f -size +1M | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
          fi
          chmod +x UnleashedRecomp
          cd ../../../

          # 5. Asset Injection
          cp UnleashedRecompLib/Private/* StagingArea/Payload/Unleashed.app/ || true
          
          # 6. Create IPA
          cd StagingArea
          zip -r ../Unleashed_Standard.ipa Payload
          cd ..
          
          echo "FINAL IPA SIZE: $(stat -f%z Unleashed_Standard.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
