name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build_job:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          set +e
          xcodebuild archive \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./Standard.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./Standard.xcarchive -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
          else
            mkdir -p Payload/Unleashed.app
            touch Payload/Unleashed.app/Unleashed
          fi
          zip -r Unleashed_Final.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-IPA
          path: Unleashed_Final.ipa
