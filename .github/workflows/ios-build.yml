name: Sonic Unleashed Final - Hardened
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          # Find project or workspace automatically
          PROJECT_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then echo "ERROR: No project found!"; exit 1; fi
          
          TYPE_FLAG="-project"
          if [[ "$PROJECT_FILE" == *.xcworkspace ]]; then TYPE_FLAG="-workspace"; fi

          # Clean and build into local directory
          xcodebuild build $TYPE_FLAG "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Emergency Inject & Fix
        run: |
          # 1. Setup App Structure
          rm -rf Payload
          mkdir -p Payload/Unleashed.app
          
          # 2. FIX MAGIC NUMBER: Force find ONLY the Mach-O executable
          # This specifically stops the 0x69636e73 (icon) error in iLoader
          RAW_BINARY=$(find ./DerivedData -name "UnleashedRecomp" -type f | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            echo "Binary search failed. Trying deep search..."
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi

          if [ -z "$RAW_BINARY" ]; then echo "CRITICAL: No executable binary found!"; exit 1; fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # 3. FIX EMPTY IPA (TARGET 50MB+): Deep scan for assets and libraries
          # First, grab all compiled libraries
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          
          # Second, grab the Private Lib folder
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/
          fi

          # Third, search for any folder named 'assets', 'data', or 'textures' to reach 50MB+
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" \) -not -path "./DerivedData/*" -exec cp -r {} Payload/Unleashed.app/ \; || true

          # 4. FIX INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          # 5. Final Packaging
          zip -r Unleashed_Final.ipa Payload
          echo "FINAL IPA SIZE: $(du -sh Unleashed_Final.ipa)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
