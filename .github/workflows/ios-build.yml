name: Sonic Unleashed iPad 9 Final Fix
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Ensures all recompiler tools are downloaded

      - name: Auto-Detect and Build
        run: |
          # 1. Find the project file automatically
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          # 2. Extract the iOS scheme name
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_FILE" | grep -i "iOS" | xargs | head -n 1)
          
          echo "Building Project: $PROJECT_FILE with Scheme: $SCHEME_NAME"
          
          # 3. Build to a specific 'build_output' folder
          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "build_output" \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" || echo "Ignoring expected signing warnings."

      - name: Manual Payload Package
        run: |
          mkdir -p Payload
          # Search for the .app file in the new output folder
          APP_PATH=$(find build_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: The build failed to create an .app file. Verify your game files are in UnleashedRecompLib/private/"
            exit 1
          fi
          
          echo "Found app at $APP_PATH. Packaging..."
          cp -R "$APP_PATH" Payload/
          zip -r SonicUnleashed_iPad9.ipa Payload
          
      - name: Upload Working IPA
        uses: actions/upload-artifact@v4
        with:
          name: SonicUnleashed_iPad9
          path: SonicUnleashed_iPad9.ipa
