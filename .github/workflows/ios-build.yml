name: iPad 9 Final Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fixes "Empty IPA" by pulling in all engine code

      - name: 2. Install Build Tools
        run: brew install cmake ninja

      - name: 3. Verify Your Game Files
        run: |
          # Strict check for your specific files
          cd UnleashedRecompLib/private
          if [[ ! -f "default.xex" ]] || [[ ! -f "default.xexp" ]] || [[ ! -f "shader.ar" ]]; then
            echo "ERROR: One of your files (default.xex, default.xexp, or shader.ar) is missing in UnleashedRecompLib/private!"
            exit 1
          fi
          echo "Files verified. Proceeding to build..."

      - name: 4. Configure & Build
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FULLSCREEN=ON
          cmake --build build --config Release

      - name: 5. Bundle Assets & Fix Full Screen
        run: |
          mkdir -p Payload
          # Find the .app folder - if this fails, the build failed
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "Build failed: No .app found"; exit 1; fi
          
          cp -r "$APP_PATH" ./Payload/
          APP_NAME=$(basename "$APP_PATH")
          
          # Inject your assets into the IPA so it's not empty
          mkdir -p "Payload/$APP_NAME/UnleashedRecompLib/private"
          cp UnleashedRecompLib/private/default.xex "Payload/$APP_NAME/UnleashedRecompLib/private/"
          cp UnleashedRecompLib/private/default.xexp "Payload/$APP_NAME/UnleashedRecompLib/private/"
          cp UnleashedRecompLib/private/shader.ar "Payload/$APP_NAME/UnleashedRecompLib/private/"
          
          # Rule: iPad 9 Full Screen
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "Payload/$APP_NAME/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "Payload/$APP_NAME/Info.plist"

      - name: 6. Final IPA Packaging
        run: zip -r SonicUnleashed_iPad9.ipa Payload

      - name: 7. Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Completed-iPad9-Build
          path: SonicUnleashed_iPad9.ipa
