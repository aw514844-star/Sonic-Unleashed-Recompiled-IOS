name: Sonic Unleashed - ULTIMATE ZERO-ERROR BUILD
on: [workflow_dispatch, push]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine (All-Terrain Pathing)
        run: |
          mkdir -p BuildDir/Device BuildDir/Simulator
          
          # 1. FIND PROJECT (Failsafe for any folder structure)
          XCODE_PATH=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$XCODE_PATH" ]; then echo "ERROR: No project found!"; exit 1; fi
          
          # 2. BUILD FOR DEVICE (Optimized for iPad 9)
          xcodebuild build \
            -project "$XCODE_PATH" \
            -scheme "UnleashedRecompiOSD" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir/Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Ultimate Final Inject (JIT & KSign Optimized)
        run: |
          mkdir -p Payload/Unleashed.app/private
          
          # 1. FIND BINARY
          BINARY=$(find ./BuildDir/Device -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | grep "arm64" | cut -d: -f1 | head -n 1)
          cp "$BINARY" Payload/Unleashed.app/UnleashedRecompiOSD
          chmod 777 Payload/Unleashed.app/UnleashedRecompiOSD
          
          # 2. JIT ENTITLEMENTS (Crucial for KSign/AltStore JIT)
          # This file allows the debugger to attach, which is how JIT is enabled.
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>run-unsigned-code</key>
              <true/>
          </dict>
          </plist>
          EOF
          cp entitlements.plist Payload/Unleashed.app/entitlements.plist

          # 3. DUAL-MODE CONFIG (Safe JIT)
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          [Core]
          UseJIT = true
          FallbackToInterpreter = true
          [Display]
          AspectRatio = "4:3"
          FitScreen = true
          EOF
          
          # 4. INFO.PLIST (Maximum Compatibility)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundleDisplayName</key><string>Sonic Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # 5. ASSETS
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/private/
          fi
          
          zip -ry UnleashedRecompiOSD.ipa Payload

      - name: Upload Finished Release
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-Ready
          path: UnleashedRecompiOSD.ipa
