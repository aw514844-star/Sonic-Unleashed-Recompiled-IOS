name: TRY_63_DNA_FIX
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Deep Clone
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. STRIP SIGNING DNA (Fixes Exit 65)
        # This force-edits the actual project files to delete signing data
        run: |
          find . -name "*.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' {} + || true
          find . -name "*.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' {} + || true
          find . -name "*.pbxproj" -exec sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = ""/g' {} + || true

      - name: 3. Essential: Cold-Boot Simulator
        # Pre-booting the simulator separately is a vital step to avoid Exit Code 65 timeouts
        run: |
          xcrun simctl boot "iPhone 15" || true
          brew install glslang molten-vk vulkan-headers || true

      - name: 4. The Master Build (Ad-Hoc Signing)
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          
          # Using "-" for CODE_SIGN_IDENTITY forces an ad-hoc local signature
          xcodebuild clean build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphonesimulator \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO

      - name: 5. Hunt and Package
        run: |
          mkdir -p Payload
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          if [ -z "$(ls -A Payload 2>/dev/null)" ]; then exit 1; fi
          zip -r9 Sonic_iPad_Try63.ipa Payload

      - name: 6. Final Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Ready
          path: Sonic_iPad_Try63.ipa
