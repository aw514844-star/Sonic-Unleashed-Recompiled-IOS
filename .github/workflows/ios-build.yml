name: Sonic Unleashed - NO SIGNING - IPAD 9
on: [workflow_dispatch, push]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine (Simulator & Device)
        run: |
          mkdir -p BuildDir
          # Build for Simulator (to test in VM)
          xcodebuild build \
            -scheme "UnleashedRecompiOSD" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ./BuildDir/Simulator \
            CODE_SIGNING_ALLOWED=NO

          # Build for iPad (The actual IPA)
          xcodebuild build \
            -scheme "UnleashedRecompiOSD" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir/Device \
            CODE_SIGNING_ALLOWED=NO

      - name: VM Boot Test (Verify No Crash)
        run: |
          # Create and boot a virtual iPad 9
          UDID=$(xcrun simctl create "iPad9Test" "com.apple.CoreSimulator.SimDeviceType.iPad-9th-generation" "com.apple.CoreSimulator.SimRuntime.iOS-17-0")
          xcrun simctl boot $UDID
          
          APP_PATH=$(find ./BuildDir/Simulator -name "*.app" | head -n 1)
          
          echo "Installing to VM..."
          xcrun simctl install $UDID "$APP_PATH"
          
          # Attempt launch - if it returns an error, the build is broken
          xcrun simctl launch --terminate-running-process $UDID "com.unleashed.recomp"
          
          xcrun simctl delete $UDID

      - name: Ultimate Final Inject
        run: |
          # 1. SETUP STRUCTURE
          mkdir -p Payload/Unleashed.app/private
          
          # 2. FIND DEVICE BINARY
          BINARY=$(find ./BuildDir/Device -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | grep "arm64" | cut -d: -f1 | head -n 1)
          cp "$BINARY" Payload/Unleashed.app/UnleashedRecompiOSD
          chmod +x Payload/Unleashed.app/UnleashedRecompiOSD
          
          # 3. NO-SIGNING OPTIMIZED CONFIG
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          [Core]
          UseJIT = true
          FallbackToInterpreter = true
          [Display]
          AspectRatio = "4:3"
          FitScreen = true
          EOF
          
          # 4. ASSETS
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/private/
          fi
          
          # 5. UNRESTRICTED INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleDisplayName</key><string>Sonic Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF
          
          zip -ry Unleashed_Final.ipa Payload

      - name: Upload Final Build
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-NoSign
          path: Unleashed_Final.ipa
