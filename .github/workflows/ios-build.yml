name: Nerun Metal - Try 85 Final Stand
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Purge and Reinstall (The Exit Code 1 Killer)
        run: |
          # 1. Clear common Homebrew conflicts that cause early exits
          brew uninstall cmake --force
          brew install cmake ninja freetype sdl2 libpng zlib
          # 2. Force the correct Xcode version for iPadOS 15+
          sudo xcode-select -switch /Applications/Xcode.app

      - name: Force Build Metal
        shell: bash
        run: |
          mkdir -p build_ios
          
          # We use a preset-style config to bypass the manual environment scan
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_METAL=ON \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DZLIB_ROOT=$(brew --prefix zlib) \
            -DPNG_PNG_INCLUDE_DIR=$(brew --prefix libpng)/include \
            -DCMAKE_FIND_FRAMEWORK=LAST

          # Building with 'quiet' to prevent log overflow and 'allowProvisioning' for stability
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -scheme UnleashedRecomp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: Final Packaging
        run: |
          mkdir -p package/Payload
          # Search only for the real app binary
          APP_PATH=$(find . -name "*.app" -type d | grep -v "Payload" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Compiler failed to produce a .app - check logs for 'Error' red text."
            exit 1
          fi
          
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Unleashed_Final_iPad.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-Metal-Final
          path: Unleashed_Final_iPad.ipa
