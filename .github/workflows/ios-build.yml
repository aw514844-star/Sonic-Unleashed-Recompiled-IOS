name: Sonic Unleashed - THE FINAL SUCCESS (No Signing)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Environment Setup
        run: |
          git submodule update --init --recursive --force
          mkdir -p BuildDir/Device Payload/Unleashed.app/private

      - name: Build Engine (Force No-Sign)
        run: |
          # 1. AGGRESSIVE PROJECT SEARCH
          REAL_PROJ=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | grep -v "thirdparty" | head -n 1)
          if [ -z "$REAL_PROJ" ]; then
            REAL_PROJ=$(find . -name "*.xcodeproj" | head -n 1)
          fi
          echo "Using Project: $REAL_PROJ"

          # 2. SCHEME EXTRACTION
          REAL_SCHEME=$(xcodebuild -list -project "$REAL_PROJ" | grep -i "Unleashed" | tr -d ' ' | head -n 1)
          if [ -z "$REAL_SCHEME" ]; then
            REAL_SCHEME="UnleashedRecompiOSD"
          fi
          echo "Using Scheme: $REAL_SCHEME"

          # 3. THE BUILD (Stripping all signing requirements)
          xcodebuild build \
            -project "$REAL_PROJ" \
            -scheme "$REAL_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir/Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=""

      - name: Ultimate Final Inject
        run: |
          # 1. ROBUST BINARY CAPTURE
          BINARY=$(find ./BuildDir/Device -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | grep "arm64" | cut -d: -f1 | head -n 1)
          cp "$BINARY" Payload/Unleashed.app/UnleashedRecompiOSD
          chmod 777 Payload/Unleashed.app/UnleashedRecompiOSD

          # 2. METAL & IPAD 9 CONFIG
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          [Core]
          UseJIT = true
          FallbackToInterpreter = true
          [Display]
          AspectRatio = "4:3"
          FitScreen = true
          EOF

          # 3. THE "NEVER-CRASH" INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
            <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
            <key>CFBundleName</key><string>Unleashed</string>
            <key>CFBundleDisplayName</key><string>Sonic Unleashed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UI
