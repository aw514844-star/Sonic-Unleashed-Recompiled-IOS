name: Unleashed iOS Final Fix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-bundle:
    runs-on: macos-15 # Specifically targets the latest Mac Cloud Runner

    steps:
      - name: 1. Clone Project & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically pulls XenonRecomp and all sources

      - name: 2. Force Environment Prep
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app
          # Set specific build architecture to avoid 'Exit Code 1' mismatches
          echo "ARCHS=arm64" >> $GITHUB_ENV

      - name: 3. Asset Integrity Lock (Stops Empty Files)
        # This step GUARANTEES the build fails immediately if assets are missing
        run: |
          ASSET_DIR="private"
          REQUIRED=("default.xex" "shader.ar" "shader.arl" "title_update")
          
          echo "Verifying local Xbox 360 assets in /$ASSET_DIR..."
          for file in "${REQUIRED[@]}"; do
            if [ ! -e "$ASSET_DIR/$file" ]; then
              echo "::error file=$ASSET_DIR/$file::CRITICAL: $file is missing! Build halted to prevent empty output."
              exit 1
            fi
          done
          echo "Assets verified. Ready for compilation."

      - name: 4. Configure CMake (Strict No-Signing Override)
        # This block kills the 'Exit Code 1' by telling CMake to ignore Xcode's signing hardware
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

      - name: 5. Compile Binary
        run: |
          cd build
          # -j specifies the number of cores to use, speeding up the process
          ninja -j $(sysctl -n hw.logicalcpu)

      - name: 6. Assemble Final IPA (No Empty Game Files)
        run: |
          mkdir -p Payload/UnleashedRecomp.app
          
          # Move compiled app data safely
          cp -r build/*.app/* Payload/UnleashedRecomp.app/ || true
          
          # Force Inject assets from the private folder directly into the IPA
          cp -r private/* Payload/UnleashedRecomp.app/
          
          # FINAL ERROR CHECK: If the binary was never made, the script KILLS itself here
          if [ ! -f "Payload/UnleashedRecomp.app/UnleashedRecomp" ]; then
            echo "::error::BUILD FAILURE: Ninja finished but the game binary is missing. Check logs."
            exit 1
          fi

          zip -r Sonic_Unleashed_iPadOS_Final.ipa Payload

      - name: 7. Deliver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Recomp-iPadOS
          path: Sonic_Unleashed_iPadOS_Final.ipa
          if-no-files-found: error
