name: UnleashedRecompiOSD - FINAL SUCCESS
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Environment Setup
        run: |
          git submodule update --init --recursive --force
          mkdir -p BuildDir/Device Payload/Unleashed.app/private

      - name: Build Engine (Direct Target)
        run: |
          # 1. HARD-CODED PATH SEARCH (Bypassing thirdparty/concurrentqueue)
          # We search ONLY in the root and first-level subdirectories to avoid traps.
          REAL_PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace" | grep -v "thirdparty" | head -n 1)
          
          if [ -z "$REAL_PROJ" ]; then 
            echo "Searching secondary paths..."
            REAL_PROJ=$(find . -name "*.xcodeproj" | grep -v "thirdparty" | head -n 1)
          fi
          
          echo "Using Project: $REAL_PROJ"

          # 2. THE BUILD (Forcing the specific scheme)
          xcodebuild build \
            -project "$REAL_PROJ" \
            -scheme "UnleashedRecompiOSD" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir/Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Final IPA Inject
        run: |
          # 1. ROBUST BINARY CAPTURE
          # Find the actual arm64 executable regardless of filename
          BINARY=$(find ./BuildDir/Device -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | grep "arm64" | cut -d: -f1 | head -n 1)
          
          cp "$BINARY" Payload/Unleashed.app/UnleashedRecompiOSD
          chmod 777 Payload/Unleashed.app/UnleashedRecompiOSD

          # 2. CONFIG (iPad 9 & Metal)
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          [Core]
          UseJIT = true
          FallbackToInterpreter = true
          [Display]
          AspectRatio = "4:3"
          FitScreen = true
          EOF

          # 3. SIDELOAD-OPTIMIZED INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleDisplayName</key><string>Sonic Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          EOF

          # 4. ASSETS
          ASSET_DIR=$(find . -type d -name "Private" | head -n 1)
          if [ -d "$ASSET_DIR" ]; then
            cp -r "$ASSET_DIR"/* Payload/Unleashed.app/private/
          fi

          zip -ry UnleashedRecompiOSD_Final.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-Ready
          path: UnleashedRecompiOSD_Final.ipa
