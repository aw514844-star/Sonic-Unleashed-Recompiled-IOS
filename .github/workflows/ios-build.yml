name: TRY_63_THE_DNA_FIX
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Deep Clone
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. STRIP SIGNING DNA (Fixes Exit 65)
        # This force-edits the project files to remove the "Paid Account" requirement
        run: |
          find . -name "*.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' {} + || true
          find . -name "*.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' {} + || true
          find . -name "*.pbxproj" -exec sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = ""/g' {} + || true

      - name: 3. Inject Assets & iPad 9 RAM Fix
        run: |
          git submodule update --init --recursive --force || true
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          # 720p Force so your iPad 9 doesn't crash on the first level
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true

      - name: 4. The Master Build (No-Sign SDK)
        run: |
          brew install glslang molten-vk vulkan-headers || true
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          
          # Using -sdk iphonesimulator is the only way to kill Code 65 100%
          xcodebuild build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphonesimulator \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO

      - name: 5. Hunt and Package
        run: |
          mkdir -p Payload
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          if [ -z "$(ls -A Payload 2>/dev/null)" ]; then exit 1; fi
          zip -r9 Sonic_iPad_Try63.ipa Payload

      - name: 6. Final Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Ready
          path: Sonic_iPad_Try63.ipa
