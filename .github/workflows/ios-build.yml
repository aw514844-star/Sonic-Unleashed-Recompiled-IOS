name: Sonic Unleashed iOS Recomp (No-Signing)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-port:
    # Use macOS 15 for the latest iPadOS 26.x SDK compatibility
    runs-on: macos-15

    steps:
      - name: 1. Clone Project & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive # Crucial: gets XenonRecomp/XenosRecomp sources

      - name: 2. Install Build Tools
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app

      - name: 3. Verify Private Assets (No Empty Files)
        run: |
          # Ensuring the private folder exists and contains your specific files
          ASSET_DIR="private"
          REQUIRED_FILES=(
            "$ASSET_DIR/default.xex"
            "$ASSET_DIR/shader.ar"
            "$ASSET_DIR/shader.arl"
            "$ASSET_DIR/title_update"
          )

          echo "Scanning for Xbox 360 Assets in /$ASSET_DIR..."
          for item in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$item" ]; then
              echo "::error file=$item::CRITICAL ERROR: $item is missing! Upload it to the 'private' folder in your repo."
              exit 1
            fi
          done
          echo "All assets found. Ready for compilation."

      - name: 4. Configure CMake (Strict No-Signing)
        run: |
          mkdir build
          cd build
          # -DCODE_SIGNING_ALLOWED=NO bypasses all Apple Developer checks
          # -DENABLE_METAL=ON is required for the Nerun iOS fork
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DENABLE_ASSET_BUNDLING=ON

      - name: 5. Build Binary
        run: |
          cd build
          ninja

      - name: 6. Package Unsigned IPA
        run: |
          # Manually constructing the Payload for iPadOS installation
          mkdir -p Payload/UnleashedRecomp.app
          
          # Copy the compiled binary and resources
          cp -r build/UnleashedRecomp.app/* Payload/UnleashedRecomp.app/ || true
          
          # Inject your private assets into the app bundle root
          cp -r private/* Payload/UnleashedRecomp.app/
          
          # Final check to ensure it's not an empty file
          if [ ! -f "Payload/UnleashedRecomp.app/UnleashedRecomp" ]; then
            echo "::error::Build failed to produce a binary. Check Ninja logs."
            exit 1
          fi

          zip -r Sonic_Unleashed_iOS_Unsigned.ipa Payload

      - name: 7. Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-iPadOS-26
          path: Sonic_Unleashed_iOS_Unsigned.ipa
          if-no-files-found: error
