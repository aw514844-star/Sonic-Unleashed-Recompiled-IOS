name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # Critical for engine code

      - name: Build Engine (No Signing)
        run: |
          # Build specifically for iLoader (No codesign, No provisioning)
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package for iLoader
        run: |
          # 1. Create Payload structure required for IPA
          mkdir -p Payload
          
          # 2. Find the actual compiled app
          APP_PATH=$(find ./BuildDir -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Build failed! No .app bundle found."
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          
          # 3. Inject Game Assets (shader.ar, default.xex, etc.)
          # These must be inside the .app folder to increase size and make game run
          if [ -d "UnleashedRecompLib/private" ]; then
            cp -R UnleashedRecompLib/private/* "Payload/$APP_NAME/"
          fi
          
          # 4. Fix Executable Permissions (Essential for iLoader/iOS)
          # Instead of manual renaming, we read the real name from the Info.plist
          EXECUTABLE=$(defaults read "$(pwd)/Payload/$APP_NAME/Info.plist" CFBundleExecutable)
          chmod +x "Payload/$APP_NAME/$EXECUTABLE"

          # 5. Create the IPA
          zip -r Unleashed_Final.ipa Payload
          
          # 6. Verify Size (Target ~11MB)
          FILESIZE=$(stat -f%z Unleashed_Final.ipa)
          echo "Final IPA Size: $FILESIZE bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Final.ipa
