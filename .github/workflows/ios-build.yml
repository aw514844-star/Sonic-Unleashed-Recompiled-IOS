name: Sonic Unleashed Final - Hardened
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          # Automatically find the project file to fix Error 66
          PROJECT_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No .xcodeproj or .xcworkspace found!"
            exit 1
          fi

          echo "Using Project: $PROJECT_FILE"

          # Determine if we should use -project or -workspace
          TYPE_FLAG="-project"
          if [[ "$PROJECT_FILE" == *.xcworkspace ]]; then TYPE_FLAG="-workspace"; fi

          xcodebuild build $TYPE_FLAG "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Emergency Inject & Fix
        run: |
          mkdir -p Payload/Unleashed.app
          
          # Find the real Mach-O binary (Fixes iLoader magic number error 0x69636e73)
          RAW_BINARY=$(find ./DerivedData -name "UnleashedRecomp" -type f | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then 
            echo "ERROR: Binary not found! Trying fallback search..."
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 -not -name "*.dylib" -not -name "*.plist" | head -n 1)
          fi
          
          if [ -z "$RAW_BINARY" ]; then
            echo "CRITICAL ERROR: No executable found."
            exit 1
          fi
          
          echo "Injecting binary: $RAW_BINARY"
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # Collect all .dylib libraries (Fixes launch crashes)
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          
          # Inject Private Assets
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/
          fi

          # Generate clean Info.plist for iLoader
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          # Package for iLoader
          zip -r Unleashed_Final.ipa Payload
          echo "FINISHED: IPA ready for dev account signing."

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
