name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine (Force Archive)
        run: |
          set +e
          # Rule 1 & 3: Strip signing and ignore requested exit codes
          # We use -archivePath to prevent the Mac from hiding the files
          xcodebuild archive \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./Unleashed.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Rule 8: Manual Assembly (Fixes 1KB IPA)
        run: |
          mkdir -p Payload
          # We pull the app directly from the Products folder inside the archive
          # This is the ONLY way to ensure the IPA isn't empty
          if [ -d "./Unleashed.xcarchive/Products/Applications" ]; then
            cp -R ./Unleashed.xcarchive/Products/Applications/*.app Payload/
          else
            # Emergency search if the archive moved
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
            cp -R "$APP_PATH" Payload/
          fi
          
          zip -r Unleashed_Standard.ipa Payload
          
          # Verification: If the file is still tiny, the build will fail red
          SIZE=$(stat -f%z "Unleashed_Standard.ipa")
          echo "Final IPA Size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::IPA IS EMPTY. Build process failed to locate binary."
            exit 1
          fi

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-Build
          path: Unleashed_Standard.ipa
