name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine (Force Local Path)
        run: |
          set +e
          # Rule 1 & 3: No signing + force output to ./BuildPath
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildPath \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Inject & Package (Fixes 1KB IPA)
        run: |
          mkdir -p FinalPayload/Payload
          
          # 1. FIND THE APP (No guessing folders)
          APP_DIR=$(find ./BuildPath -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: App not found in BuildPath. Checking entire workspace..."
            APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR/" FinalPayload/Payload/Unleashed.app/
          fi

          # 2. CREATE IDENTITY (Fixes Sideload Errors)
          cat <<EOF > FinalPayload/Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 3. FIX BINARY NAME (Fixes Black Icon)
          cd FinalPayload/Payload/Unleashed.app/
          BINARY=$(find . -maxdepth 1 -type f -size +1M | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
          fi
          chmod +x UnleashedRecomp
          cd ../../../

          # 4. INJECT YOUR ASSETS
          cp UnleashedRecompLib/Private/* FinalPayload/Payload/Unleashed.app/ || true
          
          # 5. FINAL ZIP
          cd FinalPayload
          zip -r ../Unleashed_Final.ipa Payload
          cd ..
          
          echo "IPA READY: $(stat -f%z Unleashed_Final.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Final.ipa
