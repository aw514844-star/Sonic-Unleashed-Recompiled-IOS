name: Unleashed Recomp - TITAN v2
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Build Environment
        run: brew install ninja cmake shaderc glslang

      - name: Build Engine (TITAN v2 Protocol)
        run: |
          rm -rf build_ios
          
          # We are saturating the cache with EVERY possible Freetype variable name
          cat <<EOF > titan.cmake
          set(fmt_FOUND TRUE CACHE BOOL "" FORCE)
          set(fmt_DIR "${GITHUB_WORKSPACE}/thirdparty/fmt" CACHE PATH "" FORCE)
          
          # FREETYPE ABSOLUTE LOCKDOWN
          set(Freetype_FOUND TRUE CACHE BOOL "" FORCE)
          set(FREETYPE_FOUND TRUE CACHE BOOL "" FORCE)
          set(FREETYPE_INCLUDE_DIRS "${GITHUB_WORKSPACE}/thirdparty/freetype/include" CACHE PATH "" FORCE)
          set(FREETYPE_INCLUDE_DIR_ft2build "${GITHUB_WORKSPACE}/thirdparty/freetype/include" CACHE PATH "" FORCE)
          
          # Satisfying every variation of the library variable
          set(FREETYPE_LIBRARY "${GITHUB_WORKSPACE}/thirdparty/freetype/libfreetype.a" CACHE FILEPATH "" FORCE)
          set(FREETYPE_LIBRARIES "${GITHUB_WORKSPACE}/thirdparty/freetype/libfreetype.a" CACHE FILEPATH "" FORCE)
          set(Freetype_LIBRARY "${GITHUB_WORKSPACE}/thirdparty/freetype/libfreetype.a" CACHE FILEPATH "" FORCE)
          set(Freetype_LIBRARIES "${GITHUB_WORKSPACE}/thirdparty/freetype/libfreetype.a" CACHE FILEPATH "" FORCE)
          
          # CURL LOCKDOWN
          set(CURL_FOUND TRUE CACHE BOOL "" FORCE)
          set(CURL_INCLUDE_DIRS "${GITHUB_WORKSPACE}/thirdparty/curl/include" CACHE PATH "" FORCE)
          set(CURL_LIBRARIES "${GITHUB_WORKSPACE}/thirdparty/curl/libcurl.a" CACHE FILEPATH "" FORCE)
          
          # SDL2 LOCKDOWN
          set(SDL2_FOUND TRUE CACHE BOOL "" FORCE)
          set(SDL2_INCLUDE_DIRS "${GITHUB_WORKSPACE}/thirdparty/SDL/include" CACHE PATH "" FORCE)
          set(SDL2_LIBRARIES "${GITHUB_WORKSPACE}/thirdparty/SDL/libSDL2.a" CAFILEPATH "" FORCE)
          EOF
          
          cmake -S . -B build_ios -G Ninja \
            -C titan.cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_JIT=ON \
            -DFALLBACK_INTERPRETER=ON \
            -DOPTIMIZE_FOR_A13=ON \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DUSE_INTERNAL_FMT=ON \
            -DGENERATE_SPIRV=ON \
            -DMSDFGEN_USE_FREETYPE=ON \
            -DMSDFGEN_BUILD_STANDALONE=OFF

          cmake --build build_ios --config Release --parallel $(sysctl -n hw.ncpu)

      - name: The Truth Check
        run: |
          EXE_PATH=$(find build_ios -type f -perm +111 ! -name "*.a" ! -name "*.dylib" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            echo "❌ TITAN FAILURE: Binary not found."
            exit 1
          fi
          
          mkdir -p Payload/Unleashed.app
          cp "$EXE_PATH" Payload/Unleashed.app/UnleashedRecompiOSD
          
          # Finalizing Info.plist
          printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string><key>CFBundleIdentifier</key><string>com.unleashed.recomp</string><key>CFBundleName</key><string>Unleashed</string><key>CFBundlePackageType</key><string>APPL</string><key>LSRequiresIPhoneOS</key><true/><key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array></dict></plist>' > Payload/Unleashed.app/Info.plist
          
          zip -ry Unleashed_Titan.ipa Payload

      - name: Upload TITAN Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Titan-IPA
          path: Unleashed_Titan.ipa
