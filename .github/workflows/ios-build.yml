name: Build UnleashedRecomp iOS

on:
  push:
    branches: [ main, ios, master ]
  pull_request:
    branches: [ main, ios, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Configure CMake for iOS (Metal/ARM64)
        run: |
          mkdir -p build_device
          cmake -S . -B build_device \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURE=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DPLATFORM=OS64

      - name: Build Target-Specific Apple Shaders & Binaries
        run: |
          cmake --build build_device --config Release --target UnleashedRecomp -- -sdk iphoneos

      - name: Prepare Payload Directory for IPA
        run: |
          mkdir -p Payload
          cp -r build_device/Release-iphoneos/UnleashedRecomp.app Payload/
          zip -r UnleashedRecomp-iOS.ipa Payload/

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-iOS-Build
          path: UnleashedRecomp-iOS.ipa
