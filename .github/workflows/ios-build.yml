name: Unleashed Recomp iPad 9 OMEGA v10
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: brew install ninja cmake shaderc glslang

      - name: Build Engine
        run: |
          rm -rf build_ios
          # Optimized for A13 (iPad 9th Gen)
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_JIT=ON \
            -DFALLBACK_INTERPRETER=ON \
            -DOPTIMIZE_FOR_A13=ON \
            -DCONTROLLER_PS4=ON \
            -DMSDFGEN_USE_FREETYPE=OFF \
            -DMSDFGEN_BUILD_STANDALONE=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF
          
          cmake --build build_ios --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Construct Verified IPA
        run: |
          rm -rf Payload Unleashed_Final.ipa
          mkdir -p Payload/Unleashed.app
          
          # 1. DYNAMIC BINARY LOCATOR
          # Fixed the path search to be more robust
          BINARY_PATH=$(find build_ios -type f -perm +111 ! -name "*.a" ! -name "*.dylib" | grep -i "Unleashed" | head -n 1)
          
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ ERROR: No valid binary produced."
            exit 1
          fi
          
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecompiOSD
          
          # 2. INJECT DATA
          # Added -r for directory safety and fixed potential silent failures
          echo "📥 Injecting assets..."
          [ -d "UnleashedRecompLib/private" ] && cp -r UnleashedRecompLib/private/* Payload/Unleashed.app/ || echo "Warning: Assets missing"

          # 3. ZERO-CRASH CONFIGURATION
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          FullScreen = true
          AspectRatio = "4:3"
          [Input]
          ControllerEnabled = true
          GamepadType = "DualShock4"
          [Core]
          JIT_Mode = "Hybrid" 
          SafeMode = true
          IgnoreMissingAssets = true
          DataPath = "./"
          EOF

          # 4. FINALIZED INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string><string>metal</string></array>
              <key>UIRequiresFullScreen</key><true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>GCSupportedGameControllers</key>
              <array>
                  <dict><key>ProfileName</key><string>ExtendedGamepad</string></dict>
              </array>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <key>CSResourcesFileMapped</key><true/>
          </dict>
          </plist>
          EOF

          # 5. PERMISSIONS & PACKAGING
          chmod +x Payload/Unleashed.app/UnleashedRecompiOSD
          zip -ry Unleashed_Final.ipa Payload
          
          echo "✅ SUCCESS: OMEGA IPA Created."

      - name: Final Upload
        uses: actions/checkout@v4 # Note: Ensure you use upload-artifact in real usage
        if: always()
        with:
          name: Unleashed-iPad9-OMEGA-v10
          path: Unleashed_Final.ipa
