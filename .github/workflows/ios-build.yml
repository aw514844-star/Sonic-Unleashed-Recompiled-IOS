name: Sonic Unleashed Final
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          # Use a dedicated local directory to avoid 'No such file or directory' errors
          mkdir -p BuildDir
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true

      - name: Emergency Inject and Package
        run: |
          mkdir -p Payload/Unleashed.app
          
          # 1. FIX: Magic Number / iLoader Parsing Error
          # 'file' command ensures we grab a Mach-O binary and EXCLUDE icons (0x69636e73)
          RAW_BINARY=$(find ./BuildDir -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then 
            # Fallback search if the primary path is weird
            RAW_BINARY=$(find . -type f -size +1M -perm +111 | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi
          
          if [ -n "$RAW_BINARY" ]; then
            echo "SUCCESS: Found valid binary at $RAW_BINARY"
            cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
            chmod +x Payload/Unleashed.app/UnleashedRecomp
          else
            echo "ERROR: No valid executable binary found. Build likely failed."
            exit 1
          fi

          # 2. Asset Injection (Ensures IPA size > 11MB and boots)
          ASSET_PATH="UnleashedRecompLib/Private"
          if [ -d "$ASSET_PATH" ]; then
            echo "Injecting game assets from $ASSET_PATH..."
            cp -r "$ASSET_PATH"/* Payload/Unleashed.app/
          else
            echo "WARNING: $ASSET_PATH not found."
          fi

          # 3. Create Info.plist (Fixed for any sideloader compatibility)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF
          
          # 4. Final Packaging (Standard IPA structure)
          zip -r Unleashed_Standard.ipa Payload
          echo "FINAL IPA SIZE: $(stat -f%z Unleashed_Standard.ipa) bytes"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
