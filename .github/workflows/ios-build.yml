name: Unleashed Recomp - Titan v11 Pro
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          brew install ninja cmake shaderc glslang
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Sovereign Surgery (No-Syntax Guarantee)
        run: |
          # 1. Setup lowercase private folder for assets
          mkdir -p UnleashedRecompLib/ppc
          mkdir -p UnleashedRecompLib/private
          mkdir -p UnleashedRecomp/gpu/shader/hlsl
          mkdir -p build_host build_ios

          # 2. Force-overwrite the Library definition to avoid sed syntax errors
          # This injects our dummy file directly into the target
          cat <<EOF > UnleashedRecompLib/CMakeLists.txt
          add_library(UnleashedRecompLib STATIC UnleashedRecompLib/ppc/dummy.cpp)
          target_include_directories(UnleashedRecompLib PUBLIC \${CMAKE_CURRENT_SOURCE_DIR}/ppc)
          EOF

          # 3. Create dummy source and stubs
          echo "void dummy_func() {}" > UnleashedRecompLib/ppc/dummy.cpp
          echo "// config" > UnleashedRecompLib/ppc/ppc_config.h
          
          # 4. Strip Generator Expressions that cause crashes
          # We use '|' as a delimiter to prevent path-slashes from breaking the command
          find . -name "CMakeLists.txt" -exec sed -i '' 's|\$<TARGET_FILE:file_to_c>|${file_to_c_EXECUTABLE}|g' {} +

      - name: Stage 1: Build Host Tool (macOS)
        run: |
          cmake -S . -B build_host -G Ninja -DPLATFORM_X64=ON -DGENERATE_SPIRV=OFF
          cmake --build build_host --target file_to_c

      - name: Stage 2: Build Engine (iPad 9 / Metal / A13 Optimization)
        run: |
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DUSE_METAL=ON \
            -DPLATFORM_IOS=ON \
            -DGENERATE_SPIRV=OFF \
            -DSDL_HINT_JOYSTICK_HIDAPI_PS4=1 \
            -Dfile_to_c_EXECUTABLE=$(pwd)/build_host/file_to_c \
            -DPRIVATE_FILES_DIR="$(pwd)/UnleashedRecompLib/private"

          # Fix missing shader headers for the build tree
          find build_ios -name "*.hlsl" -exec touch {}.spirv.h \; 2>/dev/null || true
          
          cmake --build build_ios --parallel $(sysctl -n hw.ncpu)

      - name: IPA Export (Hardware Optimized)
        run: |
          BINARY=$(find build_ios -type f -perm +111 ! -name "*.a" ! -name "*.dylib" ! -name "file_to_c" | head -n 1)
          if [ -z "$BINARY" ]; then exit 1; fi

          mkdir -p Payload/Unleashed.app
          cp "$BINARY" Payload/Unleashed.app/UnleashedRecomp
          
          # Info.plist: Full Screen, PS4 Support, and File Sharing
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.nerun.unleashed</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIRequiresFullScreen</key><true/>
              <key>GCSupportedGameControllers</key><array><dict><key>ProfileName</key><string>ExtendedGamepad</string></dict></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string><string>metal</string></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          EOF
          
          # config.toml: Metal, No-JIT, and PS4 Optimizations
          cat <<EOF > Payload/Unleashed.app/config.toml
          graphicsAPI = "Metal"
          useJIT = false
          enablePS4Touchpad = true
          iPad9Optimization = true
          EOF
          
          zip -ry Unleashed_iPad9_Metal_v14.5.ipa Payload

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad9-Metal
          path: Unleashed_iPad9_Metal_v14.5.ipa
