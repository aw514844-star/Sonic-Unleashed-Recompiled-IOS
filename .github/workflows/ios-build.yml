name: Sonic Unleashed Final - ULTIMATE
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate and Build
        run: |
          # 1. GENERATE THE PROJECT (Fixes the missing .xcodeproj error)
          # We use the built-in 'cmake' command on the macOS runner
          mkdir -p build_ios
          cd build_ios
          cmake .. -G Xcode \
                   -DCMAKE_SYSTEM_NAME=iOS \
                   -DCMAKE_OSX_SYSROOT=iphoneos \
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

          # 2. FIND THE GENERATED PROJECT
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then echo "GENERATION FAILED"; exit 1; fi
          echo "GENERATED PROJECT FOUND: $PROJECT_FILE"
          
          # 3. BUILD
          xcodebuild build -project "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Emergency Inject & Fix
        run: |
          mkdir -p Payload/Unleashed.app
          
          # MAGIC NUMBER FIX (Stops iLoader 0x69636e73 error)
          # This ensures iLoader signs the Mach-O binary and not an icon
          RAW_BINARY=$(find ./DerivedData -type f | xargs file | grep "Mach-O" | grep "executable" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            echo "Searching fallback for executable..."
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 ! -name "*.dylib" | head -n 1)
          fi

          if [ -z "$RAW_BINARY" ]; then exit 1; fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # 50MB SIZE VACUUM (Libraries & Assets)
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          
          # Copy resources/private folders from your directory list
          [ -d "private" ] && cp -r private/* Payload/Unleashed.app/
          [ -d "UnleashedRecompResources" ] && cp -r UnleashedRecompResources/* Payload/Unleashed.app/
          
          # Deep vacuum assets to hit 50MB+ target
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" \) -not -path "./DerivedData/*" -not -path "*/thirdparty/*" -exec cp -r {} Payload/Unleashed.app/ \; || true

          # INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict></plist>
          EOF

          zip -r Unleashed_Final.ipa Payload
          echo "FINAL SIZE: $(du -sh Unleashed_Final.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
