name: Sonic Unleashed Recomp IOS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Deep Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Install Dependencies
        run: |
          brew install cmake ninja freetype sdl2 curl fmt glslang
          echo "FREETYPE_DIR=$(brew --prefix freetype)" >> $GITHUB_ENV
          echo "SDL2_DIR=$(brew --prefix sdl2)" >> $GITHUB_ENV
          echo "CURL_DIR=$(brew --prefix curl)" >> $GITHUB_ENV
          echo "FMT_DIR=$(brew --prefix fmt)" >> $GITHUB_ENV

      - name: 3. Asset Integrity & Shader Pre-Compilation
        run: |
          # Verify private files exist for the static recompiler
          cd UnleashedRecompLib/private
          ls default.xex default.xexp shader.ar || (echo "Missing XEX/AR files!" && exit 1)
          cd ../..

          # SPIR-V Header Generation Logic
          # Maps .hlsl to .spirv.h with correct stage flags
          SHADER_DIR="UnleashedRecomp/gpu/shader/hlsl"
          for shader in $SHADER_DIR/*.hlsl; do
            echo "Compiling $shader..."
            
            if [[ "$shader" == *"_vs.hlsl" ]]; then
              STAGE="vert"
            elif [[ "$shader" == *"_ps.hlsl" ]]; then
              STAGE="frag"
            else
              STAGE="frag"
            fi

            VAR_NAME=$(basename "$shader" .hlsl | sed 's/-/_/g')_spirv
            
            glslangValidator -V -S "$STAGE" "$shader" -o "$shader.spirv.h" --vn "$VAR_NAME" -x
          done

      - name: 4. Compile (FORCED SUCCESS PATH)
        run: |
          # Pure CLI build: Bypassing Xcode for Ninja performance
          cmake . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FULLSCREEN=ON \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DCURL_INCLUDE_DIR=$(brew --prefix curl)/include \
            -DCURL_LIBRARY=$(brew --prefix curl)/lib/libcurl.dylib \
            -Dfmt_DIR=$(brew --prefix fmt)/lib/cmake/fmt \
            -DSDL2_INCLUDE_DIR=$(brew --prefix sdl2)/include/SDL2 \
            -DSDL2_LIBRARY=$(brew --prefix sdl2)/lib/libSDL2.dylib \
            -DGLSLANG_VALIDATOR_EXE=$(which glslangValidator)
          
          cmake --build build --config Release

      - name: 5. iPad 9 & PS4 Controller Injection
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" ./Payload/
          APP_NAME=$(basename "$APP_PATH")
          PLIST="Payload/$APP_NAME/Info.plist"
          
          # Force Fullscreen & Lock Orientation for iPad 9
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          
          # Native DualShock 4 Support
          /usr/libexec/PlistBuddy -c "Add :GCSupportedGameControllers array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :GCSupportedGameControllers:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :GCSupportedGameControllers:0:ProfileName string ExtendedGamepad" "$PLIST"
          
          # Enable Files App Access
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"

          # Inject private assets into the final bundle
          mkdir -p "Payload/$APP_NAME/UnleashedRecompLib/private"
          cp UnleashedRecompLib/private/* "Payload/$APP_NAME/UnleashedRecompLib/private/"

      - name: 6. Final Unsigned IPA
        run: zip -r SonicUnleashed_iPad9.ipa Payload

      - name: 7. Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: SonicUnleashed-iPad9-Final
          path: SonicUnleashed_iPad9.ipa
