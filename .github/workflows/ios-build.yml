name: Sonic Unleashed Recompiled for IOS
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          # FIX: Ignore 'thirdparty' or 'build' folders to find the REAL project
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.xcodeproj" -not -path "*/thirdparty/*" -not -path "*/build/*" | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then 
            echo "Main project not found in root. Searching all..."
            PROJECT_FILE=$(find . -name "*.xcodeproj" -not -path "*/thirdparty/*" | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then echo "ERROR: Could not find the main .xcodeproj!"; exit 1; fi
          echo "Using Project: $PROJECT_FILE"

          xcodebuild build -project "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Emergency Inject & Fix
        run: |
          # 1. Setup App Structure
          rm -rf Payload
          mkdir -p Payload/Unleashed.app
          
          # 2. FIX MAGIC NUMBER: Ensure it's a Mach-O (Fixes 0x69636e73 error)
          RAW_BINARY=$(find ./DerivedData -name "UnleashedRecomp" -type f | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi

          if [ -z "$RAW_BINARY" ]; then echo "CRITICAL: No executable binary found!"; exit 1; fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # 3. FIX EMPTY IPA (TARGET 50MB+): Pack assets and libraries
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          
          # Force copy library files
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/
          fi

          # Deep scan for assets to ensure 50MB+ size
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" \) -not -path "./DerivedData/*" -not -path "./thirdparty/*" -exec cp -r {} Payload/Unleashed.app/ \; || true

          # 4. FIX INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          # 5. Final Packaging
          zip -r Unleashed_Final.ipa Payload
          echo "FINAL IPA SIZE: $(du -sh Unleashed_Final.ipa)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
