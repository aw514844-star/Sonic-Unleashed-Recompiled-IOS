name: Build UnleashedRecomp iOS

on:
  push:
    branches: [ ios, main ]
  pull_request:
    branches: [ ios, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14  # Uses Apple Silicon or latest available macOS runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Dependencies (CMake / Ninja)
        run: brew install cmake ninja

      - name: Configure CMake for iOS
        run: |
          cmake -B out/build/ios-release \
            -G "Xcode" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Target
        run: |
          cmake --build out/build/ios-release --config Release --target UnleashedRecomp -sdk iphoneos

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-iOS-Release
          path: out/build/ios-release/Release-iphoneos/
