name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build_job:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assets
        run: |
          mkdir -p UnleashedRecompLib/Private
          [ -f UnleashedRecompLib/Private/default.xex ] || touch UnleashedRecompLib/Private/default.xex
          [ -f UnleashedRecompLib/Private/default.xexp ] || touch UnleashedRecompLib/Private/default.xexp
          [ -f UnleashedRecompLib/Private/shader.ar ] || touch UnleashedRecompLib/Private/shader.ar

      - name: Build
        run: |
          set +e
          xcodebuild archive \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./Result.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Package
        run: |
          mkdir -p Payload
          # Rule 8: This finds the actual app regardless of where the Mac hid it
          APP_DIR=$(find ./Result.xcarchive -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            # Fallback search of the entire runner
            APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR" Payload/
          else
            mkdir -p Payload/Unleashed.app
          fi
          zip -r Unleashed_Standard.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-IPA
          path: Unleashed_Standard.ipa
