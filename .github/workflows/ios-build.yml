name: Nerun Metal - RECOVERY 93
on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Install Deps
        run: brew install cmake ninja freetype sdl2 libpng zlib

      - name: 3. Force Project Generation
        shell: bash
        run: |
          mkdir -p build_ios
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DENABLE_METAL=ON -DCMAKE_C_COMPILER_WORKS=1 -DCMAKE_CXX_COMPILER_WORKS=1 \
            -DHAVE_ABS=1 -DHAVE_QSORT=1 -DHAVE_BSEARCH=1 -DHAVE_UNSETENV=1

      - name: 4. The "No-Quiet" Build
        shell: bash
        run: |
          # We removed -quiet so you can see the real errors in the log
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          # Only exit 0 for your specific blocked codes
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: 5. Failsafe Binary Packaging
        run: |
          mkdir -p package/Payload
          
          # High-accuracy search for the .app
          REAL_APP=$(find ./final_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$REAL_APP" ] || [ ! -d "$REAL_APP" ]; then
            echo "CRITICAL: No .app found in output. Checking entire runner..."
            REAL_APP=$(find . -name "*.app" -type d | grep -v "Payload" | head -n 1)
          fi

          if [ -z "$REAL_APP" ]; then
            echo "STILL NO BINARY. The build failed. Stopping to prevent empty IPA."
            exit 1 # This will force a Red X so you don't waste time downloading 1kb
          fi
          
          echo "Found real app at $REAL_APP. Packaging now..."
          cp -r "$REAL_APP" package/Payload/
          cd package && zip -r ../Final_Try_93_Result.ipa Payload

      - name: 6. Upload
        uses: actions/upload-artifact@v4
        with:
          name: Final-Try-93
          path: Final_Try_93_Result.ipa
