name: Sonic Unleashed Final - EMERGENCY
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force Install Dependencies
        run: |
          # Install Freetype, CURL, and SDL2 dependencies
          brew install freetype pkg-config zstd sdl2 curl
          brew link --force freetype
          brew link --force curl

      - name: Fast Generate and Build
        run: |
          mkdir -p build_ios && cd build_ios
          
          # 1. DISABLE ALL SIGNING & FIX CURL
          # Adding NO_SIGNING flags for both CMake and the project logic
          cmake .. -G Xcode \
                   -DCMAKE_SYSTEM_NAME=iOS \
                   -DCMAKE_OSX_SYSROOT=iphoneos \
                   -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
                   -DCMAKE_XCODE_ATTRIBUTE_PROVISIONING_PROFILE_SPECIFIER="" \
                   -DCMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE=NO \
                   -DSDL_STATIC=ON -DSDL_SHARED=OFF

          # 2. LOCATE AND COMPILE
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          xcodebuild build -project "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -parallelizeTargets -jobs 4

      - name: Instant Inject & Package
        run: |
          mkdir -p Payload/Unleashed.app
          
          # 3. FIND THE BINARY (Fixes iLoader 0x69636e73 error)
          RAW_BINARY=$(find ./DerivedData -path "*/Release-iphoneos/*" -type f | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            RAW_BINARY=$(find . -type f -perm +111 -name "UnleashedRecomp" | head -n 1)
          fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # 4. VACUUM ASSETS (TARGET 50MB+)
          [ -d "private" ] && cp -r private/* Payload/Unleashed.app/
          [ -d "UnleashedRecompResources" ] && cp -r UnleashedRecompResources/* Payload/Unleashed.app/
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" \) -not -path "./DerivedData/*" -exec cp -r {} Payload/Unleashed.app/ \; || true

          # 5. INFO.PLIST
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>UnleashedRecomp</string><key>CFBundleIdentifier</key><string>com.unleashed.recomp</string><key>CFBundleName</key><string>Unleashed</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string><key>LSRequiresIPhoneOS</key><true/><key>MinimumOSVersion</key><string>15.0</string></dict></plist>' > Payload/Unleashed.app/Info.plist

          zip -r Unleashed_Final.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
