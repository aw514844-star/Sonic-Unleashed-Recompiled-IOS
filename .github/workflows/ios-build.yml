name: Build Sonic Unleashed iOS (Total Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: brew install cmake ninja pkg-config

      - name: Setup vcpkg (Clean & Correct URL)
        run: |
          # 1. Wipe any existing folder to prevent "destination path already exists"
          rm -rf vcpkg
          
          # 2. FIX: Use the full Microsoft repository URL
          git clone --depth 1 https://github.com
          
          # 3. Bootstrap and install REAL iOS libraries
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install sdl2 freetype fmt curl --triplet arm64-ios

      - name: Configure and Build (Metal + iPad 9 Optimized)
        run: |
          # Use the vcpkg toolchain to solve the "macOS vs iOS" architecture brick wall
          cmake . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_METAL=ON \
            -DGRAPHICS_API=Metal \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_CXX_FLAGS="-O3 -flto"

          cmake --build build --target UnleashedRecomp

      - name: Create Full IPA (Metal + Assets + No Signing)
        run: |
          mkdir -p Payload/Unleashed.app

          # Find the app bundle or binary
          APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/." Payload/Unleashed.app/
          else
            BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f -perm +111 | head -n 1)
            [ -z "$BINARY_PATH" ] && exit 1
            cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecomp
          fi

          # Map your lowercase assets from UnleashedRecompLib/private
          if [ -d "UnleashedRecompLib/private" ]; then
            echo "Injecting game assets..."
            mkdir -p Payload/Unleashed.app/private
            cp -R UnleashedRecompLib/private/. Payload/Unleashed.app/private/
          fi

          # Info.plist: iPad 9 RAM fix + File Sharing + Icon
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>CFBundleIconFiles</key>
              <array><string>icon.png</string></array>
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Copy Icon if it exists
          if [ -f "icon.png" ]; then cp icon.png Payload/Unleashed.app/icon.png; fi
          
          # Zip into Final IPA
          zip -ry Sonic_Unleashed_Metal_iPad9.ipa Payload

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad9-Fixed
          path: Sonic_Unleashed_Metal_iPad9.ipa
