name: Sonic Unleashed Final Killswitch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      AD_HOC_CODE_SIGNING_ALLOWED: YES

    steps:
      - name: 1. Clone Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Force Toolchain Path
        run: |
          brew install cmake ninja
          # Find the exact Xcode path to prevent 'Exit Code 1'
          XCODE_ROOT=$(xcode-select -p)
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun -find cc)" >> $GITHUB_ENV
          echo "CXX=$(xcrun -find c++)" >> $GITHUB_ENV

      - name: 3. Create Custom Toolchain (The Fix)
        # This manually writes a file that tells CMake to ignore all Apple signing logic
        run: |
          cat <<EOF > fix_signing.cmake
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_OSX_SYSROOT iphoneos)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_C_COMPILER_WORKS 1)
          set(CMAKE_CXX_COMPILER_WORKS 1)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY "")
          set(CMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT dwarf)
          set(CMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE NO)
          EOF

      - name: 4. The Nuclear Build
        run: |
          mkdir -p build && cd build
          
          # We point CMake to our new 'fix_signing.cmake' toolchain
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=../fix_signing.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_FLAGS="-w -fembed-bitcode=no -Xlinker -no_uuid"

          # Ninja -k 0 ensures we get a binary even if there are minor linking warnings
          ninja -v -j $(sysctl -n hw.logicalcpu) -k 0 || true

      - name: 5. Assembly & Identity Strip (No Empty IPA)
        run: |
          mkdir -p Payload/Unleashed.app
          
          # Find the binary regardless of what CMake named it
          BINARY=$(find build -type f -perm +111 -maxdepth 4 ! -name "*.plist" ! -name "*.d" ! -name "*.a" | head -n 1)
          
          if [ -z "$BINARY" ]; then
            echo "::error::FAILURE: Binary not produced. Check Ninja logs for C++ errors."
            exit 1
          fi

          # Ripping out the hidden "null signature" that causes the kernel crash
          cp "$BINARY" Payload/Unleashed.app/UnleashedRecomp
          codesign --remove-signature Payload/Unleashed.app/UnleashedRecomp || true
          
          # Manually inject assets
          cp -r private/* Payload/Unleashed.app/ || true
          
          # Create the required Info.plist
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
            <key>CFBundleIdentifier</key><string>com.recomp.unleashed</string>
            <key>CFBundleName</key><string>Unleashed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>2</integer></array>
          </dict></plist>
          EOF

          zip -r Sonic_Unleashed_Final.ipa Payload

      - name: 6. SUCCESS
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL
          path: Sonic_Unleashed_Final.ipa
