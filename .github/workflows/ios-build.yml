name: Build Sonic Unleashed iOS (Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config freetype curl
          # Force export of brew paths for the compiler
          echo "CURL_DIR=$(brew --prefix curl)" >> $GITHUB_ENV
          echo "FREETYPE_DIR=$(brew --prefix freetype)" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          # The fix for all library errors: explicitly defining paths
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DENABLE_METAL=ON \
            -DCURL_LIBRARY=$(brew --prefix curl)/lib/libcurl.dylib \
            -DCURL_INCLUDE_DIR=$(brew --prefix curl)/include \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2
          
          cmake --build build --target UnleashedRecomp

      - name: Create Final IPA
        run: |
          mkdir -p Payload/Unleashed.app

          # Capture the engine binary (approx 26MB)
          BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f -size +10M | head -n 1)
          if [ -z "$BINARY_PATH" ]; then BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f | head -n 1); fi
          
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # Icon handling: Looking in the ROOT for icon.png
          if [ -f "icon.png" ]; then
            cp icon.png Payload/Unleashed.app/AppIcon.png
          else
            # Fallback so the build doesn't fail if you forgot the icon
            touch Payload/Unleashed.app/AppIcon.png
          fi

          # Validated Info.plist (File Sharing + Icon)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundleDisplayName</key>
              <string>Sonic Unleashed</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.png</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          echo -n "APPL????" > Payload/Unleashed.app/PkgInfo
          zip -ry Sonic_Unleashed_Final.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Full-Build
          path: Sonic_Unleashed_Final.ipa
