name: Sonic Unleashed iPad 9 - Hard Copy Fix
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive # Critical for recompilation logic

      - name: Setup & Build
        run: |
          mkdir build && cd build
          # Generate Xcode project with A13 (arm64) target
          cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          
          # Build the main game target
          cmake --build . --config Release --target UnleashedRecomp

      - name: Inject Game Files (Manual Force)
        run: |
          # Locate the .app folder
          APP_PATH=$(find build -name "UnleashedRecomp.app" -type d | head -n 1)
          
          # Manually copy your private files into the .app/
          # This ensures the IPA is NOT empty
          echo "Injecting files into $APP_PATH"
          cp UnleashedRecompLib/private/default.xex "$APP_PATH/"
          cp UnleashedRecompLib/private/default.xexp "$APP_PATH/"
          cp UnleashedRecompLib/private/shader.ar "$APP_PATH/"
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "UnleashedRecomp.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r SonicUnleashed_iPad9.ipa Payload
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SonicUnleashed_iPad9_Final
          path: SonicUnleashed_iPad9.ipa
