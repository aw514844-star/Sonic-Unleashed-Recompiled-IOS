name: iPad 9 Fix - No Empty IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Force Path
        run: |
          # Build specifically for iPad 9 architecture (arm64)
          # We use a custom 'DerivedData' folder so we know exactly where the app is
          xcodebuild build \
            -project "UnleashedRecomp.xcodeproj" \
            -scheme "UnleashedRecomp-iOS" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "build_output" \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" || \
          if [[ $? -eq 1 || $? -eq 65 || $? -eq 66 || $? -eq 70 || $? -eq 128 ]]; then 
            echo "Ignoring exit code. Force-packaging anyway..."; true; 
          else 
            exit $?; 
          fi

      - name: Package IPA (High Reliability)
        run: |
          mkdir -p Payload
          # Search for the .app file specifically in the new output folder
          APP_PATH=$(find build_output -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r UnleashedRecomp_iPad9.ipa Payload
          else
            echo "ERROR: App folder not found! Build failed to produce a binary."
            exit 1
          fi
          
      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: SonicUnleashed_iPad9
          path: UnleashedRecomp_iPad9.ipa
