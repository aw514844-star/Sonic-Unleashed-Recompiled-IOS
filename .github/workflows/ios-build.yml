name: Unleashed Recomp iOS - Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          submodules: false # We will handle this manually to avoid errors

      - name: 2. Force-Inject Engine Code
        # This manually pulls the 'Common', 'Patches', and 'External' folders
        # which are the most common cause of Exit Code 1
        run: |
          git submodule sync
          git submodule update --init --recursive --force --depth 1

      - name: 3. Setup Dependencies
        run: |
          brew install cmake ninja pkg-config sdl2
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 4. The Direct Root Configuration
        run: |
          mkdir -p build
          # -Wno-dev tells CMake to ignore small warnings that cause Exit Code 1
          cmake . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSEARCH_DOCUMENTS_DIR=ON \
            -Wno-dev

      - name: 5. Hard Build
        run: |
          cmake --build build --config Release --target UnleashedRecomp -- -allowProvisioningUpdates=NO

      - name: 6. Intelligent Packaging
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Build finished but no app bundle was created."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -qr UnleashedRecomp_iOS.ipa Payload
          
          # Final Reality Check: If it's under 10MB, it's a fake/empty build
          SIZE=$(stat -f%z UnleashedRecomp_iOS.ipa)
          echo "Final IPA Size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "ERROR: IPA is too small. Something is wrong with the source."
            exit 1
          fi

      - name: 7. Upload
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-iOS-Working
          path: UnleashedRecomp_iOS.ipa
