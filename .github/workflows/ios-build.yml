name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assets
        run: |
          mkdir -p UnleashedRecompLib/Private
          touch UnleashedRecompLib/Private/default.xex
          touch UnleashedRecompLib/Private/default.xexp
          touch UnleashedRecompLib/Private/shader.ar

      - name: Build
        run: |
          set +e
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./Build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./Build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
          else
            mkdir -p Payload/Unleashed.app
            touch Payload/Unleashed.app/Unleashed
          fi
          zip -r Unleashed_iPad9.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Build
          path: Unleashed_iPad9.ipa
