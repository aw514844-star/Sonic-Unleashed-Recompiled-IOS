name: Nerun Metal - Final Recovery Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: brew install cmake ninja

      - name: Build Metal Binary (Force Output)
        shell: bash
        run: |
          # Create a dedicated build directory
          mkdir -p build_ios
          
          # Generate Xcode project specifically for iOS
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_METAL=ON

          # Build it - explicitly telling it where to put the result
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -scheme UnleashedRecomp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Force a 0 exit code only for your specific blocked codes
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: Verify and Package (Prevents 1KB IPA)
        run: |
          mkdir -p package/Payload
          
          # Look specifically in the derived data folder we just created
          APP_PATH=$(find ./final_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "CRITICAL ERROR: No .app file found! The compiler failed."
            exit 1 # This stops the action so you don't get a 1KB file
          fi
          
          echo "App found at $APP_PATH. Size check:"
          du -sh "$APP_PATH"
          
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Unleashed_Metal.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-iPad-Metal
          path: Unleashed_Metal.ipa
