name: Sonic Unleashed Final - FIXED BUILD
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          mkdir -p BuildDir
          # Force the build specifically for iOS Metal support
          xcodebuild build \
            -scheme "UnleashedRecompiOSD" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA and Inject Assets
        run: |
          # 1. Setup Structure
          mkdir -p Payload/Unleashed.app/private
          
          # 2. Extract Binary
          # Locating the specific binary from the build folder
          APP_PATH=$(find BuildDir -name "UnleashedRecompiOSD.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH/" Payload/Unleashed.app/
          else
            echo "Binary folder not found! Searching for raw Mach-O..."
            RAW_BINARY=$(find ./BuildDir -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "arm64" | cut -d: -f1 | head -n 1)
            cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecompiOSD
          fi

          # 3. Inject Assets (default.xex, shader.ar)
          # Ensuring case sensitivity matches your folder structure
          if [ -d "UnleashedRecompLib/private" ]; then
            cp -v UnleashedRecompLib/private/* Payload/Unleashed.app/private/
          elif [ -d "UnleashedRecompLib/Private" ]; then
            cp -v UnleashedRecompLib/Private/* Payload/Unleashed.app/private/
          fi

          # 4. Config & iPad Optimization
          # Force Metal and Full Screen support
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          FullScreen = true
          EOF

          # 5. Fixed Info.plist for iPad 9 (File Sharing + Full Screen)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          EOF

          zip -ry Unleashed_Final.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad-Fixed
          path: Unleashed_Final.ipa
