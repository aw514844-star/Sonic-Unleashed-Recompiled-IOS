name: Sonic Unleashed Final - IPAD 9 STABILITY PRO
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          mkdir -p BuildDir
          
          echo "--- SEARCHING FOR PROJECT ---"
          # Deep search: finds .xcodeproj or .xcworkspace anywhere in the repo
          PROJ_PATH=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | grep -v "thirdparty" | head -n 1)
          
          if [[ -z "$PROJ_PATH" ]]; then 
            echo "::error::No Xcode project found! Ensure your repo has a .xcodeproj folder."
            ls -R
            exit 1
          fi
          echo "Found Project: $PROJ_PATH"
          
          # Detect if we need -workspace or -project flag
          TYPE_FLAG=$([[ "$PROJ_PATH" == *.xcworkspace ]] && echo "-workspace" || echo "-project")

          echo "--- DETECTING SCHEME ---"
          # Try to use your specific scheme, but fallback to the first one found if it fails
          SCHEME="UnleashedRecompiOSD"
          if ! xcodebuild -list $TYPE_FLAG "$PROJ_PATH" | grep -q "$SCHEME"; then
            echo "Warning: Scheme '$SCHEME' not found. Fetching default scheme..."
            SCHEME=$(xcodebuild -list $TYPE_FLAG "$PROJ_PATH" | sed -n '/Schemes:/,$p' | sed '1d' | xargs | cut -d' ' -f1)
          fi
          echo "Using Scheme: $SCHEME"

          echo "--- STARTING COMPILATION ---"
          xcodebuild build \
            $TYPE_FLAG "$PROJ_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CFLAGS="-march=apple-a13"

      - name: Ultimate Final Inject & Hardening
        run: |
          APP_DIR="Payload/Unleashed.app"
          mkdir -p "$APP_DIR/private"
          
          # 1. FIND AND INJECT BINARY (Recursive search for the arm64 executable)
          RAW_BINARY=$(find ./BuildDir -type f -exec file {} + | grep "Mach-O 64-bit" | grep "arm64" | cut -d: -f1 | head -n 1)
          if [[ -z "$RAW_BINARY" ]]; then
            echo "::error::Binary not found in BuildDir! Compilation likely failed."
            exit 1
          fi
          cp "$RAW_BINARY" "$APP_DIR/UnleashedRecompiOSD"
          chmod +x "$APP_DIR/UnleashedRecompiOSD"

          # 2. ENHANCED ENTITLEMENTS (KSign / JIT / High Mem)
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key><true/>
              <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>
              <key>run-unsigned-code</key><true/>
              <key>increased-memory-limit</key><true/>
          </dict>
          </plist>
          EOF

          # 3. FAKE-SIGN (Critical for KSign/AltStore)
          codesign -s - --entitlements entitlements.plist --force "$APP_DIR/UnleashedRecompiOSD"

          # 4. DUAL-MODE OPTIMIZED CONFIG
          cat <<EOF > "$APP_DIR/config.toml"
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          [Core]
          UseJIT = true
          FallbackToInterpreter = true
          [Display]
          AspectRatio = "4:3"
          FitScreen = true
          Fullscreen = true
          EOF

          # 5. INFO.PLIST (Full-Screen & File Sharing)
          cat <<EOF > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundleDisplayName</key><string>Sonic Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string><string>metal</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 6. ASSET INJECTION (Strict Check for lowercase 'private')
          if [ -d "UnleashedRecompLib/private" ]; then
            cp -r UnleashedRecompLib/private/* "$APP_DIR/private/"
            echo "Assets successfully injected."
          else
            echo "::error::Folder UnleashedRecompLib/private not found! Ensure folder casing is lowercase."
            exit 1
          fi

          # 7. PACKAGE
          zip -ry Unleashed_Final.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
          retention-days: 7
