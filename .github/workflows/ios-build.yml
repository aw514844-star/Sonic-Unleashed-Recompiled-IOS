name: Sonic Unleashed iOS Final Success

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15 # Specifically for iPadOS 26.x / Apple Silicon

    steps:
      - name: 1. Fetch Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Toolchain Setup
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app

      - name: 3. Asset Lock (Prevents Empty Game)
        run: |
          mkdir -p private
          # The script looks specifically for these in your 'private' folder
          REQUIRED=("default.xex" "shader.ar" "shader.arl" "title_update")
          for f in "${REQUIRED[@]}"; do
            if [ ! -e "private/$f" ]; then
              echo "::error::CRITICAL: private/$f is missing! Build KILLED to avoid empty output."
              exit 1
            fi
          done

      - name: 4. Build Engine (Kill Exit Code 1)
        run: |
          mkdir -p build && cd build
          
          # This 'Nuclear' configuration stops CMake from testing the compiler
          # This is the ONLY way to bypass the Exit Code 1 signing crash
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

          # Start compilation immediately
          ninja -j $(sysctl -n hw.logicalcpu)

      - name: 5. Manual Assembly (No Empty Files)
        run: |
          mkdir -p Payload/UnleashedRecomp.app
          
          # Move the compiled app content
          if [ -d "build/UnleashedRecomp.app" ]; then
            cp -r build/UnleashedRecomp.app/* Payload/UnleashedRecomp.app/
          fi
          
          # MANUALLY INJECT ASSETS: This ensures your xex and shaders are inside
          cp -r private/* Payload/UnleashedRecomp.app/
          
          # FINAL VERIFICATION: Fail if the game binary wasn't actually made
          if [ ! -f "Payload/UnleashedRecomp.app/UnleashedRecomp" ] && [ ! -f "Payload/UnleashedRecomp.app/Unleashed" ]; then
            echo "::error::FAILURE: Binary not produced. Check Ninja logs above for C++ errors."
            exit 1
          fi

          zip -r Sonic_Unleashed_iPad_Final.ipa Payload

      - name: 6. Deliver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-IPA-Final
          path: Sonic_Unleashed_iPad_Final.ipa
