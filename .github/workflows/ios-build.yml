name: Nerun Metal - ABSOLUTE FINAL 95
on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Force System Setup
        run: |
          # Fresh install and manual link to fix the 'Missing Freetype' error
          brew update
          brew install cmake ninja freetype sdl2 libpng zlib
          brew link --overwrite freetype

      - name: 3. Nuclear Project Generation
        shell: bash
        run: |
          mkdir -p build_ios
          # Explicitly pointing to Homebrew's install location for Freetype
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_METAL=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix freetype);$(brew --prefix sdl2)" \
            -DFREETYPE_INCLUDE_DIRS="$(brew --prefix freetype)/include/freetype2" \
            -DFREETYPE_LIBRARY="$(brew --prefix freetype)/lib/libfreetype.dylib" \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_CXX_COMPILER_WORKS=1

      - name: 4. The 100% Binary Build
        shell: bash
        run: |
          # Using -alltargets to ensure we capture the Metal binary
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -quiet
          
          # Only proceed to success if the specific blocked codes are hit
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: 5. Binary Guard & Packaging
        run: |
          mkdir -p package/Payload
          # Targeted search in the output folder
          APP_PATH=$(find ./final_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL: No binary found. Stopping to prevent 1kb IPA."
            exit 1
          fi
          
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Final_Unleashed_Metal_iPad.ipa Payload

      - name: 6. Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-iPad-Metal-Final
          path: Final_Unleashed_Metal_iPad.ipa
