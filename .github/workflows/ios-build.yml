name: Sonic Unleashed
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source & Hard-Reset Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Install Dependencies
        run: |
          brew install cmake ninja pkg-config freetype libpng zlib
          # Link them to ensure they are in the PATH
          brew link --force freetype libpng zlib

      - name: Step 1: Generate Xcode Project (Hard-Path Injection)
        run: |
          mkdir -p build_xcode
          
          # We explicitly define the library and include paths to bypass CMake's search engine
          cmake -S . -B build_xcode \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_BUILD_TYPE=Release \
            -DFREETYPE_INCLUDE_DIR_freetype2="/opt/homebrew/opt/freetype/include/freetype2" \
            -DFREETYPE_INCLUDE_DIR_config="/opt/homebrew/opt/freetype/include/freetype2" \
            -DFREETYPE_LIBRARY="/opt/homebrew/opt/freetype/lib/libfreetype.dylib" \
            -DPNG_LIBRARY="/opt/homebrew/opt/libpng/lib/libpng.dylib" \
            -DPNG_PNG_INCLUDE_DIR="/opt/homebrew/opt/libpng/include" \
            -DZLIB_LIBRARY="/opt/homebrew/opt/zlib/lib/libz.dylib" \
            -DZLIB_INCLUDE_DIR="/opt/homebrew/opt/zlib/include" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH

      - name: Step 2: Full-Power Engine Compilation
        run: |
          PROJ_PATH=$(find build_xcode -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then exit 1; fi
          
          # Detect scheme and force build
          SCHEME=$(xcodebuild -list -project "$PROJ_PATH" | sed -n '/Schemes:/,$p' | sed '1d' | xargs | cut -d' ' -f1)
          
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            OTHER_CFLAGS="-march=apple-a13 -O3 -flto"

      - name: Step 3: IPA Packaging & "No-Crash" Config
        run: |
          APP_DIR="Payload/Unleashed.app"
          mkdir -p "$APP_DIR/private"
          
          # Locate Binary
          RAW_BIN=$(find ./BuildDir -type f -exec file {} + | grep "Mach-O 64-bit" | grep "arm64" | cut -d: -f1 | head -n 1)
          cp "$RAW_BIN" "$APP_DIR/Unleashed"
          chmod +x "$APP_DIR/Unleashed"

          # Sign for JIT and High Mem
          cat <<'EOF' > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>get-task-allow</key><true/>
            <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>
            <key>run-unsigned-code</key><true/>
            <key>increased-memory-limit</key><true/>
          </dict></plist>
          EOF
          codesign -s - --entitlements entitlements.plist --force "$APP_DIR/Unleashed"

          # Info.plist for iPad 9
          cat <<'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Unleashed</string>
            <key>CFBundleIdentifier</key><string>com.nerun.unleashed</string>
            <key>CFBundleName</key><string>Unleashed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIFileSharingEnabled</key><true/>
            <key>UIDeviceFamily</key><array><integer>2</integer></array>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict></plist>
          EOF

          # Verify Asset Injection
          if [ -d "private" ]; then
            cp -r private/* "$APP_DIR/private/"
            echo "Assets Injected."
          else
            echo "::error::Missing /private folder in repo!"
            exit 1
          fi

          zip -ry Unleashed_Final.ipa Payload

      - name: Final Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Final-IPA
          path: Unleashed_Final.ipa
