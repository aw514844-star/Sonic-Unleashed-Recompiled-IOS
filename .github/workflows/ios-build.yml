name: Build Sonic Unleashed iOS (Fixed Freetype & Metal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config freetype curl fmt sdl2 sdl2_mixer sdl2_ttf
          # Export path so the system finds freetype headers easily
          echo "FREETYPE_DIR=$(brew --prefix freetype)" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          # Explicitly pointing CMake to the Freetype files it's missing
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_METAL=ON \
            -DGRAPHICS_API=Metal \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DCMAKE_CXX_FLAGS="-O3 -flto" \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DCMAKE_PREFIX_PATH="$(brew --prefix fmt);$(brew --prefix sdl2);$(brew --prefix sdl2_mixer);$(brew --prefix sdl2_ttf);$(brew --prefix freetype)"
          
          cmake --build build --target UnleashedRecomp

      - name: Create Full IPA
        run: |
          mkdir -p Payload/Unleashed.app

          # Locate and copy binary
          BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f -perm +111 | head -n 1)
          if [ -z "$BINARY_PATH" ]; then echo "Binary not found"; exit 1; fi
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # Package Assets from your specific folder
          if [ -d "UnleashedRecompLib/private" ]; then
            mkdir -p Payload/Unleashed.app/private
            cp -R UnleashedRecompLib/private/. Payload/Unleashed.app/private/
          fi

          # Info.plist for iPad 9 (File Sharing + Metal)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>CFBundleIconFiles</key>
              <array><string>icon.png</string></array>
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
          </dict>
          </plist>
          EOF

          if [ -f "icon.png" ]; then cp icon.png Payload/Unleashed.app/icon.png; fi
          zip -ry Sonic_Unleashed_Metal.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Metal-IPA
          path: Sonic_Unleashed_Metal.ipa
