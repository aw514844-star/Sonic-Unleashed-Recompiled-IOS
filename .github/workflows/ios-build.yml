name: Unleashed Recomp - Titan v18.4
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 1.0 - Initializing Environment
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2.0 - Installing Toolchain
        run: |
          brew install ninja cmake shaderc glslang
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: 3.0 - The Lockdown Surgery
        run: |
          mkdir -p UnleashedRecompLib/ppc UnleashedRecompLib/private build_host build_ios
          
          # Fix version headers
          echo '#define RECOMP_VERSION "1.0.0"' > UnleashedRecomp/version.h
          echo 'const char* recomp_version = "1.0.0";' > UnleashedRecomp/version.cpp
          
          # macOS sed requires an empty string for the -i extension
          find . -name "CMakeLists.txt" -exec sed -i '' 's/generate_version_info.*//g' {} +
          
          # Inject dependencies into top-level CMake
          sed -i '' '1i\
          add_subdirectory(thirdparty/fmt EXCLUDE_FROM_ALL)\
          add_subdirectory(thirdparty/curl EXCLUDE_FROM_ALL)\
          ' CMakeLists.txt

      - name: 4.0 - Building Host Tools
        run: |
          cmake -S . -B build_host -G Ninja \
            -DPLATFORM_X64=ON \
            -DGENERATE_SPIRV=OFF \
            -DMSDF_ATLAS_USE_SKIA=OFF
          cmake --build build_host --target file_to_c

      - name: 5.0 - Building Engine
        run: |
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DUSE_METAL=ON \
            -DPLATFORM_IOS=ON \
            -Dfile_to_c_EXECUTABLE=$(pwd)/build_host/file_to_c \
            -DPRIVATE_FILES_DIR="$(pwd)/UnleashedRecompLib/private"
          cmake --build build_ios --parallel $(sysctl -n hw.ncpu)

      - name: 6.0 - Packaging & Ad-Hoc Signing
        run: |
          # Find binary - exclude object files and tools
          BIN_PATH=$(find build_ios -type f -perm +111 ! -name "*.a" ! -name "*.dylib" ! -name "file_to_c" | head -n 1)
          if [ -z "$BIN_PATH" ]; then echo "Binary not found" && exit 1; fi
          
          mkdir -p Payload/Unleashed.app
          cp "$BIN_PATH" Payload/Unleashed.app/UnleashedRecomp
          
          # Create Info.plist
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.nerun.unleashed</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>14.0</string>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          EOF
          
          # Ad-hoc sign the binary (required for iOS even for sideloading)
          codesign --force --deep --sign - Payload/Unleashed.app
          
          zip -ry Unleashed_Final_Build.ipa Payload

      - name: 7.0 - Delivering the Prize
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-Build
          path: Unleashed_Final_Build.ipa
