name: Unleashed Recomp iOS - Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 1. Checkout Main Fork
        uses: actions/checkout@v4
        with:
          submodules: false # We will handle submodules manually to prevent Exit Code 1

      - name: 2. Force-Inject Missing Engine Code
        # This manually pulls the 'Common' and 'Patches' folders which are usually empty
        run: |
          git submodule deinit -f . || true
          git submodule update --init --recursive --force --depth 1

      - name: 3. Setup Build Tools
        run: |
          brew install cmake ninja pkg-config sdl2
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 4. The Absolute Configuration
        run: |
          mkdir -p build
          # -Wno-dev kills developer warnings that cause exit codes
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DSEARCH_DOCUMENTS_DIR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev

      - name: 5. Hard Build
        run: |
          # If this fails, the C++ code itself has an error.
          cmake --build build --config Release --target UnleashedRecomp -- -allowProvisioningUpdates=NO

      - name: 6. Real IPA Packaging
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Build failed to create app bundle."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -qr UnleashedRecomp_iOS.ipa Payload
          
          # Verification: Ensure it's not a 166-byte empty file
          SIZE=$(stat -f%z UnleashedRecomp_iOS.ipa)
          if [ "$SIZE" -lt 5000000 ]; then
            echo "ERROR: IPA is too small. Build was incomplete."
            exit 1
          fi
          echo "Final IPA Size: $SIZE bytes"

      - name: 7. Upload
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-iOS
          path: UnleashedRecomp_iOS.ipa
