name: Sonic Unleashed will work
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          set +e
          # 1. Using the only path that successfully gave you 11.5 MB before
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Inject and Package
        run: |
          # 2. Create a fresh staging folder (Stops 'identical' error)
          mkdir -p OutDir/Payload/Unleashed.app
          
          # 3. Find the app in the working BuildDir
          APP_PATH=$(find ./BuildDir -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" OutDir/Payload/Unleashed.app/
          fi

          # 4. Write Identity (Fixes iLoader 'Missing Executable' error)
          cat <<EOF > OutDir/Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 5. Fix Binary (Renames the engine to match Info.plist)
          cd OutDir/Payload/Unleashed.app/
          # Finds the big 11MB file and names it UnleashedRecomp
          BINARY=$(find . -maxdepth 1 -type f -size +1M | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
            chmod +x UnleashedRecomp
          fi
          cd ../../../

          # 6. Inject Assets
          cp UnleashedRecompLib/Private/* OutDir/Payload/Unleashed.app/ || true
          
          # 7. Final Zip
          cd OutDir
          zip -r ../Unleashed_Standard.ipa Payload
          cd ..
          
          echo "IPA READY: $(stat -f%z Unleashed_Standard.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
