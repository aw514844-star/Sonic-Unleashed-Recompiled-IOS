name: Manual iPad 9 Build Fix
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Force Checkout with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Command (Ignore Signing)
        run: |
          # We force the build into a dedicated 'manual_output' folder
          xcodebuild build \
            -project *.xcodeproj \
            -scheme "UnleashedRecomp-iOS" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "manual_output" \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || echo "Build finished with expected warnings."

      - name: Force Manual Packaging
        run: |
          # 1. Create the Payload folder
          mkdir -p Payload
          
          # 2. MANUALLY search and copy the .app file
          # We use a broad search to find the app regardless of name
          find manual_output -name "*.app" -type d -exec cp -R {} Payload/ \;
          
          # 3. Check if Payload actually has the app
          if [ -z "$(ls -A Payload)" ]; then
            echo "ERROR: Manual search failed to find any built app."
            exit 1
          fi
          
          # 4. Zip into IPA
          zip -r SonicUnleashed_iPad9_Manual.ipa Payload
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: SonicUnleashed_iPad9
          path: SonicUnleashed_iPad9_Manual.ipa
