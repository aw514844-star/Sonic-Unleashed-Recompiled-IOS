name: Sonic Unleashed Final
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          set +e
          # Building into a dedicated 'RawBuild' folder to avoid path conflicts
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./RawBuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Inject
        run: |
          # 1. Create a fresh staging area
          mkdir -p Staging/Payload
          
          # 2. Move the app into the staging area (Fixes 'identical' error)
          APP_DIR=$(find ./RawBuild -name "*.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR/" Staging/Payload/Unleashed.app/
          else
            mkdir -p Staging/Payload/Unleashed.app
          fi

          # 3. Identity Card (Info.plist)
          cat <<EOF > Staging/Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.sythjr.unleashed</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 4. Binary Fix (Ensures the app actually opens)
          cd Staging/Payload/Unleashed.app/
          BINARY=$(find . -maxdepth 1 -type f -size +1M | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
          fi
          chmod +x UnleashedRecomp
          cd ../../../

          # 5. Asset Injection
          cp UnleashedRecompLib/Private/default.xex Staging/Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/default.xexp Staging/Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/shader.ar Staging/Payload/Unleashed.app/ || true
          
          # 6. Final Pack
          cd Staging
          zip -r ../Unleashed_Standard.ipa Payload
          cd ..
          
          SIZE=$(stat -f%z "Unleashed_Standard.ipa")
          echo "IPA SIZE: $SIZE bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
