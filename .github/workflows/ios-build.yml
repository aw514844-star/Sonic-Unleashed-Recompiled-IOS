name: Sonic Unleashed iOS Final Success

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15 # Specifically for iPadOS 26.x support
    
    steps:
      - name: 1. Fetch Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Setup Tools
        run: |
          brew install cmake ninja
          sudo xcode-select -s /Applications/Xcode.app

      - name: 3. Pre-Flight Asset Check
        run: |
          mkdir -p private
          # We check for your specific files. If they aren't here, the build stops.
          REQUIRED=("default.xex" "shader.ar" "shader.arl" "title_update")
          for f in "${REQUIRED[@]}"; do
            if [ ! -e "private/$f" ]; then
              echo "::error::MISSING ASSET: private/$f. You must upload this to your repo."
              exit 1
            fi
          done

      - name: 4. Configure & Build (THE FINAL FIX)
        run: |
          mkdir -p build && cd build
          
          # We use -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY to kill Exit Code 1
          # We use -DCMAKE_DETAILED_ERROR_MESSAGES=ON to see any hidden issues
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCODE_SIGNING_ALLOWED=NO \
            -DCODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf \
            -DCMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE=NO

          # Start compilation immediately in the same step
          ninja -j $(sysctl -n hw.logicalcpu)

      - name: 5. Assembly (No Empty Files)
        run: |
          mkdir -p Payload/UnleashedRecomp.app
          
          # Move compiled binary
          if [ -d "build/UnleashedRecomp.app" ]; then
            cp -r build/UnleashedRecomp.app/* Payload/UnleashedRecomp.app/
          elif [ -f "build/UnleashedRecomp" ]; then
            cp build/UnleashedRecomp Payload/UnleashedRecomp.app/
          fi
          
          # FORCE INJECT: Manually put your assets into the IPA root
          cp -r private/* Payload/UnleashedRecomp.app/
          
          # Check for the binary to ensure success
          if [ ! -f "Payload/UnleashedRecomp.app/UnleashedRecomp" ] && [ ! -f "Payload/UnleashedRecomp.app/Unleashed" ]; then
            echo "::error::BUILD FAILED: The binary was not produced. Check Ninja logs above."
            exit 1
          fi

          zip -r Sonic_Unleashed_iPad_Final.ipa Payload

      - name: 6. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-IPA-Success
          path: Sonic_Unleashed_iPad_Final.ipa
