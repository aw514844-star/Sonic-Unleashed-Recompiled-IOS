name: Nerun Metal - FINAL UNLEASHED BUILD
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System Preparation
        run: |
          # Install every missing piece of the puzzle
          brew install cmake ninja freetype sdl2 libpng zlib vulkan-headers
          brew link --overwrite freetype sdl2 libpng zlib
          # Ensure we use the latest official Xcode
          sudo xcode-select -switch /Applications/Xcode.app

      - name: Inject Required Assets (Rule 2)
        run: |
          # Force create the directory and verify your files
          mkdir -p UnleashedRecompLib/private
          FILES=("UnleashedRecompLib/private/default.xex" "UnleashedRecompLib/private/default.xexp" "UnleashedRecompLib/private/shader.ar")
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f - Build aborted to prevent 1kb IPA."
              exit 1
            fi
          done

      - name: The "Everything" Build Step
        shell: bash
        run: |
          mkdir -p build_ios
          
          # Force CMake to stop scanning and start building
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_METAL=ON \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DSDL2_INCLUDE_DIR=$(brew --prefix sdl2)/include/SDL2 \
            -DSDL2_LIBRARY=$(brew --prefix sdl2)/lib/libSDL2.dylib \
            -DZLIB_ROOT=$(brew --prefix zlib) \
            -DPNG_PNG_INCLUDE_DIR=$(brew --prefix libpng)/include

          # Nuclear xcodebuild - bypassing signing and specific error codes
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -scheme UnleashedRecomp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

          # Rule 3: Forcing success for your specific exit codes
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: The 100% Binary Rescue
        run: |
          mkdir -p package/Payload
          
          # Hunt for the compiled app with no restrictions
          APP_PATH=$(find . -name "*.app" -type d | grep -v "Payload" | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "CRITICAL: Compiler actually failed. Check the 'Everything Build' logs."
            exit 1
          fi
          
          echo "Success! Found app at $APP_PATH. Compressing..."
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Unleashed_Metal_iPad_Final.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-Metal-iPad-Final
          path: Unleashed_Metal_iPad_Final.ipa
