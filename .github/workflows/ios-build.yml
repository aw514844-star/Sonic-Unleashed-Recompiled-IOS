name: Sonic iPad Fix
on: [workflow_dispatch]

jobs:
  build:
    # Downgraded to macos-13 for better free-tier availability
    runs-on: macos-13 
    steps:
      - name: 1. Basic Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 2. Setup Assets
        run: |
          mkdir -p UnleashedRecompLib/private/
          # This copies your game files from wherever you put them
          cp -v default.xex UnleashedRecompLib/private/ || true
          cp -v default.xexp UnleashedRecompLib/private/ || true
          cp -v shader.ar* UnleashedRecompLib/private/ || true

      - name: 3. Force 720p & Potato Mode
        # Lowering resolution saves RAM so your iPad 9 doesn't crash
        run: |
          find . -name "*.cpp" -o -name "*.h" -exec sed -i '' 's/1920/1280/g' {} +
          find . -name "*.cpp" -o -name "*.h" -exec sed -i '' 's/1080/720/g' {} +

      - name: 4. The Quick Build
        run: |
          # Only builds the essential files to save time and minutes
          xcodebuild archive \
          -scheme "UnleashedRecomp" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          -archivePath build/Unleashed.xcarchive || true

      - name: 5. Construct IPA
        run: |
          mkdir -p Payload
          find build/Unleashed.xcarchive -name "*.app" -type d -exec cp -r {} Payload/ \;
          if [ -z "$(ls -A Payload)" ]; then exit 1; fi
          zip -r9 Unleashed_iPad.ipa Payload

      - name: 6. Upload Final App
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-iPad-9-Build
          path: Unleashed_iPad.ipa
