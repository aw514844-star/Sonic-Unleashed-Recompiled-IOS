name: Sonic Unleashed Recompiled
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config freetype libpng zlib
          brew link --force freetype libpng zlib

      - name: Generate Xcode Project
        run: |
          mkdir -p build_xcode
          cmake -S . -B build_xcode \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_BUILD_TYPE=Release \
            -DFREETYPE_INCLUDE_DIR_freetype2="/opt/homebrew/opt/freetype/include/freetype2" \
            -DFREETYPE_INCLUDE_DIR_config="/opt/homebrew/opt/freetype/include/freetype2" \
            -DFREETYPE_LIBRARY="/opt/homebrew/opt/freetype/lib/libfreetype.dylib" \
            -DPNG_LIBRARY="/opt/homebrew/opt/libpng/lib/libpng.dylib" \
            -DPNG_PNG_INCLUDE_DIR="/opt/homebrew/opt/libpng/include" \
            -DZLIB_LIBRARY="/opt/homebrew/opt/zlib/lib/libz.dylib" \
            -DZLIB_INCLUDE_DIR="/opt/homebrew/opt/zlib/include" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH

      - name: Compile Engine
        run: |
          PROJ_PATH=$(find build_xcode -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then exit 1; f
          SCHEME=$(xcodebuild -list -project "$PROJ_PATH" | sed -n '/Schemes:/,$p' | sed '1d' | xargs | cut -d' ' -f1)
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            OTHER_CFLAGS="-march=apple-a13 -O3 -flto"

      - name: Create IPA Package
        run: |
          APP_DIR="Payload/Unleashed.app"
          mkdir -p "$APP_DIR/private"
          RAW_BIN=$(find ./BuildDir -type f -exec file {} + | grep "Mach-O 64-bit" | grep "arm64" | cut -d: -f1 | head -n 1)
          cp "$RAW_BIN" "$APP_DIR/Unleashed"
          chmod +x "$APP_DIR/Unleashed"
          printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>get-task-allow</key><true/><key>run-unsigned-code</key><true/><key>increased-memory-limit</key><true/></dict></plist>' > entitlements.plist
          codesign -s - --entitlements entitlements.plist --force "$APP_DIR/Unleashed"
          printf '[Video]\nGraphicsAPI = "Metal"\nResolutionScale = 1.0\nFrameRateLimit = 60\n[Core]\nUseJIT = true\n' > "$APP_DIR/config.toml"
          printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>Unleashed</string><key>CFBundleIdentifier</key><string>com.nerun.unleashed</string><key>CFBundleName</key><string>Unleashed</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>MinimumOSVersion</key><string>15.0</string><key>UIFileSharingEnabled</key><true/><key>UIDeviceFamily</key><array><integer>2</integer></array><key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array></dict></plist>' > "$APP_DIR/Info.plist"
          if [ -d "private" ]; then cp -r private/* "$APP_DIR/private/"; fi
          zip -ry Unleashed_Final.ipa Payload

      - name: Final Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-Final-IPA
          path: Unleashed_Final.ipa
