name: Sonic Unleashed Final Killswitch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO

    steps:
      - name: 1. Clone Everything
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Force Tool Discovery
        run: |
          brew install cmake ninja
          # Use the absolute path for the new Xcode 17 system
          XCODE_PATH=$(xcode-select -p)
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          
      - name: 3. Create Custom Toolchain (THE FIX)
        # We manually write a file that tells CMake to ignore all Apple signing logic
        run: |
          cat <<EOF > fix_signing.cmake
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_OSX_SYSROOT iphoneos)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_C_COMPILER_WORKS 1)
          set(CMAKE_CXX_COMPILER_WORKS 1)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED NO)
          set(CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY "")
          set(CMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT dwarf)
          set(CMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE NO)
          EOF

      - name: 4. The Nuclear Build
        run: |
          mkdir -p build && cd build
          
          # We point CMake to our new 'fix_signing.cmake' toolchain
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=../fix_signing.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

          # Ninja -k 0 ensures the binary is completed
          ninja -v -j $(sysctl -n hw.logicalcpu) -k 0

      - name: 5. Manual IPA Assembly
        run: |
          mkdir -p Payload/Unleashed.app
          
          # Find the binary
          BINARY=$(find build -type f -perm +111 -maxdepth 4 ! -name "*.plist" ! -name "*.d" ! -name "*.a" | head -n 1)
          
          if [ -z "$BINARY" ]; then
            echo "::error::FAILURE: Binary not produced. Check Ninja logs above."
            exit 1
          fi

          cp "$BINARY" Payload/Unleashed.app/UnleashedRecomp
          # Copy your assets from the /private folder
          cp -r private/* Payload/Unleashed.app/ || true
          
          # Write Info.plist for iPad 9 (iPadOS 26+)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
            <key>CFBundleIdentifier</key><string>com.recomp.unleashed</string>
            <key>CFBundleName</key><string>Unleashed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>2</integer></array>
          </dict></plist>
          EOF

          zip -r Sonic_Unleashed_Final.ipa Payload

      - name: 6. SUCCESS
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL
          path: Sonic_Unleashed_Final.ipa
