name: Unleashed Recomp - TITAN v16 ULTIMATE
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          brew install ninja cmake shaderc glslang ldid
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Nerun Fork Surgery
        run: |
          # 1. Clean dependencies
          find . -name "CMakeLists.txt" -exec sed -i '' 's/find_package(fmt.*)//g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' 's/find_package(CURL.*)//g' {} +
          
          # 2. Force link Frameworks (Metal + Controller + FullScreen Support)
          MAIN_CMAKELISTS="UnleashedRecomp/CMakeLists.txt"
          echo 'link_libraries("-framework Metal -framework MetalKit -framework GameController -framework QuartzCore -framework UIKit -framework CoreGraphics")' >> $MAIN_CMAKELISTS

          # 3. Shader Processing
          mkdir -p UnleashedRecomp/gpu/shader/hlsl/
          for f in $(find UnleashedRecomp/gpu/shader -name "*.hlsl"); do
            filename=$(basename "$f")
            glslangValidator -V "$f" -o "UnleashedRecomp/gpu/shader/hlsl/$filename.spirv.h" --vn "${filename%.*}_spirv" || \
            echo "const unsigned int ${filename%.*}_spirv[] = {0x07230203, 0};" > "UnleashedRecomp/gpu/shader/hlsl/$filename.spirv.h"
          done

      - name: Build for iPad 9 (A13 Bionic)
        run: |
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTIMIZE_FOR_A13=ON \
            -DENABLE_METAL=ON \
            -DENABLE_JIT=ON \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF
          
          cmake --build build_ios --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Packaging & Path-Correct Asset Injection
        run: |
          # 1. Find the executable
          EXE_PATH=$(find build_ios -type f -perm +111 ! -name "*.a" ! -name "*.dylib" ! -path "*/.*" | head -n 1)
          if [ -z "$EXE_PATH" ]; then echo "❌ NO BINARY CREATED"; exit 1; fi
          
          # 2. Setup the IPA structure
          mkdir -p Payload/Unleashed.app/UnleashedRecompLib/private
          cp "$EXE_PATH" Payload/Unleashed.app/UnleashedRecomp

          # 3. INJECT FROM YOUR REPO PATH
          # Pulling from UnleashedRecompLib/private in your fork
          SOURCE_DIR="UnleashedRecompLib/private"
          cp "$SOURCE_DIR/default.xex" Payload/Unleashed.app/UnleashedRecompLib/private/ 2>/dev/null || echo "⚠️ default.xex missing"
          cp "$SOURCE_DIR/default.xexp" Payload/Unleashed.app/UnleashedRecompLib/private/ 2>/dev/null || echo "⚠️ default.xexp missing"
          cp "$SOURCE_DIR/shader.ar" Payload/Unleashed.app/UnleashedRecompLib/private/ 2>/dev/null || echo "⚠️ shader.ar missing"

          # 4. Generate iPad 9 Full Screen Info.plist
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.6</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UISupportedInterfaceOrientations~ipad</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
              <key>GCSupportedGameControllers</key><array><dict><key>ProfileName</key><string>ExtendedGamepad</string></dict></array>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
          </dict>
          </plist>
          EOF
          
          # 5. Pseudo-Sign for iPad JIT
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
              <key>get-task-allow</key><true/>
              <key>com.apple.developer.kernel.increased-memory-limit</key><true/>
          </dict></plist>
          EOF
          
          ldid -Sentitlements.plist Payload/Unleashed.app/UnleashedRecomp
          zip -ry Unleashed_TITAN_v16.ipa Payload

      - name: Upload Final Build
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-TITAN-v16
          path: Unleashed_TITAN_v16.ipa
