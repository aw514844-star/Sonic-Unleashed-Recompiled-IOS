name: Sonic Unleashed Final - ULTIMATE
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          # Force install and link Freetype
          brew install freetype pkg-config
          brew link --force freetype

      - name: Generate and Build
        run: |
          # FORCE CMake to see the headers by setting the environment variables directly
          export FREETYPE_DIR=$(brew --prefix freetype)
          export CPATH=$FREETYPE_DIR/include/freetype2:$CPATH
          
          mkdir -p build_ios
          cd build_ios
          
          # We pass the paths directly into the command line to bypass the 'FindPackage' failure
          cmake .. -G Xcode \
                   -DCMAKE_SYSTEM_NAME=iOS \
                   -DCMAKE_OSX_SYSROOT=iphoneos \
                   -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
                   -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
                   -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          
          # COMPILE
          xcodebuild build -project "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Emergency Inject & Fix
        run: |
          mkdir -p Payload/Unleashed.app
          
          # MAGIC NUMBER FIX: Force Mach-O ONLY (Kills 0x69636e73 error)
          RAW_BINARY=$(find ./DerivedData -path "*/Release-iphoneos/*" -type f | xargs file | grep "Mach-O" | grep "executable" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 ! -name "*.dylib" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # 50MB+ SIZE VACUUM
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          [ -d "private" ] && cp -r private/* Payload/Unleashed.app/
          [ -d "UnleashedRecompResources" ] && cp -r UnleashedRecompResources/* Payload/Unleashed.app/
          
          # Brute-force Asset Search
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" -o -name "res" \) \
            -not -path "./DerivedData/*" \
            -not -path "*/thirdparty/*" \
            -exec cp -r {} Payload/Unleashed.app/ \; || true

          # INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict></plist>
          EOF

          zip -r Unleashed_Final.ipa Payload
          echo "FINAL SIZE: $(du -sh Unleashed_Final.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
