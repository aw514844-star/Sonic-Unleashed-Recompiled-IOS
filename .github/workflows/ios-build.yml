name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          set +e
          # We use -derivedDataPath to force the files into a local folder
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./Output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Inject
        run: |
          mkdir -p Payload/Unleashed.app
          
          # 1. Find the .app wherever it hid in the Output folder
          APP_DIR=$(find ./Output -name "*.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR/" Payload/Unleashed.app/
          fi

          # 2. Fix the Identity Card (Info.plist)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.sythjr.unleashed</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 3. Rename the Binary (Fixes the "Missing Executable" error)
          # This hunts for the largest file in the app folder and renames it
          cd Payload/Unleashed.app/
          BINARY=$(find . -maxdepth 1 -type f -size +1M | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
          fi
          chmod +x UnleashedRecomp
          cd ../..

          # 4. Inject Game Files
          cp UnleashedRecompLib/Private/default.xex Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/default.xexp Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/shader.ar Payload/Unleashed.app/ || true
          
          zip -r Unleashed_Standard.ipa Payload
          SIZE=$(stat -f%z "Unleashed_Standard.ipa")
          echo "IPA SIZE: $SIZE bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
