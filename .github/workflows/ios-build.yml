name: Nerun Metal - FINAL UNLEASHED BUILD
on: [workflow_dispatch]

# Opting into Node 24 to clear the deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System Preparation
        run: |
          # Install all libraries that often fail during standard scans
          brew install cmake ninja freetype sdl2 libpng zlib vulkan-headers
          brew link --overwrite freetype sdl2 libpng zlib
          # Force use of a stable Xcode release for iPadOS 15+
          sudo xcode-select -switch /Applications/Xcode.app

      - name: The "Everything" Build Step
        shell: bash
        run: |
          mkdir -p build_ios
          
          # Direct Injection: Telling CMake 'unsetenv' works so it stops scanning and starts building
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_METAL=ON \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DSDL2_INCLUDE_DIR=$(brew --prefix sdl2)/include/SDL2 \
            -DSDL2_LIBRARY=$(brew --prefix sdl2)/lib/libSDL2.dylib \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_CXX_COMPILER_WORKS=1 \
            -DHAVE_UNSETENV=1 \
            -DHAVE_SETENV=1

          # Build step - bypassing signing and specific exit codes
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -scheme UnleashedRecomp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -quiet

          # Rule 3: Forcing success for your specific exit codes
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: The 100% Binary Rescue
        run: |
          mkdir -p package/Payload
          
          # Search everywhere for the real app binary
          APP_PATH=$(find . -name "*.app" -type d | grep -v "Payload" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL: No .app generated. Check logs for CompileC errors."
            exit 1
          fi
          
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Unleashed_Metal_iPad_Final.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-Metal-iPad-Final
          path: Unleashed_Metal_iPad_Final.ipa
