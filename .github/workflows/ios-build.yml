name: Unleashed Recomp - Titan v11
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Build Environment
        run: |
          brew install ninja cmake shaderc glslang
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Scorched Earth Preparation
        run: |
          # 1. Create ALL possible directories that sub-modules might expect
          mkdir -p UnleashedRecompLib/ppc
          mkdir -p UnleashedRecomp/gpu/shader/hlsl
          mkdir -p build_host
          mkdir -p build_ios

          # 2. Prevent "No Sources" Error: Inject a real C++ file into every library target
          echo "int main() { return 0; }" > UnleashedRecompLib/ppc/dummy.cpp
          echo "// config" > UnleashedRecompLib/ppc/ppc_config.h
          
          # This command finds every add_library in the project and forces it to include our dummy file
          find . -name "CMakeLists.txt" -exec sed -i '' -E 's/add_library\(([^ ]+) STATIC\)/add_library(\1 STATIC UnleashedRecompLib\/ppc\/dummy.cpp)/g' {} +
          
          # 3. Hijack Generator Expressions
          # This prevents the "$<TARGET_FILE:file_to_c>" error by replacing it with a hard path
          find . -name "CMakeLists.txt" -exec sed -i '' 's/\$<TARGET_FILE:file_to_c>/${file_to_c_EXECUTABLE}/g' {} +

          # 4. Global FindPackage Killer
          # Stop CMake from looking for CURL, Freetype, etc., on the host system
          find . -name "CMakeLists.txt" -exec sed -i '' -E 's/find_package\(.*\)//gI' {} +

      - name: Stage 1: Build Host Tools (The Recompiler Engine)
        run: |
          # Build file_to_c natively for the Mac runner
          cmake -S . -B
