name: ABSOLUTE_FINAL_FIX
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 1. Deep Clone & Reset
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Crucial for engine guts
          fetch-depth: 0

      - name: 2. FORCE SUBMODULE DOWNLOAD (Fixes Exit Code 1)
        run: |
          # This command forces the download of the missing engine files
          git submodule update --init --recursive --force || true
          
          # DIAGNOSTIC: Check if the engine is actually there
          if [ ! -f "UnleashedRecompLib/CMakeLists.txt" ] && [ ! -d "UnleashedRecompLib/src" ]; then
            echo "ERROR: Engine code is still missing! You must re-fork the original repo."
            exit 1
          fi

      - name: 3. Asset & Performance Tweaks
        run: |
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          # iPad 9 Performance (720p Force)
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true

      - name: 4. The Master Build
        run: |
          brew install glslang molten-vk vulkan-headers || true
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          xcodebuild clean build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. Nuclear Hunt & IPA Package
        run: |
          mkdir -p Payload
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          if [ -n "$(ls -A Payload 2>/dev/null)" ]; then
            zip -r9 Sonic_Unleashed_Final.ipa Payload
          else
            echo "CRITICAL: No app was built. Check Step 4 logs."
            exit 1
          fi

      - name: 6. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL
          path: Sonic_Unleashed_Final.ipa
