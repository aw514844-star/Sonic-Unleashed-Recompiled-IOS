name: Sonic Unleashed Final
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          set +e
          xcodebuild build -scheme "UnleashedRecomp" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Emergency Inject
        run: |
          mkdir -p Payload/Unleashed.app
          # Rule 8: Global Hunt (Finds it anywhere on the Mac)
          RAW_BINARY=$(find /Users/runner/Library/Developer/Xcode/DerivedData -type f -size +1M 2>/dev/null | head -n 1)
          if [ -z "$RAW_BINARY" ]; then RAW_BINARY=$(find . -type f -size +1M | head -n 1); fi
          
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # Identity Card
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>UnleashedRecomp</string><key>CFBundleIdentifier</key><string>com.unleashed.recomp</string><key>CFBundleName</key><string>Unleashed</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string><key>LSRequiresIPhoneOS</key><true/><key>MinimumOSVersion</key><string>15.0</string></dict></plist>
          EOF

          cp UnleashedRecompLib/Private/* Payload/Unleashed.app/ || true
          zip -r Unleashed_Standard.ipa Payload
          echo "IPA SIZE: $(stat -f%z Unleashed_Standard.ipa) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
