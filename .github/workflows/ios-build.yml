name: SELF_HEALING_ULTIMATE_BUILD
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 1. Deep Clone & Reset
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Force Engine & Asset Injection
        run: |
          git submodule update --init --recursive --force || true
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "default.xexp" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true

      - name: 3. iPad 9 Stability Tweaks (720p/Smooth)
        run: |
          # 720p Force and 0.5 Res Scale for 3GB RAM stability
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true
          find . -type f -name "*.toml" -exec sed -i '' 's/ResolutionScale = 1.0/ResolutionScale = 0.5/g' {} + || true
          find . -name "Info.plist" -exec sed -i '' '/<dict>/a \
          <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>' {} + || true

      - name: 4. The Master Build
        run: |
          brew install glslang molten-vk vulkan-headers || true
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          xcodebuild clean build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. The Titan Hunt
        run: |
          mkdir -p Payload
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true

      - name: 6. SELF-HEALING DIAGNOSTIC (The "Check Everything" Step)
        run: |
          echo "Starting internal scan of Payload..."
          # Check 1: Is shader.arl missing?
          if [ ! -f "Payload/*.app/private/shader.arl" ]; then
            echo "FIXING: Shader.arl was not injected correctly. Forcing move..."
            find . -name "shader.arl" -exec cp -v {} Payload/*.app/private/ \; || true
          fi
          
          # Check 2: Is Info.plist corrupted?
          if [ -f "Payload/*.app/Info.plist" ]; then
             echo "VERIFIED: Info.plist detected."
          else
             echo "FIXING: Missing Info.plist. Attempting to recover from build logs..."
             find . -name "Info.plist" -not -path "./Payload/*" -exec cp -v {} Payload/*.app/ \; || true
          fi
          
          # Check 3: Final Payload Size
          PAYLOAD_SIZE=$(du -sh Payload | cut -f1)
          echo "Current Payload Size: $PAYLOAD_SIZE"
          if [[ "$PAYLOAD_SIZE" == "0B" ]]; then
            echo "CRITICAL: Recovery failed. No app file detected."
            exit 1
          fi

      - name: 7. Final Package
        run: |
          zip -r9 Sonic_Unleashed_Indestructible.ipa Payload

      - name: 8. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-INDESTRUCTIBLE
          path: Sonic_Unleashed_Indestructible.ipa
