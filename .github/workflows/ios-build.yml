name: "Sonic Unleashed Final - TOTAL STABILITY"

on: 
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Environment Preparation
        run: |
          # 1. CLEANING PATHS
          # Remove other xcodeproj files to prevent build ambiguity, but keep the engine
          find . -name "*.xcodeproj" -not -path "./UnleashedRecompiOSD*" -not -path "./*Unleashed*" -exec rm -rf {} +
          
          # 2. CREATE IPA STRUCTURE
          mkdir -p Payload/Unleashed.app/private

      - name: Build Engine (Aggressive Optimization & No Signing)
        run: |
          # 1. AUTO-SCHEME DETECTION
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | grep -i "Unleashed" | tr -d ' ' | head -n 1)
          if [ -z "$SCHEME" ]; then SCHEME="UnleashedRecompiOSD"; fi
          
          echo "Building Project: $PROJ with Scheme: $SCHEME"

          # 2. XCODEBUILD WITHOUT SIGNING
          xcodebuild build \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./BuildDir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GENERATE_INFOPLIST_FILE=YES

      - name: Binary & Asset Injection
        run: |
          # 1. FIND THE ARM64 BINARY
          BINARY=$(find ./BuildDir -type f -perm +111 ! -name "*.dylib" -exec file {} + | grep "Mach-O" | grep "arm64"
