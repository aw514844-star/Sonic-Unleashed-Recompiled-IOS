name: Build Sonic Unleashed iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config

      - name: Configure and Build
        run: |
          # Standard CMake build for UnleashedRecomp
          cmake . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target UnleashedRecomp

      - name: Create iOS Structure and Package
        run: |
          # 1. Create the Payload folder
          mkdir -p Payload/Unleashed.app

          # 2. FIND THE BINARY (Smarter search to prevent 'No such file' error)
          # This looks for the compiled engine file and moves it to the app bundle
          BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f | head -n 1)
          
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ ERROR: Could not find the compiled binary! Check build logs above."
            exit 1
          fi
          
          echo "✅ Found binary at: $BINARY_PATH"
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecomp

          # 3. FIX PERMISSIONS (Crucial for 100% fix)
          # This marks the file as an executable program so iOS doesn't kill it
          chmod +x Payload/Unleashed.app/UnleashedRecomp
          
          # 4. CREATE PKGINFO
          echo -n "APPL????" > Payload/Unleashed.app/PkgInfo

          # 5. GENERATE INFO.PLIST (Enables Files app folder)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundleDisplayName</key>
              <string>Sonic Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

          # 6. PACKAGE WITH ATTRIBUTES (-ry preserves the executable bit)
          zip -ry Sonic_Unleashed_iOS.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iOS-IPA
          path: Sonic_Unleashed_iOS.ipa
