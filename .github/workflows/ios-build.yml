name: Sonic Unleashed - OMEGA v5
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hardened Dependencies
        run: |
          # Adding fmt to the list
          brew install cmake ninja pkg-config freetype libpng zlib curl openssl@3 fmt
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Generate & Build (Metal/iOS/Hardened)
        run: |
          mkdir -p build_ios
          export FT_PATH=$(brew --prefix freetype)
          export PNG_PATH=$(brew --prefix libpng)
          export CURL_PATH=$(brew --prefix curl)
          export SSL_PATH=$(brew --prefix openssl@3)
          export FMT_PATH=$(brew --prefix fmt)
          
          cmake -S . -B build_ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_ENABLE_BITCODE=NO \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DMSDF_ATLAS_GEN_BUILD_STANDALONE=OFF \
            -DFREETYPE_INCLUDE_DIRS="$FT_PATH/include/freetype2" \
            -DFREETYPE_LIBRARY="$FT_PATH/lib/libfreetype.a" \
            -DFREETYPE_FOUND=TRUE \
            -DPNG_INCLUDE_DIRS="$PNG_PATH/include" \
            -DPNG_LIBRARY="$PNG_PATH/lib/libpng.a" \
            -DPNG_FOUND=TRUE \
            -DCURL_INCLUDE_DIR="$CURL_PATH/include" \
            -DCURL_LIBRARY="$CURL_PATH/lib/libcurl.a" \
            -DCURL_FOUND=TRUE \
            -Dfmt_DIR="$FMT_PATH/lib/cmake/fmt" \
            -DOPENSSL_ROOT_DIR="$SSL_PATH" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DZLIB_ROOT=$(brew --prefix zlib) \
            -DMSDFGEN_USE_VCPKG=OFF \
            -DMSDFGEN_BUILD_STANDALONE=OFF \
            -DSDL_STATIC=ON \
            -DSDL_METAL=ON

          cmake --build build_ios --config Release --target UnleashedRecompiOSD -- -sdk iphoneos

      - name: Construct Verified IPA
        run: |
          rm -rf Payload Unleashed_Final.ipa
          mkdir -p Payload/Unleashed.app/private
          BUILT_APP=$(find build_ios -name "UnleashedRecompiOSD.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$BUILT_APP" ]; then BUILT_APP=$(find build_ios -name "*.app" -type d | head -n 1); fi
          cp -a "$BUILT_APP/" Payload/Unleashed.app/
          
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          FullScreen = true
          EOF

          # Info.plist omitted for brevity, keep the one from v4!
          zip -ry Unleashed_Final.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad-v5
          path: Unleashed_Final.ipa
