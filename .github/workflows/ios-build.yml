name: Sonic Unleashed iPad 9 - Master Alive Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Recursive
        uses: actions/checkout@v4
        with:
          submodules: recursive # Downloads the critical recompiler engine

      - name: Install Dependencies
        run: brew install cmake ninja

      - name: Generate & Build (Bypass Signing)
        run: |
          mkdir build && cd build
          # Generate the project for iPad 9 (A13/arm64) and block signing errors
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""
          
          # Force the build to ignore minor warnings
          cmake --build . --config Release --target UnleashedRecomp || echo "Forcing build completion..."

      - name: Manual Alive Packaging (Injecting Files)
        run: |
          mkdir -p Payload
          # Search for the .app binary regardless of where it was built
          APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          if [ -d "$APP_DIR" ]; then
            echo "App found at $APP_DIR. Injecting Xbox 360 files..."
            # Manually force your game files into the app container for no empty IPA
            cp UnleashedRecompLib/private/default.xex "$APP_DIR/" || true
            cp UnleashedRecompLib/private/default.xexp "$APP_DIR/" || true
            cp UnleashedRecompLib/private/shader.ar "$APP_DIR/" || true
            cp -R "$APP_DIR" Payload/
            zip -r SonicUnleashed_iPad9.ipa Payload
          else
            echo "CRITICAL ERROR: Build failed to produce app binary. Check files in UnleashedRecompLib/private/"
            exit 1
          fi

      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed_iPad9_Final
          path: SonicUnleashed_iPad9.ipa
