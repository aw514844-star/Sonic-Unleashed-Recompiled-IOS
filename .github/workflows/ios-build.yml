name: ERROR_LESS_SONIC_BUILD
on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 1. Deep Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Force Engine & iPad 9 Scaling
        run: |
          git submodule update --init --recursive --force || true
          mkdir -p UnleashedRecompLib/private/
          find . -name "default.xex" -exec cp {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp {} UnleashedRecompLib/private/ \; || true
          
          # Force 720p and 0.5 Res Scale for 3GB RAM iPad 9 stability
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true
          find . -type f -name "*.toml" -exec sed -i '' 's/ResolutionScale = 1.0/ResolutionScale = 0.5/g' {} + || true

      - name: 3. Dynamic Build Setup
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          echo "PROJ_FILE=$PROJ_FILE" >> $GITHUB_ENV
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV
          sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 4. The Master Build (Bypassing Exit 65)
        run: |
          brew install glslang molten-vk vulkan-headers || true
          # THE FIX: CODE_SIGN_IDENTITY="-" forces an ad-hoc local signature
          xcodebuild build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. Nuclear Hunt & IPA Package
        run: |
          mkdir -p Payload
          # Searching everywhere for the .app folder generated by 'build'
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          
          if [ -z "$(ls -A Payload 2>/dev/null)" ]; then
            echo "CRITICAL: Build failed to produce a .app file. Check Step 4 logs."
            exit 1
          fi
          
          zip -r9 Sonic_Unleashed_iPad9.ipa Payload

      - name: 6. Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-IPA-FIXED
          path: Sonic_Unleashed_iPad9.ipa
