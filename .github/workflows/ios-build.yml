name: Sonic Unleashed - The Nuclear Fix
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Every Dependency
        run: brew install cmake ninja pkg-config
      - name: Force Build
        run: |
          cmake -S . -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --target UnleashedRecomp || true
      - name: Brute Force Zip
        run: |
          mkdir -p Payload
          find . -name "*.app" -type d -exec cp -R {} Payload/ \;
          zip -r Unleashed.ipa Payload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Final_Try
          path: Unleashed.ipa
