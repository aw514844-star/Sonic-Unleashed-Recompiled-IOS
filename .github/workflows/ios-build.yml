name: Build Nerun Sonic Unleashed iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: brew install cmake ninja pkg-config

      - name: Build for iOS
        run: |
          # Targeting the specific plume/Metal implementation in Nerun's fork
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DENABLE_METAL=ON
          cmake --build build --target UnleashedRecomp

      - name: Create IPA for iILoader
        run: |
          mkdir -p Payload/Unleashed.app
          
          # Find and Move the 26MB binary
          BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f | head -n 1)
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecomp
          
          # Crucial: Fix binary permissions for the iOS kernel
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # Icon Fix (Place 'icon.png' in your repository's main folder)
          if [ -f "icon.png" ]; then
            cp icon.png Payload/Unleashed.app/AppIcon.png
          else
            touch Payload/Unleashed.app/AppIcon.png
          fi

          # Valid Info.plist for iOS 15+ (Enables File Sharing)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundleDisplayName</key>
              <string>Sonic Unleashed</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.png</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          # Packaging
          echo -n "APPL????" > Payload/Unleashed.app/PkgInfo
          zip -ry Sonic_Unleashed_Nerun_Fix.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Nerun-IPA
          path: Sonic_Unleashed_Nerun_Fix.ipa
