name: Sonic Unleashed Ultimate Success

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      # This kills the specific 2026 Linker Error
      LINKER_FORCE_NO_VERIFY: 1

    steps:
      - name: 1. Clone Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Force Toolchain Path (THE FIX)
        run: |
          brew install cmake ninja
          # Find the exact Xcode 17+ path used on macOS 15.x
          XCODE_ROOT=$(xcode-select -p)
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          echo "CC=$(xcrun -find cc)" >> $GITHUB_ENV
          echo "CXX=$(xcrun -find c++)" >> $GITHUB_ENV

      - name: 3. Asset Verification
        run: |
          mkdir -p private
          if [ ! -f "private/default.xex" ]; then
            echo "::error::MISSING FILE: Upload default.xex to the /private folder now!"
            exit 1
          fi

      - name: 4. The Nuclear Build
        run: |
          mkdir -p build && cd build
          
          # We use -DCMAKE_C_COMPILER_WORKS=1 to stop the 'Exit Code 1' check
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOMP_PLATFORM=iOS \
            -DENABLE_METAL=ON \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_CXX_COMPILER_WORKS=1 \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf \
            -DCMAKE_CXX_FLAGS="-w -fembed-bitcode=no"

          # Ninja -k 0 ignores minor 2026 SDK warnings
          ninja -v -j $(sysctl -n hw.logicalcpu) -k 0

      - name: 5. Manual Assembly (No Empty IPA)
        run: |
          mkdir -p Payload/Unleashed.app
          
          # Search for the engine binary
          BINARY=$(find build -type f -perm +111 -maxdepth 4 ! -name "*.plist" ! -name "*.d" ! -name "*.a" | head -n 1)
          
          if [ -z "$BINARY" ]; then
            echo "::error::BUILD FAILED: No binary produced. Check the logs."
            exit 1
          fi

          cp "$BINARY" Payload/Unleashed.app/UnleashedRecomp
          cp -r private/* Payload/Unleashed.app/
          
          # Write the modern Info.plist
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
            <key>CFBundleIdentifier</key><string>com.sonic.unleashed</string>
            <key>CFBundleName</key><string>Sonic</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>2</integer></array>
          </dict></plist>
          EOF

          zip -r Sonic_Unleashed_Final.ipa Payload

      - name: 6. SUCCESS
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL
          path: Sonic_Unleashed_Final.ipa
