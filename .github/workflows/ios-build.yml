name: Unleashed Recomp - OMEGA ULTIMATE FINAL
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force Submodule Sync
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Setup Build Environment
        run: brew install ninja cmake shaderc glslang

      - name: Build Engine (The Final Override)
        run: |
          rm -rf build_ios
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_JIT=ON \
            -DFALLBACK_INTERPRETER=ON \
            -DOPTIMIZE_FOR_A13=ON \
            -DCONTROLLER_PS4=ON \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DUSE_INTERNAL_FMT=ON \
            -DGENERATE_SPIRV=ON \
            -DMSDFGEN_USE_FREETYPE=OFF \
            -DMSDFGEN_BUILD_STANDALONE=OFF \
            -DENABLE_NETWORKING=ON \
            -DCURL_INCLUDE_DIR="${GITHUB_WORKSPACE}/thirdparty/curl/include" \
            -DCURL_LIBRARY="${GITHUB_WORKSPACE}/CMakeLists.txt" \
            -DFREETYPE_INCLUDE_DIR_ft2build="${GITHUB_WORKSPACE}" \
            -DFREETYPE_INCLUDE_DIRS="${GITHUB_WORKSPACE}" \
            -DFREETYPE_LIBRARY="${GITHUB_WORKSPACE}/CMakeLists.txt" \
            -DFREETYPE_LIBRARIES="${GITHUB_WORKSPACE}/CMakeLists.txt" \
            -DSDL2_INCLUDE_DIR="${GITHUB_WORKSPACE}/thirdparty/SDL/include" \
            -DSDL2_LIBRARY="${GITHUB_WORKSPACE}/CMakeLists.txt" \
            -Dfmt_DIR="${GITHUB_WORKSPACE}/thirdparty/fmt" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/thirdparty/fmt" \
            -Dfmt_FOUND=TRUE \
            -DFMT_INSTALL=OFF \
            -DFMT_TEST=OFF

          cmake --build build_ios --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Construct IPA
        run: |
          rm -rf Payload Unleashed_Finals.ipa
          mkdir -p Payload/Unleashed.app
          
          # Find the binary - adding a wildcard search for variations
          BINARY_PATH=$(find build_ios -type f -perm +111 -name "Unleashed*" | head -n 1)
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ ERROR: Binary not found. Build failed."
            exit 1
          fi
          
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecompiOSD
          cp UnleashedRecompLib/private/* Payload/Unleashed.app/ 2>/dev/null || true
          
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          AspectRatio = "4:3"
          [Core]
          JIT_Mode = "Hybrid"
          DataPath = "./"
          EOF
          
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
            <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
            <key>CFBundleName</key><string>Unleashed</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>2</integer></array>
            <key>UIFileSharingEnabled</key><true/>
            <key>LSSupportsOpeningDocumentsInPlace</key><true/>
          </dict></plist>
          EOF
          
          chmod +x Payload/Unleashed.app/UnleashedRecompiOSD
          zip -ry Unleashed_Finals.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-Build
          path: Unleashed_Finals.ipa
