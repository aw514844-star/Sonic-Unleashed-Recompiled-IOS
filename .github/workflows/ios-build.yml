name: Sonic Unleashed Ultimate Fix
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force Asset Directory
        run: |
          mkdir -p UnleashedRecompLib/Private
          # Rule 2: Detecting your specific files in the repo
          ls -R UnleashedRecompLib/Private

      - name: Build and Export App
        run: |
          set +e
          # Rule 1 & 3: Bypass all signing and ignore requested exit codes
          # -archivePath stops the "hidden folder" 1KB bug
          xcodebuild archive \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./Unleashed.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Rule 8: The Absolute Zip Fix
        run: |
          mkdir -p Payload
          # The real .app is inside the archive. We copy it directly.
          cp -R ./Unleashed.xcarchive/Products/Applications/*.app Payload/ || mkdir -p Payload/Unleashed.app
          
          # Force zip with high compression
          zip -r9 Unleashed_Standard.ipa Payload
          
          # Verification: If it's still tiny, the script kills the build so you know
          SIZE=$(stat -f%z "Unleashed_Standard.ipa")
          echo "IPA_SIZE=$SIZE"
          if [ "$SIZE" -lt 5000 ]; then
            echo "::error::IPA is empty. The Mac did not find the .app folder."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-Build
          path: Unleashed_Standard.ipa
