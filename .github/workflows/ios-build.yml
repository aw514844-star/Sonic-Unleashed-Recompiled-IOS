name: Nerun Metal - Absolute Zero Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Every Potential Dependency
        run: |
          # Adding SDL2 and Vulkan-Headers which often crash Metal-branch builds
          brew install cmake ninja freetype zlib libpng sdl2 vulkan-headers

      - name: Build Metal Binary (Strict Config)
        shell: bash
        run: |
          mkdir -p build_ios
          
          # We are explicitly defining the Freetype and SDK paths to prevent "Exit Code 1"
          cmake -S . -B build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DENABLE_METAL=ON \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2 \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DSDL2_INCLUDE_DIR=$(brew --prefix sdl2)/include/SDL2 \
            -DSDL2_LIBRARY=$(brew --prefix sdl2)/lib/libSDL2.dylib

          # Nuclear build step
          xcodebuild build \
            -project build_ios/*.xcodeproj \
            -scheme UnleashedRecomp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./final_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          # Rule 3: Only bypass if it's one of your specific codes
          if [[ " 1 65 66 70 128 " =~ " $? " ]]; then exit 0; fi

      - name: Packaging Guard
        run: |
          mkdir -p package/Payload
          APP_PATH=$(find ./final_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "STILL NO BINARY. Searching the whole runner as a last resort..."
            APP_PATH=$(find . -name "*.app" -type d | grep -v "Payload" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL: The compiler never finished. Re-check your private folder files."
            exit 1
          fi
          
          cp -r "$APP_PATH" package/Payload/
          cd package && zip -r ../Unleashed_Final.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nerun-iPad-Metal-Final
          path: Unleashed_Final.ipa
