name: Sonic Unleashed Final - Hardened
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then exit 1; fi

          # Build into a specific local folder
          xcodebuild build -scheme "UnleashedRecomp" -sdk iphoneos -configuration Release \
            -derivedDataPath ./DerivedData \
            -project "$PROJECT_FILE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package for iLoader
        run: |
          mkdir -p Payload
          
          # 1. Find the REAL .app bundle produced by Xcode (prevents magic number error)
          REAL_APP=$(find ./DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$REAL_APP" ]; then echo "Build failed"; exit 1; fi
          
          # 2. Copy the whole bundle (keeps Info.plist and Icons correct)
          cp -R "$REAL_APP" Payload/
          APP_NAME=$(basename "$REAL_APP")

          # 3. Inject Assets (Ensures 11MB+ size)
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -R UnleashedRecompLib/Private/* "Payload/$APP_NAME/"
          fi

          # 4. Fix Binary Permissions
          # Reads the executable name from the REAL Info.plist so it never mismatches
          EXE_NAME=$(defaults read "$(pwd)/Payload/$APP_NAME/Info.plist" CFBundleExecutable)
          chmod +x "Payload/$APP_NAME/$EXE_NAME"

          # 5. Clean up junk that confuses iLoader
          find Payload -name "*.xcresult" -exec rm -rf {} + || true

          zip -r Unleashed_Final.ipa Payload
          
          # Verification
          echo "IPA Size: $(du -sh Unleashed_Final.ipa)"
          file "Payload/$APP_NAME/$EXE_NAME" # Should say "Mach-O 64-bit executable arm64"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
