name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build_job:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Game Files
        run: |
          mkdir -p UnleashedRecompLib/Private
          # Rule 2: If files are missing, we create dummies so the build button doesn't break
          [ -f UnleashedRecompLib/Private/default.xex ] || touch UnleashedRecompLib/Private/default.xex
          [ -f UnleashedRecompLib/Private/shader.ar ] || touch UnleashedRecompLib/Private/shader.ar

      - name: Build with Root Access
        run: |
          set +e
          # Rule 1 & 3: Total signing bypass + blocking exit codes 1, 65, 66, 70, 128
          sudo xcodebuild archive \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./Standard.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Rule 8: The "No-Empty" Packaging
        run: |
          # 1. Create a clean Payload folder
          mkdir -p Payload
          
          # 2. Hunt for the game file inside the archive
          # We use sudo to make sure the Mac doesn't block the copy
          APP_PATH=$(sudo find ./Standard.xcarchive -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Binary not found! Creating shell to avoid 1KB file."
            mkdir -p Payload/Unleashed.app
          else
            sudo cp -R "$APP_PATH" Payload/
          fi
          
          # 3. Zip it up and check the size
          sudo zip -r Unleashed_Standard.ipa Payload
          SIZE=$(stat -f%z "Unleashed_Standard.ipa")
          echo "IPA Size: $SIZE bytes"
          
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::IPA IS STILL EMPTY. Building a fake file to prevent crash."
            exit 1
          fi

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
