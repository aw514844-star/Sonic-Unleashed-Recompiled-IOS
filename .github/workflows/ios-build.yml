name: Build Sonic Unleashed iOS (100% Success)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          # Core build tools and required engine libraries
          brew install cmake ninja pkg-config freetype curl fmt sdl2 sdl2_mixer sdl2_ttf
          
          # Force export of brew paths for the compiler
          echo "CURL_DIR=$(brew --prefix curl)" >> $GITHUB_ENV
          echo "FREETYPE_DIR=$(brew --prefix freetype)" >> $GITHUB_ENV
          echo "FMT_DIR=$(brew --prefix fmt)" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          # 1. Point directly to Homebrew libraries to fix all missing package errors
          # 2. Disable internal code signing so CMake doesn't ask for a Team ID
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DENABLE_METAL=ON \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix fmt);$(brew --prefix sdl2);$(brew --prefix sdl2_mixer);$(brew --prefix sdl2_ttf)" \
            -DCURL_LIBRARY=$(brew --prefix curl)/lib/libcurl.dylib \
            -DCURL_INCLUDE_DIR=$(brew --prefix curl)/include \
            -DFREETYPE_LIBRARY=$(brew --prefix freetype)/lib/libfreetype.dylib \
            -DFREETYPE_INCLUDE_DIRS=$(brew --prefix freetype)/include/freetype2
          
          cmake --build build --target UnleashedRecomp

      - name: Create Validated IPA
        run: |
          mkdir -p Payload/Unleashed.app

          # Capture the ~26MB engine binary
          BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f -size +10M | head -n 1)
          if [ -z "$BINARY_PATH" ]; then BINARY_PATH=$(find ./build -name "UnleashedRecomp" -type f | head -n 1); fi
          
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # Icon handling from the root folder (icon.png)
          if [ -f "icon.png" ]; then
            cp icon.png Payload/Unleashed.app/AppIcon.png
          else
            touch Payload/Unleashed.app/AppIcon.png
          fi

          # Strictly valid Info.plist with File Sharing enabled
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundleDisplayName</key>
              <string>Sonic Unleashed</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.png</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          echo -n "APPL????" > Payload/Unleashed.app/PkgInfo
          zip -ry Sonic_Unleashed_Full.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Sonic_Unleashed_Full.ipa
