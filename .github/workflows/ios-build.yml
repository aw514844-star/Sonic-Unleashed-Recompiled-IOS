name: ABSOLUTE_ZERO_ULTIMATE_BUILD
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 1. Deep Reset & Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 2. Force Engine & Asset Injection
        run: |
          git submodule update --init --recursive --force || true
          mkdir -p UnleashedRecompLib/private/
          # Finds your assets regardless of where you uploaded them
          find . -name "default.xex" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "default.xexp" -exec cp -v {} UnleashedRecompLib/private/ \; || true
          find . -name "shader.ar*" -exec cp -v {} UnleashedRecompLib/private/ \; || true

      - name: 3. iPad 9 "Smoothness" Tweaks
        run: |
          # Forces 720p and 0.5 Scale to save the 3GB RAM from crashing
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.json" -o -name "*.toml" \) -exec sed -i '' 's/1920/1280/g' {} + || true
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.json" -o -name "*.toml" \) -exec sed -i '' 's/1080/720/g' {} + || true
          find . -type f -name "*.toml" -exec sed -i '' 's/ResolutionScale = 1.0/ResolutionScale = 0.5/g' {} + || true
          # Inject Memory Entitlement so iPadOS doesn't kill the app
          find . -name "Info.plist" -exec sed -i '' '/<dict>/a \
          <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>' {} + || true

      - name: 4. Dynamic Discovery & Build (Bypassing All Exit Codes)
        run: |
          brew install glslang molten-vk vulkan-headers || true
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Schemes:" | tail -n 1 | xargs)
          
          # The "Identity -" trick fixes Exit 65/70 for good
          xcodebuild clean build \
          -project "$PROJ_FILE" \
          -scheme "$SCHEME_NAME" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. The Titan Hunt (Fixes 1KB IPA)
        run: |
          mkdir -p Payload
          # Search EVERYWHERE for the built .app
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -rv {} Payload/ \; || true
          find . -name "*.app" -type d -not -path "./Payload/*" -exec cp -rv {} Payload/ \; || true
          
          if [ -n "$(ls -A Payload 2>/dev/null)" ]; then
            zip -r9 Sonic_Unleashed_iPad9_Ultimate.ipa Payload
          else
            echo "STILL EMPTY: The build failed to create an app. Check Step 4 logs."
            exit 1
          fi

      - name: 6. Final Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Unleashed-FINAL-IPA
          path: Sonic_Unleashed_iPad9_Ultimate.ipa
