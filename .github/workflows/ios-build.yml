name: Build Sonic Unleashed iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          # Install dependencies (adjust based on your specific repo needs)
          # e.g., brew install cmake
          mkdir -p build Payload/Unleashed.app

      - name: Compile Game Engine
        run: |
          # REPLACE THIS LINE with your actual build command
          # (e.g., cmake .. && make or xcodebuild)
          # For this example, we assume your binary is named 'UnleashedRecomp'
          echo "Building..."
          # cp path/to/compiled/binary Payload/Unleashed.app/UnleashedRecomp

      - name: Fix Binary and Structure
        run: |
          # 1. MARK AS EXECUTABLE (Crucial to prevent instant crash)
          chmod +x Payload/Unleashed.app/UnleashedRecomp
          
          # 2. CREATE PKGINFO
          echo -n "APPL????" > Payload/Unleashed.app/PkgInfo

          # 3. GENERATE INFO.PLIST
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.unleashed.recomp</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundleDisplayName</key>
              <string>Sonic Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          # -r recursive, -y preserve symlinks/permissions
          zip -ry Sonic_Unleashed_iOS.ipa Payload
          echo "IPA Size: $(du -sh Sonic_Unleashed_iOS.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-IPA
          path: Sonic_Unleashed_iOS.ipa
