name: Sonic Unleashed iPad 9 - 100th Try No-Fail
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rule 2: Force Asset Detection
        run: |
          mkdir -p UnleashedRecompLib/Private
          echo "Verifying default.xex, default.xexp, and shader.ar..."
          ls -lh UnleashedRecompLib/Private/
          if [ ! -f "UnleashedRecompLib/Private/default.xex" ]; then
            echo "::error::CRITICAL: default.xex NOT FOUND in UnleashedRecompLib/Private. Upload it to GitHub first!"
            exit 1
          fi

      - name: Force Build (Ignore Exit Codes 1, 65, 66, 70, 128)
        run: |
          # Rule 1 & 3: Total Signing Bypass + Error Suppression
          set +e
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \

            | xcpretty || true
          
          EXIT_CODE=$?
          BLOCK_LIST=(1 65 66 70 128)
          if [[ " ${BLOCK_LIST[@]} " =~ " ${EXIT_CODE} " ]]; then
            echo "Bypassing blocked exit code: $EXIT_CODE"
          fi
          set -e

      - name: Rule 8: Manual 'No-Empty' IPA Packaging
        run: |
          # Locate the .app folder - using a wide search to ensure we find it
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -print -quit)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in DerivedData. Forcing a fallback search..."
            APP_PATH=$(find . -name "*.app" -type d -print -quit)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::FATAL: Build produced no output. Check your code for syntax errors."
            exit 1
          fi

          # Create Payload and Force Copy
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Rule 8 Check: Verify binary size is > 0
          BINARY_NAME=$(basename "$APP_PATH" .app)
          if [ ! -s "Payload/$BINARY_NAME.app/$BINARY_NAME" ]; then
             echo "::error::Empty binary detected inside .app! Build is invalid."
             exit 1
          fi

          zip -r Unleashed_Final_iPad9.ipa Payload
          echo "IPA Size:"
          du -sh Unleashed_Final_iPad9.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad9-Build
          path: Unleashed_Final_iPad9.ipa
          if-no-files-found: error
