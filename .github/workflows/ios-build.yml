      - name: Inject
        run: |
          mkdir -p Payload/Unleashed.app
          APP_PATH=$(find ./Standard.xcarchive -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" Payload/Unleashed.app/
          fi

          # 1. FIXED IDENTITY CARD (Matches Executable)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.sythjr.unleashed</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 2. THE FIX: Find the actual binary and rename it to UnleashedRecomp
          # This stops the 'Missing Bundle Executable' error
          cd Payload/Unleashed.app/
          REAL_BINARY=$(find . -maxdepth 1 -type f -not -name ".*" -not -name "Info.plist" -perm +111 | head -n 1)
          if [ -n "$REAL_BINARY" ]; then
            mv "$REAL_BINARY" UnleashedRecomp
          fi
          cd ../..

          # 3. Inject Assets
          cp UnleashedRecompLib/Private/default.xex Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/default.xexp Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/shader.ar Payload/Unleashed.app/ || true
          
          zip -r Unleashed_Standard.ipa Payload
          SIZE=$(stat -f%z "Unleashed_Standard.ipa")
          echo "IPA SIZE IS $SIZE BYTES"
