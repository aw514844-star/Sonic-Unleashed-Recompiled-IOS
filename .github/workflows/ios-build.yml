name: Unleashed Recomp iPad 9 OMEGA v10
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: brew install ninja cmake

      - name: Build Engine (Stability Focus)
        run: |
          rm -rf build_ios
          # Forcing iPad 9 (A13) architecture and iOS SDK alignment
          cmake -S . -B build_ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_JIT=ON \
            -DFALLBACK_INTERPRETER=ON \
            -DOPTIMIZE_FOR_A13=ON \
            -DCONTROLLER_PS4=ON
          
          cmake --build build_ios --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Construct Verified IPA (All-Inclusive)
        run: |
          rm -rf Payload Unleashed_Final.ipa
          mkdir -p Payload/Unleashed.app
          
          # 1. FIND AND MOVE MAIN EXECUTABLE
          # Filters out libraries and grabs the largest relevant executable
          BINARY_PATH=$(find build_ios -type f -perm +111 ! -name "*.a" ! -name "*.dylib" | grep -i "Unleashed" | xargs du -a | sort -n -r | head -n 1 | awk '{print $2}')
          
          if [ -z "$BINARY_PATH" ]; then
            echo "❌ ERROR: Build failed to produce a binary."
            exit 1
          fi
          
          cp "$BINARY_PATH" Payload/Unleashed.app/UnleashedRecompiOSD
          
          # 2. INJECT GAME DATA (Lowercase 'private' folder)
          echo "📥 Injecting game data from UnleashedRecompLib/private..."
          
          cp UnleashedRecompLib/private/default.xex Payload/Unleashed.app/ 2>/dev/null || echo "⚠️ default.xex not found"
          cp UnleashedRecompLib/private/default.xexp Payload/Unleashed.app/ 2>/dev/null || echo "⚠️ default.xexp not found"
          cp UnleashedRecompLib/private/shader.ar Payload/Unleashed.app/ 2>/dev/null || echo "⚠️ shader.ar not found"

          # 3. ZERO-CRASH CONFIGURATION
          cat <<EOF > Payload/Unleashed.app/config.toml
          [Video]
          GraphicsAPI = "Metal"
          ResolutionScale = 1.0
          FrameRateLimit = 60
          FullScreen = true
          AspectRatio = "4:3"
          [Input]
          ControllerEnabled = true
          GamepadType = "DualShock4"
          [Core]
          # Hybrid Mode: Uses Interpreter if JIT is denied to prevent launch crashes
          JIT_Mode = "Hybrid" 
          SafeMode = true
          IgnoreMissingAssets = true
          DataPath = "./"
          EOF

          # 4. FINALIZED INFO.PLIST (iPad + PS4 Support)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecompiOSD</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string><string>metal</string></array>
              <key>UIRequiresFullScreen</key><true/>
              <key>UIStatusBarHidden</key><true/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>GCSupportedGameControllers</key>
              <array>
                  <dict><key>ProfileName</key><string>ExtendedGamepad</string></dict>
              </array>
              <key>GCControllerUserCustomizableConfigurations</key><true/>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <key>CSResourcesFileMapped</key><true/>
              <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>
          </dict>
          </plist>
          EOF

          # 5. PERMISSIONS & ZIP
          chmod +x Payload/Unleashed.app/UnleashedRecompiOSD
          chmod -R 755 Payload/Unleashed.app/
          zip -ry Unleashed_Final.ipa Payload
          
          echo "✅ SUCCESS: All-inclusive OMEGA IPA Verified."

      - name: Final Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iPad9-SafeMode-OMEGA
          path: Unleashed_Final.ipa
