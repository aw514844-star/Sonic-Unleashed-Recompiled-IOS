name: Sonic Unleashed Final
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Engine
        run: |
          set +e
          # Rule 1 & 3: Total bypass. We don't specify a path, we let it build anywhere.
          xcodebuild build \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          exit 0

      - name: Inject
        run: |
          mkdir -p Payload/Unleashed.app
          
          # 1. GLOBAL HUNT: Find any .app folder on the entire runner
          # This fixes the "No such file or directory" error forever.
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH/" Payload/Unleashed.app/
          fi

          # 2. Fix the Identity Card (Info.plist)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.sythjr.unleashed</string>
              <key>CFBundleName</key>
              <string>Unleashed</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 3. Rename the Binary (Fixes the Black Icon/No Open error)
          cd Payload/Unleashed.app/
          # Look for the actual executable file (biggest file)
          BINARY=$(find . -maxdepth 1 -type f -size +1M | head -n 1)
          if [ -n "$BINARY" ]; then
            mv "$BINARY" UnleashedRecomp
          fi
          chmod +x UnleashedRecomp
          cd ../..

          # 4. Final Injection
          cp UnleashedRecompLib/Private/default.xex Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/default.xexp Payload/Unleashed.app/ || true
          cp UnleashedRecompLib/Private/shader.ar Payload/Unleashed.app/ || true
          
          zip -r Unleashed_Standard.ipa Payload
          SIZE=$(stat -f%z "Unleashed_Standard.ipa")
          echo "IPA SIZE: $SIZE bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Standard-IPA
          path: Unleashed_Standard.ipa
