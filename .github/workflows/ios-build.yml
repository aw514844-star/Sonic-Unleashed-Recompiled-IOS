name: Sonic Unleashed Final - ULTIMATE
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          # 1. FORCE PROJECT DISCOVERY (Solves Error 66 & 65)
          # We search for any xcodeproj but specifically EXCLUDE the thirdparty one that caused the previous crash
          PROJECT_FILE=$(find . -name "*.xcodeproj" ! -path "*/thirdparty/*" | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "Brute forcing search for any project..."
            PROJECT_FILE=$(find . -name "*.xcodeproj" | grep -v "concurrentqueue" | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "CRITICAL: No project file found. Listing directory for debug:"
            ls -R
            exit 1
          fi

          echo "TARGET PROJECT: $PROJECT_FILE"

          # 2. XCODEBUILD (Hardened for Dev Accounts)
          xcodebuild build -project "$PROJECT_FILE" \
            -scheme "UnleashedRecomp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGN_ALLOWED=YES

      - name: Emergency Inject & Fix
        run: |
          mkdir -p Payload/Unleashed.app
          
          # 3. MAGIC NUMBER FIX (Solves 0x69636e73 error for iLoader)
          # We check the file header to ensure it's a Mach-O binary and NOT an icon
          RAW_BINARY=$(find ./DerivedData -name "UnleashedRecomp" -type f | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          
          if [ -z "$RAW_BINARY" ]; then
            echo "Primary binary search failed, performing deep scan for Mach-O files..."
            RAW_BINARY=$(find ./DerivedData -type f -perm +111 ! -name "*.dylib" ! -name "*.plist" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi

          if [ -z "$RAW_BINARY" ]; then
            echo "ERROR: Executable not found in DerivedData. Searching workspace..."
            RAW_BINARY=$(find . -type f -perm +111 -name "UnleashedRecomp" | xargs file | grep "Mach-O" | cut -d: -f1 | head -n 1)
          fi

          if [ -z "$RAW_BINARY" ]; then exit 1; fi
          
          echo "VALID BINARY FOUND: $RAW_BINARY"
          cp "$RAW_BINARY" Payload/Unleashed.app/UnleashedRecomp
          chmod +x Payload/Unleashed.app/UnleashedRecomp

          # 4. 50MB SIZE FIX (Asset & Library Vacuum)
          # Grab all dynamic libraries to prevent launch crashes
          find ./DerivedData -name "*.dylib" -exec cp {} Payload/Unleashed.app/ \; || true
          
          # Grab known library folder
          if [ -d "UnleashedRecompLib/Private" ]; then
            cp -r UnleashedRecompLib/Private/* Payload/Unleashed.app/
          fi
          
          # Vacuum up everything that looks like game data to ensure the 50MB+ target
          find . -type d \( -name "assets" -o -name "data" -o -name "textures" -o -name "res" \) \
            -not -path "./DerivedData/*" \
            -not -path "*/thirdparty/*" \
            -exec cp -r {} Payload/Unleashed.app/ \; || true

          # 5. INFO.PLIST GENERATION (Strict iLoader Format)
          cat <<EOF > Payload/Unleashed.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>UnleashedRecomp</string>
              <key>CFBundleIdentifier</key><string>com.unleashed.recomp</string>
              <key>CFBundleName</key><string>Unleashed</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>15.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          # 6. PACKAGING
          zip -r Unleashed_Final.ipa Payload
          echo "SUCCESS: IPA generated."
          echo "FINAL SIZE: $(du -sh Unleashed_Final.ipa)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Final-IPA
          path: Unleashed_Final.ipa
