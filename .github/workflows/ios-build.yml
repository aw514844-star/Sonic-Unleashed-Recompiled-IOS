name: Sonic Unleashed Universal Fix
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force Build Anything Found
        run: |
          # 1. Find the project and scheme automatically
          PROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | grep "iOS" | xargs | head -n 1)
          
          # 2. Build to a specific folder we create right now
          mkdir -p output_folder
          xcodebuild build \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "output_folder" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || echo "Ignoring errors..."

      - name: Force Zip
        run: |
          mkdir -p Payload
          # Search everywhere for the .app folder and copy it
          APP=$(find output_folder -name "*.app" -type d | head -n 1)
          if [ -d "$APP" ]; then
            cp -R "$APP" Payload/
            zip -r Unleashed_iPad9.ipa Payload
          else
            echo "STILL NO APP FOUND. Check if your game files are in UnleashedRecompLib/private/"
            exit 1
          fi
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed_iPad9_Final
          path: Unleashed_iPad9.ipa
